# Dependabot version updates (audit 2026-10-06 P2-11, Task 5077b641).
#
# Minor and patch updates are grouped into one pull request per dependency
# type; a major update belongs to no group and arrives on its own.
# package.json pins almost every version exactly (two caret ranges remain:
# @supabase/supabase-js and the gcp-metadata override), so the strategy is
# "increase": a pin is raised, never widened to a range.
#
# A Dependabot pull request carries no Clued work claim and changes protected
# paths (package.json, package-lock.json), so the
# clued-work-admission check admits it only after the Owner does what
# CONTRIBUTING.md ("Dependabot pull requests") describes. (Until Merge
# Admission step 6, 2026-10-09, an unset repository variable
# CLUED_WORK_ADMISSION_ENFORCE made the check advisory; it is no longer read.)
# GitHub Actions versions are not updated here (Owner, 2026-11-14): a weekly grouped pull
# request re-ran about twenty workflows on every rebase; actions are raised by hand when needed.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/clued-cloud
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    versioning-strategy: increase
    groups:
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps
