name: CI temporary storage
description: Keep transient files inside the runner's job-owned temporary directory.
inputs:
  isolate-promptfoo:
    description: Put promptfoo configuration and transient evaluation state in job temporary storage.
    default: 'false'
runs:
  using: composite
  steps:
    - if: runner.os != 'Windows'
      shell: bash
      env:
        CI_TEMP_ISOLATE_PROMPTFOO: ${{ inputs.isolate-promptfoo }}
      run: |
        if command -v node >/dev/null 2>&1; then
          node "$GITHUB_ACTION_PATH/setup.mjs"
        else
          python3 "$GITHUB_ACTION_PATH/setup.py"
        fi
    - if: runner.os == 'Windows'
      shell: powershell
      env:
        CI_TEMP_ISOLATE_PROMPTFOO: ${{ inputs.isolate-promptfoo }}
      run: |
        if (Get-Command node -CommandType Application -ErrorAction SilentlyContinue) {
          node "$env:GITHUB_ACTION_PATH/setup.mjs"
        } else {
          python "$env:GITHUB_ACTION_PATH/setup.py"
        }
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
