name: Clued handover hook qualification / company-linux-02

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/clued-work-handover-qualification-*.yml'
      - 'scripts/runner/qualify-work-handover*'
      - '.github/actions/ci-temporary-storage/coverage.json'
      - 'scripts/ci/clued-gated-proof-profiles.json'
      - 'scripts/ci/clued-gated-proof-role-specs.json'

permissions:
  contents: read

concurrency:
  group: handover-hook-company-linux-02-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  admission-gate:
    name: admission-gate
    runs-on: [self-hosted, Linux, X64, clued, pool-general, trust-internal]
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      admitted: ${{ steps.gate.outputs.admitted }}
      enforced: ${{ steps.gate.outputs.enforced }}
      verdict: ${{ steps.gate.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/clued-work-admission.mjs --mode gate

  qualify:
    name: handover-hook-company-linux-02
    needs: admission-gate
    if: needs.admission-gate.outputs.admitted == 'true' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner))
    runs-on: [self-hosted, Linux, X64, clued, pool-general, trust-internal, cap-docker-linux, runtime-wsl2, runner-company-linux-02]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.19.0
      - name: Verify source candidate or protected installed code
        shell: bash
        env:
          EXPECTED_RUNNER: clued-ci-company-linux-02
          QUALIFICATION_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "$EXPECTED_RUNNER"
          probe_args=(--public-config apps/clued-cloud/app/supabase-public-config.ts)
          if [[ "$QUALIFICATION_EVENT" == pull_request ]]; then probe_args+=(--candidate --hook scripts/runner/clued-runner-job-started.mjs); fi
          node scripts/runner/qualify-work-handover.mjs "${probe_args[@]}" > handover-hook-qualification.json
          cat handover-hook-qualification.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: handover-hook-company-linux-02-${{ github.run_id }}
          path: handover-hook-qualification.json
          if-no-files-found: error
          retention-days: 90
