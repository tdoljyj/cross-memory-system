name: Temporary self-hosted Python repair smoke

on:
  push:
    branches:
      - ci/self-hosted-p3-windows-onboarding-20260918

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, Windows, X64, clued, pool-general, trust-internal, cap-python312]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify Python capability without setup-python
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python --version
          python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version; print(sys.executable)"
          $venv = Join-Path $env:RUNNER_TEMP "clued-python-repair-smoke"
          Remove-Item $venv -Recurse -Force -ErrorAction SilentlyContinue
          python -m venv $venv
          & "$venv\Scripts\python.exe" -c "import json, pathlib; print('runner-venv-ok')"
          Remove-Item $venv -Recurse -Force
