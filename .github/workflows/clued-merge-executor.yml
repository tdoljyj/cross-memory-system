name: clued-merge-executor

# Merge Admission v0.1 §7.2–§7.4, step 5 of §13 (Task 91039d74; Owner
# Decisions 661f8c36 and 5aa668e3): the executor does the head of the merge
# queue's work (scripts/ci/clued-merge-executor.mjs). For the pull request
# whose claim heads the default branch's merge queue it brings the default
# branch in when the head is behind, and once the head is up to date,
# admitted, opted in for that head ("Clued-Auto-Merge: <head sha>" in the
# body) and every CI workflow that ran on it passed, its gated jobs run
# (non-protected claims may also opt in by renewing at the full head SHA),
# (Task 114d43cf), turns on auto-merge, or merges it itself when GitHub can
# already merge it (Task ff476b06). It acts as
# the clued-admission App and needs Contents: write and Pull requests: write;
# until the Owner grants them it only reports. It does nothing in frozen.
#
# This workflow runs on each push to main and by hand. It first reports CI
# state, so either entry point can safely replace the other's pending job.
# The slot report calls the same executor script as its final step, without
# starting another
# workflow. Missed completion events recover on a later main push or explicit
# coordination.
# Every trigger runs this file and the script from the default branch, with
# the clued-admission environment's token and App key (deployment branches
# limited to main); a pull request cannot change them for its own run. The
# triggering event is only a signal: the script reads the pull requests,
# check runs and Clued's queue itself.

on:
  # A merge moves the default branch; the next queue head is then behind (confirmation review MINOR-a).
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      measurement_opt_in:
        description: Explicit holder operation through the recorded original gates
        type: boolean
        default: false
      measurement_operation:
        description: The explicitly requested operation
        type: choice
        options: [update_branch, cancel_ci_attempt]
      measurement_pr:
        description: Exact current pull request number
        type: string
      measurement_head:
        description: Exact current pull request head SHA
        type: string
      measurement_run:
        description: Exact Native run id for an optional cancellation
        type: string
      measurement_attempt:
        description: Exact Native run attempt for an optional cancellation
        type: string
      measurement_reason:
        description: Explicit holder intent; actual main-move evidence is still required
        type: choice
        options: [GENERAL_UPDATE, MAIN_MOVED_REQUIRES_RERUN]

permissions:
  # Full reruns of admitted gate-only runs use this workflow token, not the App.
  actions: write
  checks: read
  contents: read
  pull-requests: read

jobs:
  execute:
    # A new main push is automatic. Only the Owner can start a fresh manual
    # run. Reruns inherit the original actor and must not reacquire write authority.
    if: >-
      vars.CLUED_MERGE_TRAIN_PROTOCOL_VERSION != '2' ||
      (github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner)))
    name: clued-merge-executor
    runs-on: ubuntu-slim
    timeout-minutes: 10
    environment: clued-admission
    # Serialize both executor entry points across workflows; pending work reads
    # the current queue when it starts. Never cancel an executor already running.
    concurrency:
      group: clued-merge-executor
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - name: Self-test the merge slot report and executor (no network, mocked fetch)
        run: node --test scripts/ci/clued-merge-slot-ci.test.mjs scripts/ci/clued-merge-executor.test.mjs
      - name: Report the CI state of the pull requests holding a merge slot
        if: ${{ !inputs.measurement_opt_in }}
        env:
          CLUED_CONTEXT_READ_TOKEN: ${{ secrets.CLUED_ADMISSION_CLUED_TOKEN }}
          CLUED_ADMISSION_APP_ID: ${{ secrets.CLUED_ADMISSION_APP_ID }}
          CLUED_ADMISSION_APP_PRIVATE_KEY: ${{ secrets.CLUED_ADMISSION_APP_KEY }}
          CLUED_MERGE_ADMISSION_STATE: ${{ vars.CLUED_MERGE_ADMISSION_STATE }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/clued-merge-slot-ci.mjs
      - name: Bring the default branch into the queue head, turn on auto-merge or merge it
        timeout-minutes: 5
        env:
          CLUED_MERGE_TRAIN_PROTOCOL_VERSION: ${{ vars.CLUED_MERGE_TRAIN_PROTOCOL_VERSION }}
          CLUED_CONTEXT_READ_TOKEN: ${{ secrets.CLUED_ADMISSION_CLUED_TOKEN }}
          CLUED_ADMISSION_APP_ID: ${{ secrets.CLUED_ADMISSION_APP_ID }}
          CLUED_ADMISSION_APP_PRIVATE_KEY: ${{ secrets.CLUED_ADMISSION_APP_KEY }}
          CLUED_MERGE_ADMISSION_STATE: ${{ vars.CLUED_MERGE_ADMISSION_STATE }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/clued-merge-executor.mjs
      - name: Export the closed local natural R9 packet
        if: ${{ always() }}
        run: node scripts/ci/merge-admission-source-producer.mjs --export executor
      - name: Preserve natural R9 source observations
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clued-r9-natural-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: .clued-r9-source-events/sealed/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/natural-packet.json
          if-no-files-found: warn
          retention-days: 90
