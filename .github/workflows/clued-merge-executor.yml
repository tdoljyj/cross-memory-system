name: clued-merge-executor

# Merge Admission v0.1 §7.2–§7.4, step 5 of §13 (Task 91039d74; Owner
# Decisions 661f8c36 and 5aa668e3): the executor does the head of the merge
# queue's work (scripts/ci/clued-merge-executor.mjs). For the pull request
# whose claim heads the default branch's merge queue it brings the default
# branch in when the head is behind, and turns on auto-merge once the head is
# up to date, admitted and opted in for that head ("Clued-Auto-Merge: <head
# sha>" in the body); GitHub then waits for the required checks. When GitHub
# can already merge it and every CI workflow ran and passed on that head, the
# executor merges it itself (Task ff476b06). It acts as
# the clued-admission App and needs Contents: write and Pull requests: write;
# until the Owner grants them it only reports. It does nothing in frozen.
#
# It runs after each clued-merge-slot-ci run (which runs when a pull
# request's CI run completes), on each push to main, and by hand. Missed
# completion events recover on a later main push or explicit coordination.
# Every trigger runs this file and the script from the default branch, with
# the clued-admission environment's token and App key (deployment branches
# limited to main); a pull request cannot change them for its own run. The
# triggering event is only a signal: the script reads the pull requests,
# check runs and Clued's queue itself.

on:
  # A merge moves the default branch; the next queue head is then behind (confirmation review MINOR-a).
  push:
    branches: [main]
  workflow_run:
    workflows:
      - clued-merge-slot-ci
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

# One run at a time; a pending run reads the state as it is then.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  execute:
    name: clued-merge-executor
    # A slot report skipped for a push or schedule run changed nothing (review MINOR-5).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    environment: clued-admission
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Self-test the executor (no network, mocked fetch)
        run: node --test scripts/ci/clued-merge-executor.test.mjs
      - name: Bring the default branch into the queue head, turn on auto-merge or merge it
        env:
          CLUED_CONTEXT_READ_TOKEN: ${{ secrets.CLUED_ADMISSION_CLUED_TOKEN }}
          CLUED_ADMISSION_APP_ID: ${{ secrets.CLUED_ADMISSION_APP_ID }}
          CLUED_ADMISSION_APP_PRIVATE_KEY: ${{ secrets.CLUED_ADMISSION_APP_KEY }}
          CLUED_MERGE_ADMISSION_STATE: ${{ vars.CLUED_MERGE_ADMISSION_STATE }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/clued-merge-executor.mjs
