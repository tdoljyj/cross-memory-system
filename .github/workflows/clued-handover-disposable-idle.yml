# Candidate External2 idle Source; no App/PG/Clued secret, no readonly-purpose inheritance.
name: Clued disposable cancellation fixture
on:
  pull_request:
    paths:
      - '.github/workflows/clued-handover-disposable-idle.yml'
      - 'scripts/ci/clued-handover-external-*'
  workflow_dispatch:
    inputs:
      admission_run_id:
        description: Existing exact workflow/ref dispatch admission
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: clued-handover-idle-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  admission-gate:
    name: admission-gate
    runs-on: [self-hosted, Linux, X64, clued, pool-general, trust-internal]
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      admitted: ${{ steps.gate.outputs.admitted }}
      enforced: ${{ steps.gate.outputs.enforced }}
      verdict: ${{ steps.gate.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/clued-work-admission.mjs --mode gate

  disposable-idle:
    name: disposable-idle
    needs: admission-gate
    if: >-
      needs.admission-gate.outputs.admitted == 'true' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor_id == '52366662' && github.triggering_actor == github.repository_owner) ||
       (github.event_name == 'workflow_dispatch' &&
        startsWith(github.ref, 'refs/heads/clued-handover-disposable-')))
    runs-on: [self-hosted, Linux, X64, clued, trust-internal, handover-native-task617-once]
    timeout-minutes: 45
    environment: clued-handover-source-only
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
      - name: Refuse until independent Native E1 qualification
        run: node scripts/ci/clued-handover-native-entry.mjs --check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.19.0
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - name: Bounded idle process to prove real provider cancellation
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            node scripts/ci/clued-handover-external-source-check.mjs --candidate-check
          else
            sleep 2400
          fi
