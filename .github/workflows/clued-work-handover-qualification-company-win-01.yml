name: Clued handover hook qualification / company-win-01

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/clued-work-handover-qualification-*.yml'
      - 'scripts/runner/qualify-work-handover*'
      - '.github/actions/ci-temporary-storage/coverage.json'
      - 'scripts/ci/clued-gated-proof-profiles.json'
      - 'scripts/ci/clued-gated-proof-role-specs.json'

permissions:
  contents: read

concurrency:
  group: handover-hook-company-win-01-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  admission-gate:
    name: admission-gate
    runs-on: [self-hosted, Linux, X64, clued, pool-general, trust-internal]
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      admitted: ${{ steps.gate.outputs.admitted }}
      enforced: ${{ steps.gate.outputs.enforced }}
      verdict: ${{ steps.gate.outputs.verdict }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/clued-work-admission.mjs --mode gate

  qualify:
    name: handover-hook-company-win-01
    needs: admission-gate
    if: needs.admission-gate.outputs.admitted == 'true' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner))
    runs-on: [self-hosted, Windows, X64, clued, pool-general, trust-internal, cap-python312, cap-node24, site-company]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Verify source candidate or protected installed code
        shell: powershell
        env:
          EXPECTED_RUNNER: clued-ci-company-win-01
          QUALIFICATION_EVENT: ${{ github.event_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne $env:EXPECTED_RUNNER) { throw 'Runner route mismatch.' }
          $probeArgs=@('--public-config','apps/clued-cloud/app/supabase-public-config.ts')
          if ($env:QUALIFICATION_EVENT -eq 'pull_request') { $probeArgs+=@('--candidate','--hook','scripts/runner/clued-runner-job-started.mjs') }
          $report = & node scripts/runner/qualify-work-handover.mjs @probeArgs
          if ($LASTEXITCODE -ne 0) { throw 'Hook qualification failed.' }
          Set-Content -LiteralPath handover-hook-qualification.json -Value $report -Encoding UTF8
          Write-Output $report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: handover-hook-company-win-01-${{ github.run_id }}
          path: handover-hook-qualification.json
          if-no-files-found: error
          retention-days: 90
