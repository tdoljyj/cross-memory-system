name: clued-release-tags

# Keeps git tags in step with the root VERSION and with production releases
# (Task 6dfd7560, development/contracts/components/ComponentVersioning.v0.1.md):
# - a push to main that changes VERSION tags the commit that set it with the
#   exact VERSION text (for example Clued-v1.6), like vNext-1.3 and vNext-2.0;
# - a successful production deploy tags the deployed commit
#   release/<date>-r<run number>, with VERSION and component versions.
# Tags are created once and never moved. Default-branch code only, no PR
# trigger, no install; workflow_dispatch backfills a missing tag.
# Pushing a tag on a commit whose workflow files differ from main needs the
# workflows permission, which GITHUB_TOKEN cannot have, so tags are pushed with
# the secret CLUED_RELEASE_TAG_TOKEN: a fine-grained token for this
# repository with Contents and Workflows read/write. GITHUB_TOKEN only reads.
# Re-review 7, m5: the job runs in the main-only clued-release environment, so
# the token can live there instead of at repository level, where any branch's
# on: push workflow could read it; the Owner moves it there.

on:
  push:
    branches: [main]
    paths: ['VERSION']
  workflow_run:
    workflows: ['Clued Cloud production release']
    types: [completed]
  workflow_dispatch:
    inputs:
      product:
        description: Create the product version tag for the VERSION on main if it is missing
        type: boolean
        default: false
      release_run_id:
        description: Run id of a successful production deploy to tag (backfill)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: clued-release-tags
  cancel-in-progress: false

jobs:
  tag:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: clued-release
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require the tag token
        env:
          TAG_TOKEN: ${{ secrets.CLUED_RELEASE_TAG_TOKEN }}
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/clued-pycache
          WRANGLER_LOG_PATH: ${{ runner.temp }}/clued-wrangler-logs
        run: |
          if [ -z "$TAG_TOKEN" ]; then
            echo "::error::Secret CLUED_RELEASE_TAG_TOKEN (clued-release environment) is not set: tags need a token with Contents and Workflows write for this repository; GITHUB_TOKEN cannot have the workflows permission."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.CLUED_RELEASE_TAG_TOKEN }}
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - name: Product version tag
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.product)
        run: python3 scripts/ci/clued_release_tags.py product --ref origin/main --apply
      - name: Release tag
        if: github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.release_run_id != '')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.release_run_id }}
        run: python3 scripts/ci/clued_release_tags.py release --run-id "$RUN_ID" --apply
