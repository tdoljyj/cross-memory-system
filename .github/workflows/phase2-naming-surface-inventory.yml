name: Phase2 Naming Surface Inventory

on:
  workflow_dispatch:
  push:
    branches:
      - phase2-naming-surface-inventory

permissions:
  contents: read
  actions: read

jobs:
  inventory:
    name: Inventory Clued naming surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCOPE_PATH: artifacts/clued-validation/structure-freeze-prep/naming/NamingSurfaceInventoryScope.json

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - name: Bind inventory staging to this job
        run: |
          printf 'SOURCE_DIR=%s\nOUTPUT_DIR=%s\n' \
            "$RUNNER_TEMP/clued-naming-surface-source" \
            "$RUNNER_TEMP/clued-naming-surface-inventory" >> "$GITHUB_ENV"
      - name: Prepare exact-blob source worktree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          GIT_LFS_SKIP_SMUDGE=1 git worktree add --detach "$SOURCE_DIR" "$GITHUB_SHA"

          # Inventory must observe exact Git blobs, including retained JSON
          # evidence with CRLF and binary archives. The inherited text rule can
          # normalize either kind. Disable conversion for this read-only source
          # worktree, then rematerialize the index without changing source blobs.
          attributes_file="$(git -C "$SOURCE_DIR" rev-parse --git-path info/attributes)"
          mkdir -p "$(dirname "$attributes_file")"
          cat > "$attributes_file" <<'ATTRS'
          * -text
          ATTRS
          GIT_LFS_SKIP_SMUDGE=1 git -C "$SOURCE_DIR" checkout-index -a -f

          status="$(git -C "$SOURCE_DIR" status --porcelain=v1 --untracked-files=all)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            echo "exact-blob source worktree is not clean" >&2
            exit 1
          fi

          python - "$SOURCE_DIR" "$OUTPUT_DIR" "$GITHUB_SHA" <<'PY'
          import hashlib
          import json
          import subprocess
          import sys
          from pathlib import Path

          source = Path(sys.argv[1])
          output = Path(sys.argv[2])
          commit = sys.argv[3]
          attributes = (source / ".gitattributes").read_bytes()
          record = {
              "schema": "clued.naming-inventory-checkout-normalization-evidence/v1",
              "source_commit": commit,
              "repository_gitattributes_sha256": hashlib.sha256(attributes).hexdigest(),
              "repository_gitattributes_text": attributes.decode("utf-8"),
              "observed_problem": "The inherited wildcard text attribute rewrote ZIP bytes and normalized retained CRLF JSON evidence in default checkouts.",
              "exact_blob_scope": "all tracked files, without text or end-of-line conversion",
              "runner_local_override_only": True,
              "repository_bytes_modified": False,
              "source_status_after_exact_blob_rematerialization": subprocess.check_output(
                  ["git", "-C", str(source), "status", "--porcelain=v1", "--untracked-files=all"],
                  text=True,
              ),
              "authority_effect": "NONE",
          }
          (output / "CheckoutNormalizationEvidence.json").write_text(
              json.dumps(record, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Generate read-only repository and GitHub inventory
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euo pipefail
          python "$SOURCE_DIR/scripts/clued-naming-surface-inventory.py" \
            --repo-root "$SOURCE_DIR" \
            --scope "$SOURCE_DIR/$SCOPE_PATH" \
            --output-dir "$OUTPUT_DIR" \
            --repository "$GITHUB_REPOSITORY" \
            --github-token "$GITHUB_TOKEN" \
            --require-github \
            | tee "$OUTPUT_DIR/GenerationResult.json"

      - name: Validate generated inventory bindings
        run: |
          set -euo pipefail
          python - "$OUTPUT_DIR" "$GITHUB_SHA" "$GITHUB_REPOSITORY" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          output = Path(sys.argv[1])
          expected_sha = sys.argv[2]
          expected_repo = sys.argv[3]

          def load(name):
              path = output / name
              if not path.is_file():
                  raise SystemExit(f"missing output: {name}")
              with path.open(encoding="utf-8") as handle:
                  return json.load(handle)

          manifest = load("NamingSurfaceInventoryManifest.json")
          findings = load("NamingSurfaceInventoryFindings.json")
          result = load("GenerationResult.json")
          checkout = load("CheckoutNormalizationEvidence.json")

          if manifest["source_lock"]["commit_sha"] != expected_sha:
              raise SystemExit("manifest source commit does not match GitHub SHA")
          if manifest["source_lock"]["repository"] != expected_repo:
              raise SystemExit("manifest repository does not match GitHub repository")
          if manifest["authority_effect"] != "NONE":
              raise SystemExit("inventory must have no authority effect")
          if manifest["boundaries"]["renaming_or_migration_performed"]:
              raise SystemExit("inventory falsely reports a rename or migration")
          if manifest["boundaries"]["registry_root_catalog_created"]:
              raise SystemExit("inventory falsely reports Registry Root Catalog creation")
          if not manifest["github_inventory"]["pagination_complete"]:
              raise SystemExit("GitHub pagination is incomplete")
          if findings["source_manifest_record_id"] != manifest["record_id"]:
              raise SystemExit("findings do not bind the generated manifest")
          if findings["count"] != len(findings["findings"]):
              raise SystemExit("findings count mismatch")
          if checkout["source_commit"] != expected_sha or checkout["source_status_after_exact_blob_rematerialization"] != "":
              raise SystemExit("exact-blob checkout normalization evidence is invalid")
          if not checkout["runner_local_override_only"] or checkout["repository_bytes_modified"]:
              raise SystemExit("checkout normalization crossed its read-only boundary")

          for filename, digest_key in (
              ("NamingSurfaceInventoryManifest.json", "manifest_sha256"),
              ("NamingSurfaceInventoryFindings.json", "findings_sha256"),
              ("NamingSurfaceInventorySummary.md", "summary_sha256"),
          ):
              actual = hashlib.sha256((output / filename).read_bytes()).hexdigest()
              if result[digest_key] != actual:
                  raise SystemExit(f"generation result digest mismatch: {filename}")

          print(json.dumps({
              "status": manifest["status"],
              "tracked_entries": manifest["aggregate"]["tracked_entries"],
              "identifier_tokens": manifest["aggregate"]["identifier_tokens"],
              "inventory_observations": manifest["aggregate"]["inventory_observations"],
              "pending_external_surfaces": manifest["aggregate"]["unresolved_external_surface_count"],
          }, sort_keys=True))
          PY

      - name: Verify inventory completeness regressions
        run: python -m unittest discover -s "$SOURCE_DIR/tests" -p "test_naming_inventory_*.py"

      - name: Consolidate detached external naming metadata
        run: |
          set -euo pipefail
          python "$SOURCE_DIR/scripts/clued-naming-inventory-consolidate.py" \
            --repository-inventory "$OUTPUT_DIR/NamingSurfaceInventoryManifest.json" \
            --findings "$OUTPUT_DIR/NamingSurfaceInventoryFindings.json" \
            --external-dir "$SOURCE_DIR/artifacts/clued-validation/structure-freeze-prep/naming/external-20260907" \
            --supplemental-dir "$SOURCE_DIR/artifacts/clued-validation/structure-freeze-prep/naming/supplement-20260907" \
            --output-dir "$OUTPUT_DIR"

      - name: Upload naming inventory evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase2-naming-surface-inventory-${{ github.sha }}
          path: |
            ${{ runner.temp }}/clued-naming-surface-inventory/NamingSurfaceInventoryManifest.json
            ${{ runner.temp }}/clued-naming-surface-inventory/NamingSurfaceInventoryFindings.json
            ${{ runner.temp }}/clued-naming-surface-inventory/NamingSurfaceInventorySummary.md
            ${{ runner.temp }}/clued-naming-surface-inventory/GenerationResult.json
            ${{ runner.temp }}/clued-naming-surface-inventory/CheckoutNormalizationEvidence.json
            ${{ runner.temp }}/clued-naming-surface-inventory/NamingSurfaceInventoryConsolidated.json
            ${{ runner.temp }}/clued-naming-surface-inventory/NamingSurfaceInventoryRecords.jsonl
            ${{ runner.temp }}/clued-naming-surface-inventory/Step3Summary.md
          if-no-files-found: error
          retention-days: 90
