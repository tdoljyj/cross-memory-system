name: clued-front-main-merge

# The merge train's front brought up to date with main (Owner Decisions
# 9e2511fe item 3 and 78a3052f item 2; resident DESIGN §80;
# scripts/ci/clued-front-main-merge.mjs). The on-duty node's companion starts
# it when stage 10 says FRONT_NEEDS_MAIN_MERGE (front-merge-dispatch.mjs), with
# the PR and the head the train named; a person may start it the same way.
# As the clued-admission App it does one thing, only when it is still true:
# update-branch of that PR from that head (GitHub merges main in itself and
# refuses a conflict or a moved head), then the App's check kooyumi-main-merge
# on the new merge commit, by which the admission keeps the holder's head
# authorization (migration 20261116090000). It holds no Clued credential.
#
# Only workflow_dispatch: this file and the script run from the default
# branch, with the clued-admission environment's App key (deployment branches
# limited to main); the inputs are only a request, every fact is read again.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number of the train front
        type: string
        required: true
      head:
        description: Its head SHA as the train saw it
        type: string
        required: true

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  admission-gate:
    name: admission-gate
    runs-on: [self-hosted, Linux, X64, clued, pool-general, trust-internal]
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      admitted: ${{ steps.gate.outputs.admitted }}
      enforced: ${{ steps.gate.outputs.enforced }}
      verdict: ${{ steps.gate.outputs.verdict }}
      automation_self_hosted: ${{ steps.gate.outputs.automation_self_hosted }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      # Owner Decision 22b0e0ed: admit on the independent CI's own App 5368905 kooyumi-work-admission
      # check for this exact head, polled for at most 10 minutes; never on another App's check.
      - id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLUED_ADMISSION_GATE_SOURCE: independent-ci-native-work-admission
          CLUED_ADMISSION_GATE_WAIT_SECONDS: "600"
        run: node scripts/ci/clued-work-admission.mjs --mode gate

  merge-main:
    needs: admission-gate
    if: needs.admission-gate.outputs.admitted == 'true' && (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    name: clued-front-main-merge
    # The self-hosted pool, as clued-native617-admission-dispatch.yml with the same environment (new hosted execution is prohibited).
    runs-on: [self-hosted, Linux, X64, clued, pool-general, trust-internal]
    timeout-minutes: 5
    environment: clued-admission
    # One at a time; a second request for the same front reads the state the first one left.
    concurrency:
      group: clued-front-main-merge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - name: Bring main into the train front
        env:
          CLUED_ADMISSION_APP_ID: ${{ secrets.CLUED_ADMISSION_APP_ID }}
          CLUED_ADMISSION_APP_PRIVATE_KEY: ${{ secrets.CLUED_ADMISSION_APP_KEY }}
          CLUED_MERGE_ADMISSION_STATE: ${{ vars.CLUED_MERGE_ADMISSION_STATE }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/clued-front-main-merge.mjs
