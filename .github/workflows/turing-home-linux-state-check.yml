name: turing-home-linux-state-check

on:
  push:
    branches:
      - ops/turing-home-linux-recovery-20260924

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, Windows, X64, clued, pool-general, trust-internal, site-home, cap-python312]
    timeout-minutes: 5
    steps:
      - name: Check current Turing capacity state
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          if ($env:RUNNER_NAME -ne 'clued-ci-home-win-01') { throw "Unexpected runner: $env:RUNNER_NAME" }
          $os = Get-CimInstance Win32_OperatingSystem
          $freeMem = [math]::Round($os.FreePhysicalMemory * 1KB / 1GB, 2)
          $freeDisk = [math]::Round((Get-PSDrive C).Free / 1GB, 1)
          Write-Output "FREE_RAM_GB=$freeMem"
          Write-Output "FREE_C_GB=$freeDisk"
          $log='C:\clued-ci\logs\watchdog-home-primary.log'
          Write-Output "=== WATCHDOG TAIL ==="
          if(Test-Path $log){Get-Content $log -Tail 30}else{Write-Output "NO_CANONICAL_LOG"}
          $unit='actions.runner.tdoljyj-cross-memory-system.clued-ci-home-linux-01.service'
          Write-Output "=== RUNNER STATE ==="
          wsl.exe -d Ubuntu-24.04 -u root -e systemctl is-active $unit
          Write-Output "=== DOCKER STATE ==="
          wsl.exe -d Ubuntu-24.04 -u root -e systemctl is-active docker
