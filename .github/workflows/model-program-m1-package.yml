name: model-program-m1-package
on:
  pull_request:
    paths:
      - "development/contracts/model-program/m1/package/**"
      - "development/contracts/model-program/m1/governance/ExperimentAuthorizationProfile.M1-PKG-*"
      - "development/contracts/model-program/m1/evidence/M1PackageProfile*"
      - "scripts/model-program/m1_prepare_package_variants.py"
      - "scripts/model-program/validate_m1_package_profile.py"
      - "tests/test_model_program_m1_package.py"
      - ".github/workflows/model-program-m1-package.yml"
  push:
    branches: [main]
    paths:
      - "development/contracts/model-program/m1/package/**"
      - "development/contracts/model-program/m1/governance/ExperimentAuthorizationProfile.M1-PKG-*"
      - "development/contracts/model-program/m1/evidence/M1PackageProfile*"
      - "scripts/model-program/m1_prepare_package_variants.py"
      - "scripts/model-program/validate_m1_package_profile.py"
      - "tests/test_model_program_m1_package.py"
      - ".github/workflows/model-program-m1-package.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-trusted-self-hosted:
    timeout-minutes: 20
    if: >-
      (github.event_name == 'push' &&
       github.actor == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == github.repository_owner)
    runs-on: [self-hosted, Windows, X64, clued, pool-general, trust-internal, cap-python312]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - name: Verify pre-provisioned Python 3.12
        shell: powershell
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
      - run: python -m py_compile scripts/model-program/m1_prepare_package_variants.py scripts/model-program/validate_m1_package_profile.py
      - run: python scripts/model-program/validate_m1_package_profile.py
      - run: python -m unittest tests.test_model_program_m1_package -v

  validate-untrusted-hosted:
    timeout-minutes: 20
    if: >-
      (github.event_name == 'push' &&
       github.actor != github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       (github.event.pull_request.head.repo.full_name != github.repository ||
        github.actor != github.repository_owner))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - run: python -m py_compile scripts/model-program/m1_prepare_package_variants.py scripts/model-program/validate_m1_package_profile.py
      - run: python scripts/model-program/validate_m1_package_profile.py
      - run: python -m unittest tests.test_model_program_m1_package -v
