name: Clued connection authorization candidate

on:
  pull_request:
    paths:
      - '.github/workflows/clued-connection-authorization.yml'
      - 'apps/clued-cloud/worker/**'
      - 'apps/clued-cloud/app/**'
      - 'apps/clued-cloud/vite.config.ts'
      - 'apps/clued-cloud/supabase/migrations/**'
      - 'apps/clued-cloud/tests/*authorization*.test.mjs'
      - 'apps/clued-cloud/tests/delegated-oauth-transport.test.mjs'
      - 'apps/clued-cloud/tests/development-context-api.test.mjs'
      - 'apps/clued-cloud/tests/development-contexts-ui.test.mjs'
      - 'apps/clued-cloud/tests/consent-account-race.test.mjs'
      - 'apps/clued-cloud/tests/supabase-browser.test.mjs'
      - 'apps/clued-cloud/tests/project-invitations-*.test.mjs'
      - 'apps/clued-cloud/tests/priority-projection-db.test.mjs'
      - 'apps/clued-cloud/tests/context-v2-*.test.mjs'
      - 'apps/clued-cloud/tests/currentness-*.test.mjs'
      - 'apps/clued-cloud/tests/projection-refresh-*.test.mjs'
      - 'apps/clued-cloud/package*.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/clued-connection-authorization.yml'
      - 'apps/clued-cloud/worker/**'
      - 'apps/clued-cloud/app/**'
      - 'apps/clued-cloud/vite.config.ts'
      - 'apps/clued-cloud/supabase/migrations/**'
      - 'apps/clued-cloud/tests/*authorization*.test.mjs'
      - 'apps/clued-cloud/tests/delegated-oauth-transport.test.mjs'
      - 'apps/clued-cloud/tests/development-context-api.test.mjs'
      - 'apps/clued-cloud/tests/development-contexts-ui.test.mjs'
      - 'apps/clued-cloud/tests/consent-account-race.test.mjs'
      - 'apps/clued-cloud/tests/supabase-browser.test.mjs'
      - 'apps/clued-cloud/tests/project-invitations-*.test.mjs'
      - 'apps/clued-cloud/tests/priority-projection-db.test.mjs'
      - 'apps/clued-cloud/tests/context-v2-*.test.mjs'
      - 'apps/clued-cloud/tests/currentness-*.test.mjs'
      - 'apps/clued-cloud/tests/projection-refresh-*.test.mjs'
      - 'apps/clued-cloud/package*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/clued-cloud
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/clued-cloud/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Install embedded PostgreSQL ICU compatibility runtime
        run: |
          curl -fsSLo /tmp/libicu60.deb https://archive.ubuntu.com/ubuntu/pool/main/i/icu/libicu60_60.2-3ubuntu3.2_amd64.deb
          sudo dpkg -i /tmp/libicu60.deb
          ldconfig -p | grep 'libicuuc.so.60'
      - run: npm run typecheck
      - run: npm run test:authorization:transport
      - run: npm run test:authorization:database
      - run: npm run test:context:v2
      - run: npm run test:projection:refresh
      - run: npm run test:authorization:invitations
      - run: npm run test:authorization:migrations
      - run: npm run test:authorization:integration
      - run: npm run test:authorization:pages
