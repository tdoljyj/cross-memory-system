      - 'apps/clued-cloud/supabase/migrations/**'
      - 'apps/clued-cloud/tests/information-flow-*.test.mjs'
      - 'development/contracts/information-flow/vendored/**'
      - 'scripts/phase2-qualification/minimum-context-compiler/**'
      - 'apps/clued-cloud/tests/*authorization*.test.mjs'
      - 'apps/clued-cloud/tests/delegated-oauth-transport.test.mjs'
      - 'apps/clued-cloud/tests/development-context-api.test.mjs'
      - 'apps/clued-cloud/tests/development-contexts-ui.test.mjs'
      - 'apps/clued-cloud/tests/consent-account-race.test.mjs'
      - 'apps/clued-cloud/tests/supabase-browser.test.mjs'
      - 'apps/clued-cloud/tests/project-invitations-*.test.mjs'
      - 'apps/clued-cloud/tests/priority-projection-db.test.mjs'
      - 'apps/clued-cloud/tests/context-v2-*.test.mjs'
      - 'apps/clued-cloud/tests/currentness-*.test.mjs'
      - 'apps/clued-cloud/tests/work-claims-*.test.mjs'
      - 'apps/clued-cloud/tests/checkpoint-session-renewal-db.test.mjs'
      - 'apps/clued-cloud/tests/resume-constraint-index-db.test.mjs'
      - 'apps/clued-cloud/tests/checkpoint-backlog-controls-db.test.mjs'
      - 'apps/clued-cloud/tests/projection-refresh-*.test.mjs'
      - 'apps/clued-cloud/tests/record-update-field-merge-db.test.mjs'
      - 'apps/clued-cloud/tests/task-dependency-guard-db.test.mjs'
      - 'apps/clued-cloud/tests/now-conflict-null-project-db.test.mjs'
      - 'apps/clued-cloud/tests/search-context-cross-scope-db.test.mjs'
      - 'apps/clued-cloud/tests/event-continuity-manifest-db.test.mjs'
      - 'apps/clued-cloud/tests/resource-center-*.test.mjs'
      - 'kernel/host/resource-center-*.mjs'
      - 'kernel/host/resource-center-*.py'
      - 'apps/clued-cloud/scripts/*resource-center*.mjs'
      - 'kernel/policy/resource-center-*.mjs'
      - 'apps/clued-cloud/supabase/migrations/20260926000000_integration_runtime_registry_derivation.sql'
      - 'apps/clued-cloud/tests/integration-runtime-derivation-db.test.mjs'
      - 'apps/clued-cloud/tests/integration-runtime-identity-db.test.mjs'
      - 'apps/clued-cloud/tests/fixtures/integration-runtime/**'
      - 'apps/clued-cloud/tests/mtpe-*.test.mjs'
      - 'apps/clued-cloud/tests/production-release-gate.test.mjs'
      - 'apps/clued-cloud/tests/served-agent-contract.test.mjs'
      - 'apps/clued-cloud/scripts/production-release-*'
      - 'apps/clued-cloud/scripts/verify-served-agent-contract.mjs'
      - 'skills/clued/references/agent-contract.md'
      - '.github/workflows/clued-cloud-production-release.yml'
      - 'apps/clued-cloud/package*.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/clued-connection-authorization.yml'
      - 'apps/clued-cloud/worker/**'
      - 'apps/clued-cloud/app/**'
      - 'apps/clued-cloud/vite.config.ts'
      - 'apps/clued-cloud/supabase/migrations/**'
      - 'apps/clued-cloud/tests/information-flow-*.test.mjs'
      - 'development/contracts/information-flow/vendored/**'
      - 'scripts/phase2-qualification/minimum-context-compiler/**'
      - 'apps/clued-cloud/tests/*authorization*.test.mjs'
      - 'apps/clued-cloud/tests/delegated-oauth-transport.test.mjs'
      - 'apps/clued-cloud/tests/development-context-api.test.mjs'
      - 'apps/clued-cloud/tests/development-contexts-ui.test.mjs'
      - 'apps/clued-cloud/tests/consent-account-race.test.mjs'
      - 'apps/clued-cloud/tests/supabase-browser.test.mjs'
      - 'apps/clued-cloud/tests/project-invitations-*.test.mjs'
      - 'apps/clued-cloud/tests/priority-projection-db.test.mjs'
      - 'apps/clued-cloud/tests/context-v2-*.test.mjs'
      - 'apps/clued-cloud/tests/currentness-*.test.mjs'
      - 'apps/clued-cloud/tests/work-claims-*.test.mjs'
      - 'apps/clued-cloud/tests/checkpoint-session-renewal-db.test.mjs'
      - 'apps/clued-cloud/tests/resume-constraint-index-db.test.mjs'
      - 'apps/clued-cloud/tests/checkpoint-backlog-controls-db.test.mjs'
      - 'apps/clued-cloud/tests/projection-refresh-*.test.mjs'
      - 'apps/clued-cloud/tests/record-update-field-merge-db.test.mjs'
      - 'apps/clued-cloud/tests/task-dependency-guard-db.test.mjs'
      - 'apps/clued-cloud/tests/now-conflict-null-project-db.test.mjs'
      - 'apps/clued-cloud/tests/search-context-cross-scope-db.test.mjs'
      - 'apps/clued-cloud/tests/event-continuity-manifest-db.test.mjs'
      - 'apps/clued-cloud/tests/resource-center-*.test.mjs'
      - 'kernel/host/resource-center-*.mjs'
      - 'kernel/host/resource-center-*.py'
      - 'apps/clued-cloud/scripts/*resource-center*.mjs'
      - 'kernel/policy/resource-center-*.mjs'
      - 'apps/clued-cloud/supabase/migrations/20260926000000_integration_runtime_registry_derivation.sql'
      - 'apps/clued-cloud/tests/integration-runtime-derivation-db.test.mjs'
      - 'apps/clued-cloud/tests/integration-runtime-identity-db.test.mjs'
      - 'apps/clued-cloud/tests/fixtures/integration-runtime/**'
      - 'apps/clued-cloud/tests/mtpe-*.test.mjs'
      - 'apps/clued-cloud/tests/production-release-gate.test.mjs'
      - 'apps/clued-cloud/tests/served-agent-contract.test.mjs'
      - 'apps/clued-cloud/scripts/production-release-*'
      - 'apps/clued-cloud/scripts/verify-served-agent-contract.mjs'
      - 'skills/clued/references/agent-contract.md'
      - '.github/workflows/clued-cloud-production-release.yml'
      - 'apps/clued-cloud/package*.json'
  workflow_dispatch:
    inputs:
      admission_run_id:
        description: Id of a successful clued-work-admission-dispatch run that admitted this workflow and ref
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Work Claim Admission v0.1 §4.6 L0b: the heavy jobs below run only when
  # Clued admits this pull request. The gate does not call Clued and gets no
  # Clued token (this job runs PR code): it waits for the trusted
  # pull_request_target run of clued-work-admission.yml on this head and reads
  # its result. Until the Owner sets the repository variable
  # CLUED_WORK_ADMISSION_ENFORCE=true the gate is advisory and admits. A hand
  # dispatch needs admission_run_id from clued-work-admission-dispatch.yml;
  # push events are admitted. Hosted runner, no install.
  admission-gate:
    name: admission-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      admitted: ${{ steps.gate.outputs.admitted }}
      enforced: ${{ steps.gate.outputs.enforced }}
      verdict: ${{ steps.gate.outputs.verdict }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
      - id: gate
        env:
          CLUED_WORK_ADMISSION_ENFORCE: ${{ vars.CLUED_WORK_ADMISSION_ENFORCE }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/clued-work-admission.mjs --mode gate

  isolated-candidate-trusted-self-hosted:
    needs: admission-gate
    if: >-
      needs.admission-gate.outputs.admitted == 'true' &&
      ((github.event_name == 'workflow_dispatch' &&
       github.actor == github.repository_owner) ||
      (github.event_name == 'push' &&
       github.actor == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == github.repository_owner))
    name: >-
      ${{ ((github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
             (github.event_name == 'push' && github.actor == github.repository_owner) ||
             (github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              github.actor == github.repository_owner))
          && 'isolated-candidate' || 'isolated-candidate-self-hosted-skipped' }}
    runs-on: [self-hosted, Linux, X64, clued, pool-general, trust-internal]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/clued-cloud
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          # Self-hosted runners keep a persistent ~/.npm that npm ci reuses below.
      - run: npm ci --ignore-scripts --cache "$HOME/.npm" --prefer-offline
      - name: Hydrate embedded PostgreSQL bundled library symlinks
        # --ignore-scripts skips the platform package's postinstall, which links the
        # bundled libpq.so.5 and libicu*.so.60 that the binaries load via $ORIGIN/../lib.
        working-directory: apps/clued-cloud/node_modules/@embedded-postgres/linux-x64
        run: |
          node scripts/hydrate-symlinks.js
          ./native/bin/initdb --version
          ./native/bin/postgres --version
      - run: npm run typecheck
      - run: npm run test:authorization:transport
      - run: npm run test:authorization:database
      - run: npm run test:context:v2
      - run: npm run test:projection:refresh
      - run: npm run test:work:claims
      - run: node --test --test-force-exit tests/work-claims-acceptance-db.test.mjs
      - run: npm run test:information-flow:candidates
      - run: npm run test:information-flow:intake
      - run: npm run test:information-flow:promotion
      - run: npm run test:information-flow:context
      - run: npm run test:information-flow:invalidation
      - run: npm run test:information-flow:hardening
      - run: npm run test:records:db
      - run: npm run test:mtpe:intake
      - run: npm run test:production:release-gate
      - run: npm run test:integration-runtime:db
      - run: npm run test:integration-runtime:identity
      - run: npm run test:authorization:invitations
      - run: npm run test:authorization:migrations
      - run: npm run test:resource-center:authority
      - run: npm run test:authorization:integration
      - run: npm run test:authorization:pages

  isolated-candidate-untrusted-hosted:
    needs: admission-gate
    if: >-
      needs.admission-gate.outputs.admitted == 'true' &&
      ((github.event_name == 'workflow_dispatch' &&
       github.actor != github.repository_owner) ||
      (github.event_name == 'push' &&
       github.actor != github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       (github.event.pull_request.head.repo.full_name != github.repository ||
        github.actor != github.repository_owner)))
    name: >-
      ${{ ((github.event_name == 'workflow_dispatch' && github.actor != github.repository_owner) ||
             (github.event_name == 'push' && github.actor != github.repository_owner) ||
             (github.event_name == 'pull_request' &&
              (github.event.pull_request.head.repo.full_name != github.repository ||
               github.actor != github.repository_owner)))
          && 'isolated-candidate' || 'isolated-candidate-hosted-skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/clued-cloud
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/clued-cloud/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Install embedded PostgreSQL ICU compatibility runtime
        run: |
          curl -fsSLo /tmp/libicu60.deb https://archive.ubuntu.com/ubuntu/pool/main/i/icu/libicu60_60.2-3ubuntu3.2_amd64.deb
          sudo dpkg -i /tmp/libicu60.deb
          ldconfig -p | grep 'libicuuc.so.60'
      - run: npm run typecheck
      - run: npm run test:authorization:transport
      - run: npm run test:authorization:database
      - run: npm run test:context:v2
      - run: npm run test:projection:refresh
      - run: npm run test:work:claims
      - run: node --test --test-force-exit tests/work-claims-acceptance-db.test.mjs
      - run: npm run test:information-flow:candidates
      - run: npm run test:information-flow:intake
      - run: npm run test:information-flow:promotion
      - run: npm run test:information-flow:context
      - run: npm run test:information-flow:invalidation
      - run: npm run test:information-flow:hardening
      - run: npm run test:records:db
      - run: npm run test:mtpe:intake
      - run: npm run test:production:release-gate
      - run: npm run test:integration-runtime:db
      - run: npm run test:integration-runtime:identity
      - run: npm run test:authorization:invitations
      - run: npm run test:authorization:migrations
      - run: npm run test:resource-center:authority
      - run: npm run test:authorization:integration
      - run: npm run test:authorization:pages
