name: Clued connection authorization candidate

on:
  pull_request:
    paths:
      - '.github/workflows/clued-connection-authorization.yml'
      - 'apps/clued-cloud/worker/**'
      - 'apps/clued-cloud/app/**'
      - 'apps/clued-cloud/vite.config.ts'
      - 'apps/clued-cloud/supabase/migrations/**'
      - 'apps/clued-cloud/tests/information-flow-*.test.mjs'
      - 'development/contracts/information-flow/vendored/**'
      - 'scripts/phase2-qualification/minimum-context-compiler/**'
      - 'apps/clued-cloud/tests/*authorization*.test.mjs'
      - 'apps/clued-cloud/tests/delegated-oauth-transport.test.mjs'
      - 'apps/clued-cloud/tests/development-context-api.test.mjs'
      - 'apps/clued-cloud/tests/development-contexts-ui.test.mjs'
      - 'apps/clued-cloud/tests/consent-account-race.test.mjs'
      - 'apps/clued-cloud/tests/supabase-browser.test.mjs'
      - 'apps/clued-cloud/tests/project-invitations-*.test.mjs'
      - 'apps/clued-cloud/tests/priority-projection-db.test.mjs'
      - 'apps/clued-cloud/tests/context-v2-*.test.mjs'
      - 'apps/clued-cloud/tests/currentness-*.test.mjs'
      - 'apps/clued-cloud/tests/projection-refresh-*.test.mjs'
      - 'apps/clued-cloud/package*.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/clued-connection-authorization.yml'
      - 'apps/clued-cloud/worker/**'
      - 'apps/clued-cloud/app/**'
      - 'apps/clued-cloud/vite.config.ts'
      - 'apps/clued-cloud/supabase/migrations/**'
      - 'apps/clued-cloud/tests/information-flow-*.test.mjs'
      - 'development/contracts/information-flow/vendored/**'
      - 'scripts/phase2-qualification/minimum-context-compiler/**'
      - 'apps/clued-cloud/tests/*authorization*.test.mjs'
      - 'apps/clued-cloud/tests/delegated-oauth-transport.test.mjs'
      - 'apps/clued-cloud/tests/development-context-api.test.mjs'
      - 'apps/clued-cloud/tests/development-contexts-ui.test.mjs'
      - 'apps/clued-cloud/tests/consent-account-race.test.mjs'
      - 'apps/clued-cloud/tests/supabase-browser.test.mjs'
      - 'apps/clued-cloud/tests/project-invitations-*.test.mjs'
      - 'apps/clued-cloud/tests/priority-projection-db.test.mjs'
      - 'apps/clued-cloud/tests/context-v2-*.test.mjs'
      - 'apps/clued-cloud/tests/currentness-*.test.mjs'
      - 'apps/clued-cloud/tests/projection-refresh-*.test.mjs'
      - 'apps/clued-cloud/package*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolated-candidate-trusted-self-hosted:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.actor == github.repository_owner) ||
      (github.event_name == 'push' &&
       github.actor == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == github.repository_owner)
    name: >-
      ${{ ((github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
             (github.event_name == 'push' && github.actor == github.repository_owner) ||
             (github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              github.actor == github.repository_owner))
          && 'isolated-candidate' || 'isolated-candidate-self-hosted-skipped' }}
    runs-on: [self-hosted, Linux, X64, clued, pool-general, trust-internal]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/clued-cloud
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          # Self-hosted runners keep a persistent ~/.npm that npm ci reuses below.
      - run: npm ci --ignore-scripts --cache "$HOME/.npm" --prefer-offline
      - name: Stage embedded PostgreSQL ICU compatibility runtime (job-local, no sudo)
        run: |
          icu_dir="$RUNNER_TEMP/libicu60"
          curl -fsSLo "$RUNNER_TEMP/libicu60.deb" https://archive.ubuntu.com/ubuntu/pool/main/i/icu/libicu60_60.2-3ubuntu3.2_amd64.deb
          echo "f01f61f57e63dc905e02e6441d10370fe0c79e43e70e6f5fe24b342fd2633209  $RUNNER_TEMP/libicu60.deb" | sha256sum -c -
          rm -rf "$icu_dir" && dpkg-deb -x "$RUNNER_TEMP/libicu60.deb" "$icu_dir"
          test -f "$icu_dir/usr/lib/x86_64-linux-gnu/libicuuc.so.60"
          echo "LD_LIBRARY_PATH=$icu_dir/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm run test:authorization:transport
      - run: npm run test:authorization:database
      - run: npm run test:context:v2
      - run: npm run test:projection:refresh
      - run: npm run test:information-flow:candidates
      - run: npm run test:information-flow:intake
      - run: npm run test:information-flow:promotion
      - run: npm run test:information-flow:context
      - run: npm run test:authorization:invitations
      - run: npm run test:authorization:migrations
      - run: npm run test:authorization:integration
      - run: npm run test:authorization:pages

  isolated-candidate-untrusted-hosted:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.actor != github.repository_owner) ||
      (github.event_name == 'push' &&
       github.actor != github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       (github.event.pull_request.head.repo.full_name != github.repository ||
        github.actor != github.repository_owner))
    name: >-
      ${{ ((github.event_name == 'workflow_dispatch' && github.actor != github.repository_owner) ||
             (github.event_name == 'push' && github.actor != github.repository_owner) ||
             (github.event_name == 'pull_request' &&
              (github.event.pull_request.head.repo.full_name != github.repository ||
               github.actor != github.repository_owner)))
          && 'isolated-candidate' || 'isolated-candidate-hosted-skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/clued-cloud
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/clued-cloud/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Install embedded PostgreSQL ICU compatibility runtime
        run: |
          curl -fsSLo /tmp/libicu60.deb https://archive.ubuntu.com/ubuntu/pool/main/i/icu/libicu60_60.2-3ubuntu3.2_amd64.deb
          sudo dpkg -i /tmp/libicu60.deb
          ldconfig -p | grep 'libicuuc.so.60'
      - run: npm run typecheck
      - run: npm run test:authorization:transport
      - run: npm run test:authorization:database
      - run: npm run test:context:v2
      - run: npm run test:projection:refresh
      - run: npm run test:information-flow:candidates
      - run: npm run test:information-flow:intake
      - run: npm run test:information-flow:promotion
      - run: npm run test:information-flow:context
      - run: npm run test:authorization:invitations
      - run: npm run test:authorization:migrations
      - run: npm run test:authorization:integration
      - run: npm run test:authorization:pages
