name: public-mcp-protocol

on:
  pull_request:
    paths:
      - '.github/workflows/public-mcp-*.yml'
      - 'apps/clued-cloud/**'
      - 'protocol/continuity/v1/**'
      - 'protocol/agent/**'
      - 'kernel/policy/resource-center-mutation-policy.mjs'
      - 'kernel/host/resource-center-*.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-mcp-*.yml'
      - 'apps/clued-cloud/**'
      - 'protocol/continuity/v1/**'
      - 'protocol/agent/**'
      - 'kernel/policy/resource-center-mutation-policy.mjs'
      - 'kernel/host/resource-center-*.mjs'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Work Claim Admission v0.1 §4.6 L0b: the heavy jobs below run only when
  # Clued admits this pull request. The gate does not call Clued and gets no
  # Clued token (this job runs PR code): it waits for the trusted
  # pull_request_target run of clued-work-admission.yml on this head and reads
  # its result, always enforced (Merge Admission step 6 retired the advisory
  # switch CLUED_WORK_ADMISSION_ENFORCE); push events are admitted.
  # Self-hosted Linux pool, pinned Node (Decision f86179b3).
  admission-gate:
    name: admission-gate
    runs-on: [self-hosted, Linux, X64, clued, pool-general, trust-internal]
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      admitted: ${{ steps.gate.outputs.admitted }}
      enforced: ${{ steps.gate.outputs.enforced }}
      verdict: ${{ steps.gate.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/clued-work-admission.mjs --mode gate

  trusted-self-hosted:
    name: >-
      ${{ (((github.event_name == 'push' && github.actor == github.repository_owner) ||
             (github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              github.actor == github.repository_owner)))
          && 'public-mcp-protocol' || 'public-mcp-protocol-self-hosted-skipped' }}
    needs: admission-gate
    if: >-
      needs.admission-gate.outputs.admitted == 'true' && (
      (github.event_name == 'push' &&
       github.actor == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == github.repository_owner))
    runs-on: [self-hosted, Linux, X64, clued, pool-general, trust-internal]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/clued-cloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          # Self-hosted runners keep a persistent ~/.npm that npm ci reuses below;
          # restoring the ~860 MB Actions cache on top of it only adds download time.
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - name: Verify gate terminal-state and timeout regressions
        run: npm run mcp:gate-receipt:test
      - name: Install dependencies from runner cache
        # CPU bindings are bundled; protocol checks do not need optional CUDA binaries.
        env:
          ONNXRUNTIME_NODE_INSTALL: 'skip'
        run: >-
          timeout --signal=TERM --kill-after=15s 8m
          npm ci --cache "$HOME/.npm" --prefer-offline
          --fetch-retries=2 --fetch-timeout=30000
      - name: Verify governed Resource Center mutation contract
        run: node --test tests/resource-center-mutation-policy.test.mjs tests/resource-center-host-qualification.test.mjs tests/resource-center-online-tool-host.test.mjs tests/resource-center-authority-client.test.mjs tests/resource-center-google-drive-identity.test.mjs tests/resource-center-google-drive-metadata.test.mjs tests/resource-center-storage-read-transport.test.mjs tests/resource-center-storage-read-formats.test.mjs tests/resource-center-zip-reader.test.mjs tests/resource-center-ooxml-text.test.mjs tests/stage6-contract.test.mjs tests/k-cont-contract.test.mjs
      - name: Allocate a protocol-only loopback port
        run: |
          rm -f "$RUNNER_TEMP/public-mcp.pid"
          node --input-type=module <<'NODE'
          import net from 'node:net';
          import fs from 'node:fs';
          const server = net.createServer();
          await new Promise((resolve, reject) => { server.once('error', reject); server.listen(0, '127.0.0.1', resolve); });
          const port = server.address().port;
          await new Promise((resolve) => server.close(resolve));
          fs.appendFileSync(process.env.GITHUB_ENV, `MCP_ISOLATED_PORT=${port}\nMCP_ISOLATED_URL=http://127.0.0.1:${port}/mcp\n`);
          NODE
      - name: Start isolated MCP
        run: |
          printf 'SUPABASE_PUBLISHABLE_KEY=ci-public-placeholder\n' > evals/public-mcp/.dev.vars.public-mcp
          setsid node node_modules/wrangler/bin/wrangler.js dev --config evals/public-mcp/wrangler.jsonc --env public-mcp --ip 127.0.0.1 --port "$MCP_ISOLATED_PORT" --inspector-port 0 --define "__CLUED_BUILD_SHA__:\"$GITHUB_SHA\"" --local --show-interactive-dev-session false --log-level error &
          echo $! > "$RUNNER_TEMP/public-mcp.pid"
          for attempt in $(seq 1 30); do
            kill -0 "$(cat "$RUNNER_TEMP/public-mcp.pid")" 2>/dev/null || exit 1
            if node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const response = await fetch(new URL('/.well-known/clued-continuity', process.env.MCP_ISOLATED_URL), { signal: AbortSignal.timeout(1000) });
          assert.equal(response.status, 200);
          assert.equal((await response.json()).components.source_commit, process.env.GITHUB_SHA);
          NODE
            then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Inspector strict schema validation
        run: >-
          npx mcp-inspector --cli
          --server-url "$MCP_ISOLATED_URL"
          --transport http
          --header "Authorization: Bearer clued_bnd_$(printf 'a%.0s' {1..43})"
          --method tools/list
          --format json
          --strict
      - run: npm run mcp:protocol:verify
      - run: npm run mcp:tools:verify
      - run: npm run mcp:flags:verify
      - name: Stop isolated MCP
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/public-mcp.pid" ]; then
            mcp_pid="$(cat "$RUNNER_TEMP/public-mcp.pid")"
            kill -- "-$mcp_pid" 2>/dev/null || true
          fi
          rm -f evals/public-mcp/.dev.vars.public-mcp

  untrusted-hosted:
    name: >-
      ${{ (((github.event_name == 'push' && github.actor != github.repository_owner) ||
             (github.event_name == 'pull_request' &&
              (github.event.pull_request.head.repo.full_name != github.repository ||
               github.actor != github.repository_owner))))
          && 'public-mcp-protocol' || 'public-mcp-protocol-hosted-skipped' }}
    needs: admission-gate
    if: >-
      needs.admission-gate.outputs.admitted == 'true' && (
      (github.event_name == 'push' &&
       github.actor != github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       (github.event.pull_request.head.repo.full_name != github.repository ||
        github.actor != github.repository_owner)))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/clued-cloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/clued-cloud/package-lock.json
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - name: Verify gate terminal-state and timeout regressions
        run: npm run mcp:gate-receipt:test
      - run: npm ci
        # CPU bindings are bundled; protocol checks do not need optional CUDA binaries.
        env:
          ONNXRUNTIME_NODE_INSTALL: 'skip'
      - name: Verify governed Resource Center mutation contract
        run: node --test tests/resource-center-mutation-policy.test.mjs tests/resource-center-host-qualification.test.mjs tests/resource-center-online-tool-host.test.mjs tests/resource-center-authority-client.test.mjs tests/resource-center-google-drive-identity.test.mjs tests/resource-center-google-drive-metadata.test.mjs tests/resource-center-storage-read-transport.test.mjs tests/resource-center-storage-read-formats.test.mjs tests/resource-center-zip-reader.test.mjs tests/resource-center-ooxml-text.test.mjs tests/stage6-contract.test.mjs tests/k-cont-contract.test.mjs
      - name: Allocate a protocol-only loopback port
        run: |
          rm -f "$RUNNER_TEMP/public-mcp.pid"
          node --input-type=module <<'NODE'
          import net from 'node:net';
          import fs from 'node:fs';
          const server = net.createServer();
          await new Promise((resolve, reject) => { server.once('error', reject); server.listen(0, '127.0.0.1', resolve); });
          const port = server.address().port;
          await new Promise((resolve) => server.close(resolve));
          fs.appendFileSync(process.env.GITHUB_ENV, `MCP_ISOLATED_PORT=${port}\nMCP_ISOLATED_URL=http://127.0.0.1:${port}/mcp\n`);
          NODE
      - name: Start the allocated protocol instance
        run: |
          printf 'SUPABASE_PUBLISHABLE_KEY=ci-public-placeholder\n' > evals/public-mcp/.dev.vars.public-mcp
          setsid node node_modules/wrangler/bin/wrangler.js dev --config evals/public-mcp/wrangler.jsonc --env public-mcp --ip 127.0.0.1 --port "$MCP_ISOLATED_PORT" --inspector-port 0 --define "__CLUED_BUILD_SHA__:\"$GITHUB_SHA\"" --local --show-interactive-dev-session false --log-level error &
          echo $! > "$RUNNER_TEMP/public-mcp.pid"
          for attempt in $(seq 1 30); do
            kill -0 "$(cat "$RUNNER_TEMP/public-mcp.pid")" 2>/dev/null || exit 1
            if node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const response = await fetch(new URL('/.well-known/clued-continuity', process.env.MCP_ISOLATED_URL), { signal: AbortSignal.timeout(1000) });
          assert.equal(response.status, 200);
          assert.equal((await response.json()).components.source_commit, process.env.GITHUB_SHA);
          NODE
            then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Inspector strict schema validation
        run: >-
          npx mcp-inspector --cli
          --server-url "$MCP_ISOLATED_URL"
          --transport http
          --header "Authorization: Bearer clued_bnd_$(printf 'a%.0s' {1..43})"
          --method tools/list
          --format json
          --strict
      - run: npm run mcp:protocol:verify
      - run: npm run mcp:tools:verify
      - run: npm run mcp:flags:verify
      - name: Stop isolated MCP
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/public-mcp.pid" ]; then
            mcp_pid="$(cat "$RUNNER_TEMP/public-mcp.pid")"
            kill -- "-$mcp_pid" 2>/dev/null || true
          fi
          rm -f evals/public-mcp/.dev.vars.public-mcp
