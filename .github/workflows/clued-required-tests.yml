          set -eu
          git ls-tree -r -z --full-tree HEAD > "$RUNNER_TEMP/clued-trivy-tree"
          if tr '\0' '\n' < "$RUNNER_TEMP/clued-trivy-tree" | grep -Ev '^(100644|100755) blob [0-9a-f]{40}[[:space:]]' | grep -q .; then
            echo "::error title=trivy::the tree has a symlink, submodule or other non-regular entry"
            exit 1
          fi
          git ls-files -z > "$RUNNER_TEMP/clued-trivy-paths"
          if grep -qzE '[\\:[:cntrl:]]|.{4096,}' "$RUNNER_TEMP/clued-trivy-paths"; then
            echo "::error title=trivy::a path has a backslash, colon or control character, or is too long"
            exit 1
          fi
          if grep -qziE '\.(jar|war|ear|par)$' "$RUNNER_TEMP/clued-trivy-paths"; then
            echo "::error title=trivy::a Java archive needs the Java DB the local role does not prepare"
            exit 1
          fi
          test "$(tr -cd '\0' < "$RUNNER_TEMP/clued-trivy-paths" | wc -c)" -le 100000
      # The local role scans a copy of the checked-out tree without .git (formal-trivy-v4 snapshotTree).
      - name: Snapshot the tree for the scanners
        working-directory: candidate
        run: |
          set -eu
          snap="$RUNNER_TEMP/clued-trivy-snapshot"
          mkdir "$snap"
          git ls-files -z | tar --null --no-recursion -T - -cf - | tar -xf - -C "$snap"
      # The trusted helper reuses complete generations from the node cache. Only downloads can use
      # the network, with fresh cache-only mounts and nothing from the checkout. The DB must be
      # current and the checks bundle must match its digest and major version, with Rego content.
      - name: Prepare the vulnerability DB and the pinned checks bundle
        timeout-minutes: 10
        env:
          TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.74.0@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9
          CHECKS_DIGEST: sha256:b0e12d009b01dcc8ca2ebbc199b9caf3922491978d21c17b61c1d7f6dc75220b
        run: node trusted/scripts/ci/trivy-cache.mjs
      # The three scanners exactly as the local role (required-trivy-v3/plans.mjs requiredTrivyPlans,
      # verify-worker.mjs createArguments): no network, read-only root and mounts, cwd /scratch, the prepared
      # DB and checks only, no update of either, five minutes each. Every scan container runs as the job account,
      # not the local role's uid 65532: that role runs as root and chowns and deletes what 65532 wrote, which a
      # runner account cannot (task 79a20873).
      - name: Vulnerabilities (HIGH/CRITICAL)
        timeout-minutes: 5
        run: |
          set -eu
          docker run --rm --pull=never --network=none --ipc=private --cgroupns=private --user="$(id -u):$(id -g)" --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges:true --pids-limit=128 --cpus=2 --memory=2147483648 \
            --memory-swap=2147483648 --ulimit=nofile=1024:1024 --env=NODE_OPTIONS= --env=NODE_PATH= --env=HOME=/scratch \
            --env=TMPDIR=/scratch --tmpfs=/scratch:rw,nosuid,nodev,noexec,size=536870912,mode=0700,uid="$(id -u)",gid="$(id -g)" \
            --mount "type=bind,src=$RUNNER_TEMP/clued-trivy-snapshot,dst=/repo,readonly,bind-propagation=rprivate" \
            --mount "type=bind,src=$CLUED_TRIVY_DB,dst=/scratch/db,readonly,bind-propagation=rprivate" \
            --mount "type=bind,src=$CLUED_TRIVY_POLICY,dst=/scratch/policy,readonly,bind-propagation=rprivate" \
            --workdir=/scratch --entrypoint /usr/local/bin/trivy \
            ghcr.io/aquasecurity/trivy:0.74.0@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9 \
            fs --skip-db-update --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --cache-dir /scratch --skip-check-update --skip-version-check --disable-telemetry /repo
      - name: Secrets
        timeout-minutes: 5
        run: |
          set -eu
          docker run --rm --pull=never --network=none --ipc=private --cgroupns=private --user="$(id -u):$(id -g)" --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges:true --pids-limit=128 --cpus=2 --memory=2147483648 \
            --memory-swap=2147483648 --ulimit=nofile=1024:1024 --env=NODE_OPTIONS= --env=NODE_PATH= --env=HOME=/scratch \
            --env=TMPDIR=/scratch --tmpfs=/scratch:rw,nosuid,nodev,noexec,size=536870912,mode=0700,uid="$(id -u)",gid="$(id -g)" \
            --mount "type=bind,src=$RUNNER_TEMP/clued-trivy-snapshot,dst=/repo,readonly,bind-propagation=rprivate" \
            --mount "type=bind,src=$CLUED_TRIVY_DB,dst=/scratch/db,readonly,bind-propagation=rprivate" \
            --mount "type=bind,src=$CLUED_TRIVY_POLICY,dst=/scratch/policy,readonly,bind-propagation=rprivate" \
            --workdir=/scratch --entrypoint /usr/local/bin/trivy \
            ghcr.io/aquasecurity/trivy:0.74.0@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9 \
            fs --scanners secret --exit-code 1 \
            --cache-dir /scratch --skip-check-update --skip-version-check --disable-telemetry /repo
      - name: Misconfiguration (HIGH/CRITICAL)
        timeout-minutes: 5
        run: |
          set -eu
          docker run --rm --pull=never --network=none --ipc=private --cgroupns=private --user="$(id -u):$(id -g)" --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges:true --pids-limit=128 --cpus=2 --memory=2147483648 \
            --memory-swap=2147483648 --ulimit=nofile=1024:1024 --env=NODE_OPTIONS= --env=NODE_PATH= --env=HOME=/scratch \
            --env=TMPDIR=/scratch --tmpfs=/scratch:rw,nosuid,nodev,noexec,size=536870912,mode=0700,uid="$(id -u)",gid="$(id -g)" \
            --mount "type=bind,src=$RUNNER_TEMP/clued-trivy-snapshot,dst=/repo,readonly,bind-propagation=rprivate" \
            --mount "type=bind,src=$CLUED_TRIVY_DB,dst=/scratch/db,readonly,bind-propagation=rprivate" \
            --mount "type=bind,src=$CLUED_TRIVY_POLICY,dst=/scratch/policy,readonly,bind-propagation=rprivate" \
            --workdir=/scratch --entrypoint /usr/local/bin/trivy \
            ghcr.io/aquasecurity/trivy:0.74.0@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9 \
            fs --checks-bundle-repository ghcr.io/aquasecurity/trivy-checks:2 --scanners misconfig --severity HIGH,CRITICAL --exit-code 1 \
            --cache-dir /scratch --skip-check-update --skip-version-check --disable-telemetry /repo

  # contract-placement: the five commands of the formal role (formal-contract-placement-v2) over the change, in the
  # candidate checkout.
  contract-placement:
    name: >-
      ${{ needs.admission-gate.outputs.admitted == 'true' &&
          ((github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
           (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
           (github.event_name == 'push' && github.ref == 'refs/heads/clued-train/staging' &&
            github.actor == 'clued-ci-checks-turing-20261018[bot]') ||
           (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            (github.actor == github.repository_owner || needs.admission-gate.outputs.automation_self_hosted == 'true')))
          && 'contract-placement' || 'contract-placement-skipped' }}
    needs: admission-gate
    if: >-
      needs.admission-gate.outputs.admitted == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
           (github.event_name == 'push' && github.ref == 'refs/heads/clued-train/staging' &&
            github.actor == 'clued-ci-checks-turing-20261018[bot]') ||
       (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.actor == github.repository_owner || needs.admission-gate.outputs.automation_self_hosted == 'true')))
    runs-on: [self-hosted, Linux, X64, clued, pool-general, trust-internal]
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          path: candidate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Resolve push baseline before loading trusted commands
        id: train-base
        working-directory: candidate
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/clued-pycache
          WRANGLER_LOG_PATH: ${{ runner.temp }}/clued-wrangler-logs
        shell: bash
        run: |
          set -euo pipefail
          # CI_BASE_SHA and the staging trusted ref, for every event, from the one rule in scripts/ci/ci-base.mjs read from main
          # (the candidate copy only while main has none: the change that adds it). Later steps read CI_BASE_SHA from GITHUB_ENV.
          node --input-type=module -e "
            const { execFileSync } = await import('node:child_process');
            const git = (...args) => execFileSync('git', args, { encoding: 'utf8' });
            const onMain = git('ls-tree', '--name-only', 'origin/main', 'scripts/ci/ci-base.mjs').trim() !== '';
            if (!onMain) console.log('::warning title=CI base::main has no scripts/ci/ci-base.mjs yet; the candidate copy resolves the base');
            const source = onMain ? git('show', 'origin/main:scripts/ci/ci-base.mjs') : (await import('node:fs')).readFileSync('scripts/ci/ci-base.mjs', 'utf8');
            const { writeCiBase } = await import('data:text/javascript;base64,' + Buffer.from(source).toString('base64'));
            process.exitCode = await writeCiBase();"
      - name: Export the trusted base (temporary storage)
        shell: bash
        env:
          TRUSTED_REF: ${{ steps.train-base.outputs.sha || github.event.pull_request.base.sha || (github.event_name == 'workflow_dispatch' && github.event.repository.default_branch) || github.sha }}
          GIT_NO_LAZY_FETCH: "1"
          GIT_NO_REPLACE_OBJECTS: "1"
        run: |
          set -euo pipefail
          cd -P -- "$GITHUB_WORKSPACE"
          ref="$TRUSTED_REF"
          [[ "$ref" =~ ^[0-9a-fA-F]{40}$ ]] || ref="refs/remotes/origin/$ref"
          if ! base="$(git -C candidate rev-parse --verify --quiet --end-of-options "${ref}^{commit}")"; then
            echo "::error title=Trusted base::trusted baseline commit is missing from the candidate checkout ($TRUSTED_REF)"
            exit 1
          fi
          rm -rf -- trusted
          mkdir -- trusted
          git -C candidate archive "$base" -- scripts/ci config .github | tar -xf - -C trusted
      - name: Configure job temporary storage
        uses: ./trusted/.github/actions/ci-temporary-storage
      - name: Placement and renderer fixtures
        working-directory: candidate
        run: |
          python3 -I -B -m unittest discover -s scripts/ci -p test_check_contract_placement.py -v
          node --test apps/clued-cloud/tests/agent-contract-bootstrap.test.mjs
      - name: Build actual public bootstrap without the application dependency tree
        working-directory: candidate
        env:
          CANDIDATE: ${{ github.sha }}
        run: |
          # esbuild alone, from the runner's dependency store (offline) by the trusted ci-deps.mjs; installed outside
          # the candidate tree so the placement check sees no node_modules of its own.
          mkdir -p "$RUNNER_TEMP/contract-build"
          cp scripts/ci/contract-build/package.json scripts/ci/contract-build/package-lock.json "$RUNNER_TEMP/contract-build/"
          node ../trusted/scripts/ci/ci-deps.mjs install "$RUNNER_TEMP/contract-build"
          node "$RUNNER_TEMP/contract-build/node_modules/esbuild/bin/esbuild" apps/clued-cloud/worker/continuity.ts \
            --bundle --platform=node --format=esm --external:js-tiktoken/* \
            --define:__CLUED_BUILD_SHA__="\"$CANDIDATE\"" --outfile="$RUNNER_TEMP/contract-bootstrap.mjs"
      - name: Render all actual and synthetic contract parts
        working-directory: candidate
        run: node apps/clued-cloud/scripts/render-agent-contract-budget.mjs --worker-module "$RUNNER_TEMP/contract-bootstrap.mjs" --output "$RUNNER_TEMP/contract-responses.json"
      - name: Enforce placement and one-time production gate
        working-directory: candidate
        env:
          CANDIDATE: ${{ github.sha }}
        run: python3 -I -B scripts/ci/check_contract_placement.py --base "$CI_BASE_SHA" --head "$CANDIDATE" --minimum-service-version 0.4.5 --rendered-responses "$RUNNER_TEMP/contract-responses.json"
