name: node-profile-policy

on:
  pull_request:
    paths:
      - "scripts/ci/self-hosted/**"
      - "tests/test_ci_health.py"
      - ".github/workflows/node-profile-policy.yml"
      - ".github/workflows/clued-ci-health.yml"
      - ".github/workflows/clued-ci-runner-heartbeat.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trusted-windows:
    timeout-minutes: 20
    name: >-
      ${{ (((github.event_name == 'push' && github.actor == github.repository_owner) ||
             (github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              github.actor == github.repository_owner)))
          && 'node-profile-policy-windows' || 'node-profile-policy-windows-skipped' }}
    if: >-
      (github.event_name == 'push' &&
       github.actor == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == github.repository_owner)
    runs-on: [self-hosted, Windows, X64, clued, pool-general, trust-internal, cap-python312]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - run: python scripts/ci/self-hosted/validate_node_profiles.py
      - run: python tests/test_ci_health.py
      - name: Parse PowerShell onboarding scripts
        shell: powershell
        run: |
          $files = @(
            'scripts/ci/self-hosted/bootstrap-windows-runner.ps1',
            'scripts/ci/self-hosted/apply-wsl-capacity-profile.ps1',
            'scripts/ci/self-hosted/node-governance/render.ps1',
            'scripts/ci/self-hosted/node-governance/install.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              throw "PowerShell parse failed: $file"
            }
          }

  trusted-linux:
    timeout-minutes: 20
    name: >-
      ${{ (((github.event_name == 'push' && github.actor == github.repository_owner) ||
             (github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              github.actor == github.repository_owner)))
          && 'node-profile-policy-linux' || 'node-profile-policy-linux-skipped' }}
    if: >-
      (github.event_name == 'push' &&
       github.actor == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == github.repository_owner)
    runs-on: [self-hosted, Linux, X64, clued, pool-general, trust-internal]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - run: python3 scripts/ci/self-hosted/validate_node_profiles.py
      - run: python3 tests/test_ci_health.py
      - run: bash -n scripts/ci/self-hosted/bootstrap-linux-runner.sh

  untrusted-hosted:
    timeout-minutes: 20
    name: >-
      ${{ (((github.event_name == 'push' && github.actor != github.repository_owner) ||
             (github.event_name == 'pull_request' &&
              (github.event.pull_request.head.repo.full_name != github.repository ||
               github.actor != github.repository_owner))))
          && 'node-profile-policy' || 'node-profile-policy-hosted-skipped' }}
    if: >-
      (github.event_name == 'push' &&
       github.actor != github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       (github.event.pull_request.head.repo.full_name != github.repository ||
        github.actor != github.repository_owner))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - run: python3 scripts/ci/self-hosted/validate_node_profiles.py
      - run: python3 tests/test_ci_health.py
      - run: bash -n scripts/ci/self-hosted/bootstrap-linux-runner.sh
