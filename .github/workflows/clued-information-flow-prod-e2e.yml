name: Clued Information Flow production E2E

# Owner-dispatched only. Drives the Information Flow chain against the live
# Worker with a dedicated test account (register L26). It writes permanent,
# synthetic records into that test account and nowhere else.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clued-information-flow-prod-e2e
  cancel-in-progress: false

jobs:
  prod-e2e:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/clued-cloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - name: Check test account credentials
        env:
          CLUED_E2E_EMAIL: ${{ secrets.CLUED_E2E_EMAIL }}
          CLUED_E2E_PASSWORD: ${{ secrets.CLUED_E2E_PASSWORD }}
        run: |
          test -n "$CLUED_E2E_EMAIL"
          test -n "$CLUED_E2E_PASSWORD"
      - name: Run the production Information Flow chain
        env:
          CLUED_E2E_EMAIL: ${{ secrets.CLUED_E2E_EMAIL }}
          CLUED_E2E_PASSWORD: ${{ secrets.CLUED_E2E_PASSWORD }}
        run: node evals/information-flow-prod/run.mjs --evidence-out prod-e2e-evidence.json
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clued-information-flow-prod-e2e-${{ github.run_id }}
          path: apps/clued-cloud/prod-e2e-evidence.json
          if-no-files-found: ignore
          retention-days: 90
