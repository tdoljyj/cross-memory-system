name: Clued production publisher qualification

on:
  workflow_dispatch:
    inputs:
      admission_run_id:
        description: Existing exact workflow/ref dispatch admission; never a production Grant
        type: string
        required: true
      mode:
        description: Credential-free Host probe or disposable Guest canary
        type: choice
        required: true
        default: host-principal-probe
        options: [host-principal-probe, success, failure, cancel]
      probe_mode:
        description: Host probe only; S4UCanary creates and retires one limited task as the CI account
        type: choice
        required: true
        default: Inventory
        options: [Inventory, S4UCanary]
      qualification_id:
        description: Exact qualification UUID allocated by the Host controller
        type: string
        required: true
      isolation_canary_id:
        description: Host probe only; UUID of the existing public publisher-root canary
        type: string
        default: ''
      expected_qualification_vm:
        description: Host probe only; exact existing nonproduction VM UUID
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: clued-production-publisher-qualification
  cancel-in-progress: false

# No clued-release environment, production secrets, package/cache upload or
# Actions artifact storage. The workflow observes finite nonproduction cases;
# it cannot qualify itself or grant a production principal/Grant.
jobs:
  admission-gate:
    name: admission-gate
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: [self-hosted, Linux, X64, clued, pool-general, trust-internal]
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      admitted: ${{ steps.gate.outputs.admitted }}
      enforced: ${{ steps.gate.outputs.enforced }}
      verdict: ${{ steps.gate.outputs.verdict }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/clued-work-admission.mjs --mode gate

  host-principal-probe:
    needs: admission-gate
    if: >-
      needs.admission-gate.outputs.admitted == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      inputs.mode == 'host-principal-probe'
    runs-on: [self-hosted, Windows, X64, clued, pool-general, trust-internal, cap-python312, cap-node24, site-company]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Inspect the actual standard Windows CI principal
        shell: powershell
        env:
          QUALIFICATION_ID: ${{ inputs.qualification_id }}
          PROBE_MODE: ${{ inputs.probe_mode }}
          ISOLATION_CANARY_ID: ${{ inputs.isolation_canary_id }}
          EXPECTED_QUALIFICATION_VM: ${{ inputs.expected_qualification_vm }}
        run: |
          $ErrorActionPreference = 'Stop'
          $parameters = @{
            Mode = $env:PROBE_MODE
            QualificationId = [guid]::Parse($env:QUALIFICATION_ID)
          }
          if ($env:ISOLATION_CANARY_ID) { $parameters.IsolationCanaryId = [guid]::Parse($env:ISOLATION_CANARY_ID) }
          if ($env:EXPECTED_QUALIFICATION_VM) { $parameters.ExpectedQualificationVm = [guid]::Parse($env:EXPECTED_QUALIFICATION_VM) }
          & ./scripts/ci/self-hosted/qualify-publisher-host-principal.ps1 @parameters
          if (-not $?) { throw 'Host principal probe failed.' }

  qualify:
    needs: admission-gate
    if: >-
      needs.admission-gate.outputs.admitted == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      (inputs.mode == 'success' || inputs.mode == 'failure' || inputs.mode == 'cancel')
    runs-on: [self-hosted, Linux, X64, clued-production-publisher-v1, "${{ format('clued-publisher-{0}-{1}', github.run_id, github.run_attempt) }}"]
    timeout-minutes: 12
    steps:
      # A separately installed, immutable pre-job hook must admit the exact
      # run/attempt/job/source before ANY step, including this checkout.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Observe the exact credential-free canary binding
        shell: bash
        env:
          QUALIFICATION_ID: ${{ inputs.qualification_id }}
          CANARY_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import grp, json, os, pathlib, stat, uuid
          qualification_id = str(uuid.UUID(os.environ['QUALIFICATION_ID']))
          launch_path = pathlib.Path('/opt/clued-production-publisher/launch.json')
          metadata = launch_path.lstat()
          if (not stat.S_ISREG(metadata.st_mode) or metadata.st_uid != 0
                  or metadata.st_gid != grp.getgrnam('clued-release-runner').gr_gid
                  or stat.S_IMODE(metadata.st_mode) != 0o640):
              raise SystemExit('Missing trusted Host launch binding')
          launch = json.loads(launch_path.read_text())
          expected = {
              'repository': os.environ['GITHUB_REPOSITORY'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'job_name': os.environ['GITHUB_JOB'],
              'sha': os.environ['GITHUB_SHA'],
              'ref': os.environ['GITHUB_REF'],
              'workflow_ref': os.environ['GITHUB_WORKFLOW_REF'],
              'runner_name': os.environ['RUNNER_NAME'],
          }
          if (launch.get('schema') != 'clued.production-vm-launch/1'
                  or launch.get('purpose') != 'qualification'
                  or launch.get('qualification_id') != qualification_id
                  or any(str(launch.get(key)) != value for key, value in expected.items())):
              raise SystemExit('Canary launch binding mismatch')
          marker = pathlib.Path('/home/clued-release-runner/.clued-qualification-marker')
          if marker.exists() or marker.is_symlink():
              raise SystemExit('Previous job canary residue found')
          marker.write_text(qualification_id + '\n')
          marker.chmod(0o600)
          print(json.dumps({'schema': 'clued.publisher-canary.observation/1',
              'qualification_id': qualification_id, 'mode': os.environ['CANARY_MODE'],
              'observed': expected, 'production_qualified': False,
              'scope': 'job-side observation; Host lifecycle and independent review still required'}))
          PY
          case "$CANARY_MODE" in
            success) exit 0 ;;
            failure) echo 'Expected synthetic failure case'; exit 23 ;;
            cancel) echo 'Waiting for the Host controller to request and verify cancellation'; sleep 600; echo 'Cancellation was not exercised'; exit 24 ;;
            *) exit 2 ;;
          esac
