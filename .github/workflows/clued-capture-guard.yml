name: clued-capture-guard

# Unit tests for the Claude Code hooks in scripts/hooks: the Stop hook that
# enforces Clued capture (protocol/agent/agent-contract.md §3 and §5,
# BUG-20260924-001 L3) and the work-claim hooks (agent-contract §1.7,
# WorkClaimAdmission.v0.1 §4.6 L3).

on:
  pull_request:
    paths:
      - '.github/workflows/clued-capture-guard.yml'
      - '.claude/settings.json'
      - 'scripts/hooks/**'
      - 'protocol/agent/**'
      - 'tests/test_clued_capture_guard.py'
      - 'tests/test_clued_work_claim_guard.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/clued-capture-guard.yml'
      - '.claude/settings.json'
      - 'scripts/hooks/**'
      - 'protocol/agent/**'
      - 'tests/test_clued_capture_guard.py'
      - 'tests/test_clued_work_claim_guard.py'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trusted-self-hosted:
    name: >-
      ${{ (((github.event_name == 'push' && github.actor == github.repository_owner) ||
             (github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              github.actor == github.repository_owner)))
          && 'clued-capture-guard' || 'clued-capture-guard-self-hosted-skipped' }}
    if: >-
      (github.event_name == 'push' &&
       github.actor == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == github.repository_owner)
    runs-on: [self-hosted, Linux, X64, clued, pool-general, trust-internal]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - run: python3 --version
      - run: python3 -m unittest tests.test_clued_capture_guard tests.test_clued_work_claim_guard -v

  untrusted-hosted:
    name: >-
      ${{ (((github.event_name == 'push' && github.actor != github.repository_owner) ||
             (github.event_name == 'pull_request' &&
              (github.event.pull_request.head.repo.full_name != github.repository ||
               github.actor != github.repository_owner))))
          && 'clued-capture-guard' || 'clued-capture-guard-hosted-skipped' }}
    if: >-
      (github.event_name == 'push' &&
       github.actor != github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       (github.event.pull_request.head.repo.full_name != github.repository ||
        github.actor != github.repository_owner))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - run: python3 --version
      - run: python3 -m unittest tests.test_clued_capture_guard tests.test_clued_work_claim_guard -v
