name: turing-home-linux-recovery

on:
  push:
    branches:
      - ops/turing-home-linux-recovery-20260924

permissions:
  contents: read

jobs:
  validate-watchdog-fix:
    runs-on: [self-hosted, Windows, X64, clued, pool-general, trust-internal, site-company, cap-python312]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate watchdog fix
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Output "RUNNER_NAME=$env:RUNNER_NAME"
          if ($env:RUNNER_NAME -ne 'clued-ci-company-win-01') {
            throw "Refusing to validate on unexpected runner: $env:RUNNER_NAME"
          }

          python scripts/ci/self-hosted/validate_node_profiles.py

          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/ci/self-hosted/render-host-watchdog.ps1'),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | Format-List
            throw 'render-host-watchdog.ps1 parse failed'
          }

          $candidate = Join-Path $env:RUNNER_TEMP 'watchdog-home-primary-candidate.ps1'
          powershell -ExecutionPolicy Bypass -File scripts/ci/self-hosted/render-host-watchdog.ps1 -HostId home-primary -OutputPath $candidate

          $candidateErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $candidate,
            [ref]$null,
            [ref]$candidateErrors
          )
          if ($candidateErrors.Count -gt 0) {
            $candidateErrors | Format-List
            throw 'rendered watchdog parse failed'
          }

          $rendered = Get-Content $candidate -Raw
          foreach ($needle in @(
            'function Test-LinuxBusy',
            'journalctl -u $linuxUnit -n 200',
            'Capacity suspend deferred:',
            '$linuxBusy=Test-LinuxBusy'
          )) {
            if (-not $rendered.Contains($needle)) {
              throw "Rendered watchdog missing expected guard: $needle"
            }
          }
          Write-Output 'WATCHDOG_FIX_VALIDATED'
