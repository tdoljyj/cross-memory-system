name: turing-home-linux-recovery

on:
  push:
    branches:
      - ops/turing-home-linux-recovery-20260924

permissions:
  contents: read

jobs:
  linux-busy-probe:
    runs-on: [self-hosted, Linux, X64, clued, pool-general, trust-internal, site-home, cap-docker-linux, runtime-wsl2]
    timeout-minutes: 5
    steps:
      - name: Hold an exact home Linux job open for busy-state observation
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "clued-ci-home-linux-01"
          marker=/mnt/c/clued-ci/validation/home-linux-busy-probe.ready
          mkdir -p "$(dirname "$marker")"
          trap 'rm -f "$marker"' EXIT
          printf '%s\n' "$$" > "$marker"
          echo "BUSY_PROBE_READY runner=$RUNNER_NAME"
          sleep 45
          echo "BUSY_PROBE_DONE"

  windows-busy-observer:
    runs-on: [self-hosted, Windows, X64, clued, pool-general, trust-internal, site-home, cap-python312]
    timeout-minutes: 5
    steps:
      - name: Verify watchdog busy detection against a live Linux job
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'clued-ci-home-win-01') {
            throw "Unexpected runner: $env:RUNNER_NAME"
          }

          $marker = 'C:\clued-ci\validation\home-linux-busy-probe.ready'
          $deadline = (Get-Date).AddSeconds(90)
          while (-not (Test-Path $marker)) {
            if ((Get-Date) -gt $deadline) { throw 'Timed out waiting for Linux busy probe marker' }
            Start-Sleep -Seconds 2
          }

          $unit = 'actions.runner.tdoljyj-cross-memory-system.clued-ci-home-linux-01.service'
          wsl.exe -d Ubuntu-24.04 -u chase -e bash -lc 'pgrep -f "[R]unner.Worker" >/dev/null'
          $workerBusy = ($LASTEXITCODE -eq 0)

          $events = @(wsl.exe -d Ubuntu-24.04 -u root -e journalctl -u $unit -n 200 --no-pager -o cat)
          $lastRunnerEvent = $events |
            Where-Object { $_ -match 'Listening for Jobs|Running job:|Job .* completed with result:' } |
            Select-Object -Last 1

          Write-Output "WORKER_BUSY=$workerBusy"
          Write-Output "LAST_RUNNER_EVENT=$lastRunnerEvent"

          $busy = $workerBusy -or ($lastRunnerEvent -match 'Running job:')
          if (-not $busy) {
            throw 'Corrected watchdog logic would not classify the live Linux job as busy'
          }

          $watchdogs = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -eq 'powershell.exe' -and
              $_.CommandLine -like '*watchdog-home-runner.ps1*'
            })
          if ($watchdogs.Count -ne 1) { throw "Expected one persistent watchdog, found $($watchdogs.Count)" }

          Write-Output 'LIVE_BUSY_STATE_GUARD_PASS'
