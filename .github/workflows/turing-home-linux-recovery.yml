name: turing-home-linux-recovery

on:
  push:
    branches:
      - ops/turing-home-linux-recovery-20260924

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64, clued, pool-general, trust-internal, site-home, cap-python312]
    timeout-minutes: 10
    steps:
      - name: Diagnose Turing home Linux runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Output "RUNNER_NAME=$env:RUNNER_NAME"
          if ($env:RUNNER_NAME -ne 'clued-ci-home-win-01') {
            throw "Refusing to run on unexpected runner: $env:RUNNER_NAME"
          }

          Write-Output "=== HOST RESOURCE ==="
          $os = Get-CimInstance Win32_OperatingSystem
          $freeMem = [math]::Round($os.FreePhysicalMemory * 1KB / 1GB, 2)
          $freeDisk = [math]::Round((Get-PSDrive C).Free / 1GB, 1)
          Write-Output "FREE_RAM_GB=$freeMem"
          Write-Output "FREE_C_GB=$freeDisk"

          Write-Output "=== WATCHDOG FILE / PROCESS ==="
          Write-Output ("WATCHDOG_FILE=" + (Test-Path 'C:\clued-ci\watchdog-home-runner.ps1'))
          Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object { $_.CommandLine -like '*watchdog-home-runner.ps1*' } |
            Select-Object ProcessId, CommandLine | Format-List

          Write-Output "=== WATCHDOG STARTUP ==="
          try {
            $v = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'CluedCIWatchdog-home-primary' -ErrorAction Stop).'CluedCIWatchdog-home-primary'
            Write-Output "RUN_KEY=$v"
          } catch { Write-Output "RUN_KEY_MISSING" }
          $startup = Join-Path ([Environment]::GetFolderPath('Startup')) 'Clued-CI-Watchdog-home-primary.cmd'
          Write-Output ("STARTUP_FILE=" + (Test-Path $startup))
          if (Test-Path $startup) { Get-Content $startup }

          Write-Output "=== WATCHDOG LOG TAIL ==="
          if (Test-Path 'C:\clued-ci\logs\watchdog-home-primary.log') {
            Get-Content 'C:\clued-ci\logs\watchdog-home-primary.log' -Tail 80
          } else {
            Write-Output "WATCHDOG_LOG_MISSING"
          }

          Write-Output "=== WSL DISTROS ==="
          wsl.exe -l -v

          $unit = 'actions.runner.tdoljyj-cross-memory-system.clued-ci-home-linux-01.service'
          Write-Output "=== WSL SYSTEMD ==="
          wsl.exe -d Ubuntu-24.04 -u root -e systemctl is-system-running
          Write-Output "=== DOCKER ACTIVE ==="
          wsl.exe -d Ubuntu-24.04 -u root -e systemctl is-active docker
          Write-Output "=== RUNNER ACTIVE ==="
          wsl.exe -d Ubuntu-24.04 -u root -e systemctl is-active $unit
          Write-Output "=== RUNNER STATUS ==="
          wsl.exe -d Ubuntu-24.04 -u root -e systemctl status $unit --no-pager -l
          Write-Output "=== RUNNER JOURNAL TAIL ==="
          wsl.exe -d Ubuntu-24.04 -u root -e journalctl -u $unit -n 60 --no-pager
