name: MPS-03 Native Agent

on:
  pull_request:
    paths:
      - "development/mps/mps03/**"
      - "development/mps/mps04/**"
      - "tests/mps03/**"
      - "tests/mps04/**"
      - "scripts/mps03/**"
      - "scripts/mps04/**"
      - ".github/workflows/mps03-native-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mps03-local-reference-and-static:
    timeout-minutes: 20
    # Untrusted PR code must not execute on an internal self-hosted runner.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == github.repository_owner) ||
      (github.event_name == 'workflow_dispatch' &&
       github.actor == github.repository_owner)
    runs-on: [self-hosted, Windows, X64, clued, pool-general, trust-internal, cap-python312]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - name: MPS-03 bounded entry tests
        run: python scripts/mps03/run_acceptance.py
      - name: MPS-04 provider tests
        run: python -m unittest discover -s tests/mps04 -p "test_*.py" -v
      - name: MPS-04 private GitHub read-only source leg
        if: github.event_name == 'pull_request'
        env:
          MPS04_GITHUB_TOKEN: ${{ github.token }}
          MPS04_GITHUB_REF: ${{ github.event.pull_request.head.ref }}
          MPS04_CI_ADOPTED_SHA: ${{ github.event.pull_request.base.sha }}
          MPS04_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/mps04/check_private_github_readonly.py
      - name: MPS-03 cross-entry process evidence
        run: python scripts/mps03/capture_cross_entry_evidence.py
      - name: Compile MPS-03 Python
        run: python -m compileall -q development/mps/mps03 development/mps/mps04 tests/mps03 tests/mps04 scripts/mps03 scripts/mps04

  mps04-live-native-nonprod-g6:
    timeout-minutes: 20
    # This is the exact named credential host, not the interchangeable pool.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 274 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == github.repository_owner
    runs-on: [self-hosted, Windows, X64, clued, site-company, trust-internal, cap-python312]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - name: MPS-04 live nonproduction G6 (PR 274 only)
        env:
          MPS04_GITHUB_TOKEN: ${{ github.token }}
          MPS04_GITHUB_REF: ${{ github.event.pull_request.head.ref }}
          MPS04_CI_ADOPTED_SHA: ${{ github.event.pull_request.base.sha }}
          MPS04_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/mps04/check_live_native_nonprod.py
