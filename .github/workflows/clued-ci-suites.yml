name: clued-ci-suites

# Required check ci-suites (Task 2a5fdb66; work/ci-required-tests-v1/DESIGN.md):
# the resident and Source v2 test suites, the offline drill, the component and
# runner-budget checks and the admission self-tests, on the self-hosted Linux
# pool only (Owner Decision 9eb313f8: no GitHub-hosted execution).
#
# The check always reports, so it can be a required check under one name.
# Which suites run is decided by scripts/ci/ci-required-selection.mjs from the
# trusted base checkout, from the pull request's changed files; its command
# table also comes from the base, and the candidate checkout is only the code
# under test. A change to the selection or to this workflow runs every suite.
#
# The job carries the required name only when it runs: an untrusted actor, a
# pull request the admission gate did not admit, or a failed gate gives
# ci-suites-skipped, so the required check stays missing (fail closed) instead
# of a skipped job counting as success. Re-runs follow the gate's rule.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Work Claim Admission v0.1 §4.6 L0b, as in contract-placement.yml: admit
  # on the independent CI's own App 5368905 kooyumi-work-admission check for
  # this exact head (Owner Decision 22b0e0ed); base-branch code, no PR code,
  # no Clued token.
  admission-gate:
    name: admission-gate
    runs-on: [self-hosted, Linux, X64, clued, pool-general, trust-internal]
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      admitted: ${{ steps.gate.outputs.admitted }}
      enforced: ${{ steps.gate.outputs.enforced }}
      verdict: ${{ steps.gate.outputs.verdict }}
      automation_self_hosted: ${{ steps.gate.outputs.automation_self_hosted }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLUED_ADMISSION_GATE_SOURCE: independent-ci-native-work-admission
          CLUED_ADMISSION_GATE_WAIT_SECONDS: "600"
        run: node scripts/ci/clued-work-admission.mjs --mode gate

  ci-suites:
    name: >-
      ${{ needs.admission-gate.outputs.admitted == 'true' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
           (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            (github.actor == github.repository_owner || needs.admission-gate.outputs.automation_self_hosted == 'true')))
          && 'ci-suites' || 'ci-suites-skipped' }}
    needs: admission-gate
    if: >-
      needs.admission-gate.outputs.admitted == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.actor == github.repository_owner || needs.admission-gate.outputs.automation_self_hosted == 'true')))
    runs-on: [self-hosted, Linux, X64, clued, pool-general, trust-internal]
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the trusted base (selection and commands)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
      - name: Check out the candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          path: candidate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Configure job temporary storage
        uses: ./trusted/.github/actions/ci-temporary-storage
      - name: Select suites
        id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          selector=trusted/scripts/ci/ci-required-selection.mjs
          if [ ! -f "$selector" ]; then
            # Only the pull request that introduces the selection reaches here.
            echo "::warning title=ci-suites bootstrap::the base has no selection; the candidate's own copy decides"
            selector=candidate/scripts/ci/ci-required-selection.mjs
          fi
          echo "selector=$selector" >> "$GITHUB_OUTPUT"
          node "$selector" --check ci-suites
      - name: Run the selected suites
        env:
          SELECTOR: ${{ steps.select.outputs.selector }}
          SUITES: ${{ steps.select.outputs.suites }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          failed=""
          for suite in $(node -e 'for (const s of JSON.parse(process.env.SUITES)) console.log(s)'); do
            if node "$SELECTOR" --run "$suite" --root candidate; then
              echo "- \`$suite\`: passed" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- \`$suite\`: **failed**" >> "$GITHUB_STEP_SUMMARY"
              failed="$failed $suite"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error title=ci-suites::failed:$failed"
            exit 1
          fi
