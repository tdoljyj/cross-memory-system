name: clued-work-admission-reverify

# Work Claim Admission v0.1, step 7 review (MAJOR 21a77b34). A passing
# clued-work-admission check is a verdict at one moment; its claim can expire
# (2 h lease), be released or be taken over later, and the ruleset does not
# re-evaluate a green check. Every hour this re-checks each open, non-draft PR
# into the default branch whose newest clued-admission-verified App check
# passed, and when the claim no longer admits the PR posts a failing App check
# on its head, which blocks the merge (re-review 7, MAJOR-1). Without the App
# key it fails rather than pass quietly (re-review 8). Always enforced (Merge
# Admission step 6 retired CLUED_WORK_ADMISSION_ENFORCE).
# Code comes from the default branch; no PR code is checked out. The Clued
# token and the App key come from the `clued-admission` environment, as for
# the check itself.
# Owner review is enforced from 2026-10-05 (Owner Decision 43d36f03; Merge
# Admission step 6 retired CLUED_OWNER_REVIEW_ENFORCE): a pull request that
# changes this file needs an Owner Grant on its head commit before it is
# admitted.

on:
  schedule:
    - cron: "17 * * * *"
  # Re-review 10: a pull request that changes protected paths must contain the
  # current main, so each push to main re-checks the open pull requests at
  # once instead of within the hour.
  push:
    branches: [main]
  # Merge Admission v0.1 §4.1 item 3: after switching CLUED_MERGE_ADMISSION_STATE
  # the Owner dispatches this with reason state_change, which judges every open
  # pull request again and posts both App checks, passing or failing.
  workflow_dispatch:
    inputs:
      reason:
        description: "scheduled: fail checks that no longer hold; state_change: judge every open pull request again after a state switch"
        type: choice
        options: [scheduled, state_change]
        default: scheduled

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

# A state_change dispatch has its own group, so a later push or scheduled
# run never replaces it while it waits (step 3 review MINOR-4).
concurrency:
  group: ${{ github.workflow }}-${{ inputs.reason == 'state_change' && 'state_change' || 'scheduled' }}
  cancel-in-progress: false

jobs:
  reverify:
    name: clued-work-admission-reverify
    # slim is limited to 15 minutes; state_change retains standard Ubuntu
    # for its 30-minute rejudgment of every open pull request.
    runs-on: ${{ inputs.reason == 'state_change' && 'ubuntu-latest' || 'ubuntu-slim' }}
    # state_change judges every open pull request and posts two checks each.
    timeout-minutes: ${{ inputs.reason == 'state_change' && 30 || 10 }}
    environment: clued-admission
    steps:
      # Re-review 4, m6: the default branch as it is now, so a re-run of an
      # old run does not replay that run's older code with today's secrets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - name: Re-verify open pull requests with a passing admission check
        env:
          CLUED_CONTEXT_READ_TOKEN: ${{ secrets.CLUED_ADMISSION_CLUED_TOKEN }}
          CLUED_ADMISSION_APP_ID: ${{ secrets.CLUED_ADMISSION_APP_ID }}
          CLUED_ADMISSION_APP_PRIVATE_KEY: ${{ secrets.CLUED_ADMISSION_APP_KEY }}
          # Merge Admission v0.1 §4: judged in the same state as the check.
          CLUED_MERGE_ADMISSION_STATE: ${{ vars.CLUED_MERGE_ADMISSION_STATE }}
          CLUED_REVERIFY_REASON: ${{ inputs.reason }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/clued-work-admission.mjs --mode reverify
      # Merge Admission step 3: the hourly report of the merge slots' CI state
      # (scripts/ci/clued-merge-slot-ci.mjs; clued-merge-slot-ci.yml reports when
      # a CI run completes). In this job it costs no extra hosted run.
      - name: Report the CI state of the pull requests holding a merge slot
        if: ${{ !cancelled() }}
        env:
          CLUED_CONTEXT_READ_TOKEN: ${{ secrets.CLUED_ADMISSION_CLUED_TOKEN }}
          CLUED_ADMISSION_APP_ID: ${{ secrets.CLUED_ADMISSION_APP_ID }}
          CLUED_ADMISSION_APP_PRIVATE_KEY: ${{ secrets.CLUED_ADMISSION_APP_KEY }}
          CLUED_MERGE_ADMISSION_STATE: ${{ vars.CLUED_MERGE_ADMISSION_STATE }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/clued-merge-slot-ci.mjs
      - name: Export the closed local natural R9 packet
        if: ${{ always() }}
        run: node scripts/ci/merge-admission-source-producer.mjs --export admission slot
      - name: Preserve natural R9 source observations
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: clued-r9-natural-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: .clued-r9-source-events/sealed/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/natural-packet.json
          if-no-files-found: warn
          retention-days: 90
