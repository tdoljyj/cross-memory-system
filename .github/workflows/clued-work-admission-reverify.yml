name: clued-work-admission-reverify

# Work Claim Admission v0.1, step 7 review (MAJOR 21a77b34). A passing
# clued-work-admission check is a verdict at one moment; its claim can expire
# (2 h lease), be released or be taken over later, and the ruleset does not
# re-evaluate a green check. Every hour this re-checks each open, non-draft PR
# into the default branch whose newest clued-admission-verified App check
# passed, and when the claim no longer admits the PR posts a failing App check
# on its head, which blocks the merge (re-review 7, MAJOR-1; without the App
# key it re-runs that PR's own admission run). Runs only when
# CLUED_WORK_ADMISSION_ENFORCE=true; otherwise it reports and does nothing.
# Code comes from the default branch; no PR code is checked out. The Clued
# token and the App key come from the `clued-admission` environment, as for
# the check itself.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  reverify:
    name: clued-work-admission-reverify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: clued-admission
    steps:
      # Re-review 4, m6: the default branch as it is now, so a re-run of an
      # old run does not replay that run's older code with today's secrets.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          persist-credentials: false
      - name: Re-verify open pull requests with a passing admission check
        env:
          CLUED_CONTEXT_READ_TOKEN: ${{ secrets.CLUED_ADMISSION_CLUED_TOKEN }}
          CLUED_ADMISSION_APP_ID: ${{ secrets.CLUED_ADMISSION_APP_ID }}
          CLUED_ADMISSION_APP_PRIVATE_KEY: ${{ secrets.CLUED_ADMISSION_APP_KEY }}
          CLUED_WORK_ADMISSION_ENFORCE: ${{ vars.CLUED_WORK_ADMISSION_ENFORCE }}
          # Re-review 7, MAJOR-3: protected changes need an Owner Grant on the head.
          CLUED_OWNER_REVIEW_ENFORCE: ${{ vars.CLUED_OWNER_REVIEW_ENFORCE }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/clued-work-admission.mjs --mode reverify
