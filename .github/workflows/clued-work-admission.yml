name: clued-work-admission

# Work Claim Admission v0.1 §4.6 L0a (development/contracts/execution-admission/
# WorkClaimAdmission.v0.1.md). An unfiltered check on every pull request, so it
# can become a `main` ruleset required check like gitleaks and trivy without a
# PR ever waiting on it. It makes one read-only call to Clued
# (clued_work_verify through the public MCP endpoint, with the read-only Binding
# token in CLUED_CONTEXT_READ_TOKEN) and asks whether the claim named in the PR
# body or head commit (`Clued-Work-Claim: <id>`) admits this head, base and
# changed-file set. It also prints which path-filtered workflows apply to the
# changed paths and what each concluded on this head.
#
# The call goes to the Clued database's PostgREST endpoint (clued_work_verify_v1
# with the public publishable key and the SHA-256 of the Binding token): the
# production /mcp route is owned by the delegated OAuth provider and takes OAuth
# access tokens only. Enforcement is the Owner's repository variable
# CLUED_WORK_ADMISSION_ENFORCE=true; until then the check is advisory (verdicts
# are printed, every PR is admitted). Once enforced, a missing claim, a
# REJECTED verdict, a missing RPC, a refused token or a transport error all fail
# closed. Hosted runner on purpose: seconds of work, no self-hosted capacity,
# and no code of the PR is executed (the script is checked out from the PR head
# but only reads files; it has no dependencies to install).

on:
  pull_request:

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clued-work-admission:
    name: clued-work-admission
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Self-test the admission script (no network, mocked fetch)
        run: |
          node --version
          node --test scripts/ci/clued-work-admission.test.mjs
      - name: Verify the work claim with Clued and summarize applicable workflows
        env:
          CLUED_CONTEXT_READ_TOKEN: ${{ secrets.CLUED_CONTEXT_READ_TOKEN }}
          CLUED_WORK_ADMISSION_ENFORCE: ${{ vars.CLUED_WORK_ADMISSION_ENFORCE }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/clued-work-admission.mjs --mode required
