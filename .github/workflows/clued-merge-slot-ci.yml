name: clued-merge-slot-ci

# Merge Admission v0.1 §7.3, step 3 of §13 (Task 3576d10d; Owner Decisions
# 4f576896 and 1fb7f6b3): the merge slot follows CI. Each time a CI workflow
# run completes, every hour and by hand, this reports to Clued the CI state of
# each open pull request that holds a merge slot
# (scripts/ci/clued-merge-slot-ci.mjs, clued_work_merge_slot_touch_v1):
# running keeps the slot 45 minutes, green 30 minutes, failed returns it. The
# holder no longer renews its claim to keep the slot while CI runs.
#
# workflow_run and schedule run this file and the script from the default
# branch, with the clued-admission environment's token (deployment branches
# limited to main). The triggering event is only a signal: the script reads
# the pull requests, check runs and workflow runs itself and trusts nothing in
# the event. A pull request cannot change this file for its own run.
#
# The workflows below are the CI workflows by name: gitleaks, trivy, the
# admission check and every gated workflow (scripts/ci/clued-merge-slot-ci.test.mjs
# keeps the list equal to the gated workflows on this branch). A missed name
# only delays a report to the hourly run.

on:
  workflow_run:
    workflows:
      - gitleaks
      - trivy
      - clued-work-admission
      - clued-cloud-node22-install
      - clued-cloud-quality
      - clued-components
      - Clued connection authorization candidate
      - Clued G4 Database Gate
      - design-refs
      - Information Flow M0-D E2E
      - model-program-m2-scoped-consumer
      - public-mcp-behavior
      - public-mcp-protocol
    types: [completed]
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

# One report at a time; a burst of completions leaves one pending run, which
# reads the state as it is then.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  report:
    name: clued-merge-slot-ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: clued-admission
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          persist-credentials: false
      - name: Self-test the merge slot report (no network, mocked fetch)
        run: node --test scripts/ci/clued-merge-slot-ci.test.mjs
      - name: Report the CI state of the pull requests holding a merge slot
        env:
          CLUED_CONTEXT_READ_TOKEN: ${{ secrets.CLUED_ADMISSION_CLUED_TOKEN }}
          CLUED_MERGE_ADMISSION_STATE: ${{ vars.CLUED_MERGE_ADMISSION_STATE }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/clued-merge-slot-ci.mjs
