name: clued-merge-slot-ci

# Merge Admission v0.1 §7.3, step 3 of §13 (Task 3576d10d; Owner Decisions
# 4f576896 and 1fb7f6b3): the merge slot follows CI. Each time a CI workflow
# run of a pull request completes, and by hand, this reports to Clued the CI
# state of each open pull request that holds a merge slot
# (scripts/ci/clued-merge-slot-ci.mjs, clued_work_merge_slot_touch_v1):
# running keeps the slot 90 minutes, green 30 minutes, failed returns it and
# fails the head's kooyumi-merge-slot check. The hourly report is a step of
# clued-work-admission-reverify.yml, which runs anyway, so it costs no extra
# hosted run. The holder no longer renews its claim to keep the slot.
# The final step calls the executor in this same job, after a successful
# report. No second workflow is started; skipped or failed reports cannot
# execute it. The executor still reads the queue and exact-head authorization
# itself. Ten minutes preserves the two former five-minute job budgets.
#
# workflow_run runs this file and the script from the default branch, with
# the clued-admission environment's token and App key (deployment branches
# limited to main). The triggering event is only a signal: the script reads
# the pull requests, check runs and workflow runs itself and trusts nothing in
# the event. The job's condition uses the event only to skip runs of push and
# schedule events, which are never a pull request's head. A pull request
# cannot change this file for its own run.
#
# The workflows below are the CI workflows by name: gitleaks, trivy, the
# admission check and every gated workflow (scripts/ci/clued-merge-slot-ci.test.mjs
# keeps the list equal to the gated workflows on this branch). A missed name
# only delays a report to the hourly run.

on:
  workflow_run:
    workflows:
      - gitleaks
      - trivy
      - kooyumi-work-admission
      - clued-cloud-node22-install
      - clued-cloud-quality
      - clued-components
      - contract-placement
      - Clued connection authorization candidate
      - Clued G4 Database Gate
      - design-refs
      - Information Flow M0-D E2E
      - model-program-m2-scoped-consumer
      - public-mcp-behavior
      - public-mcp-protocol
      - Clued handover hook qualification / company-linux-01
      - Clued handover hook qualification / company-linux-02
      - Clued handover hook qualification / company-linux-03
      - Clued handover hook qualification / company-linux-04
      - Clued handover hook qualification / home-linux-01
      - Clued handover hook qualification / company-win-01
      - Clued handover hook qualification / home-win-01
      - Clued disposable external handover qualification
      - Clued disposable cancellation fixture
      - Clued production publisher Host qualification
      - Clued production publisher Guest qualification
    types: [completed]
  workflow_dispatch:

permissions:
  # This job also executes the queue and reruns admitted gate-only runs.
  actions: write
  checks: read
  contents: read
  pull-requests: read

jobs:
  report:
    name: clued-merge-slot-ci
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'pull_request_target'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    environment: clued-admission
    # Share the independent executor's lock: the two entry points cannot mutate
    # the queue concurrently. A burst leaves one pending job; it reads all slots
    # and the current queue when it starts. Never cancel running queue work.
    concurrency:
      group: clued-merge-executor
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - name: Self-test the merge slot report and executor (no network, mocked fetch)
        run: node --test scripts/ci/clued-merge-slot-ci.test.mjs scripts/ci/clued-merge-executor.test.mjs
      - name: Report the CI state of the pull requests holding a merge slot
        env:
          CLUED_CONTEXT_READ_TOKEN: ${{ secrets.CLUED_ADMISSION_CLUED_TOKEN }}
          CLUED_ADMISSION_APP_ID: ${{ secrets.CLUED_ADMISSION_APP_ID }}
          CLUED_ADMISSION_APP_PRIVATE_KEY: ${{ secrets.CLUED_ADMISSION_APP_KEY }}
          CLUED_MERGE_ADMISSION_STATE: ${{ vars.CLUED_MERGE_ADMISSION_STATE }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/clued-merge-slot-ci.mjs
      - name: Bring the default branch into the queue head, turn on auto-merge or merge it
        timeout-minutes: 5
        env:
          CLUED_CONTEXT_READ_TOKEN: ${{ secrets.CLUED_ADMISSION_CLUED_TOKEN }}
          CLUED_ADMISSION_APP_ID: ${{ secrets.CLUED_ADMISSION_APP_ID }}
          CLUED_ADMISSION_APP_PRIVATE_KEY: ${{ secrets.CLUED_ADMISSION_APP_KEY }}
          CLUED_MERGE_ADMISSION_STATE: ${{ vars.CLUED_MERGE_ADMISSION_STATE }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/clued-merge-executor.mjs
      - name: Export the closed local natural R9 packet
        if: ${{ always() }}
        run: node scripts/ci/merge-admission-source-producer.mjs --export slot
      - name: Preserve natural R9 source observations
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clued-r9-natural-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: .clued-r9-source-events/sealed/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/natural-packet.json
          if-no-files-found: warn
          retention-days: 90
