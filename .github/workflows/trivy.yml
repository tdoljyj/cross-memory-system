name: trivy

# Owner Decisions 325717a6, 22b0e0ed and bc6fdad1: the scans run on a GitHub-hosted runner with free
# minutes under the $0 Actions budget cap as an executor only. Its job name is not a required check
# name; App 5368905 publishes the required trivy check after it verifies this run's relay identity,
# Native consumes a shared one-time permission before the scan. A failed or
# unknown permission never starts another scanner automatically.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  admission-gate:
    name: admission-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      admitted: ${{ steps.gate.outputs.admitted }}
      enforced: ${{ steps.gate.outputs.enforced }}
      verdict: ${{ steps.gate.outputs.verdict }}
      automation_self_hosted: ${{ steps.gate.outputs.automation_self_hosted }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      # Owner Decision 22b0e0ed: admit on the independent CI's own App 5368905 kooyumi-work-admission
      # check for this exact head, polled for at most 10 minutes; never on another App's check.
      - id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLUED_ADMISSION_GATE_SOURCE: independent-ci-native-work-admission
          CLUED_ADMISSION_GATE_WAIT_SECONDS: "600"
        run: node scripts/ci/clued-work-admission.mjs --mode gate

  trivy-trusted-self-hosted:
    needs: admission-gate
    name: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.actor == github.repository_owner || needs.admission-gate.outputs.automation_self_hosted == 'true'))) && 'trivy-hosted-executor' || 'trivy-hosted-executor-skipped' }}
    # Native's execution grant is PR-bound; push must not run an ungated scan.
    if: >-
      github.event_name == 'pull_request' && needs.admission-gate.outputs.admitted == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.actor == github.repository_owner || needs.admission-gate.outputs.automation_self_hosted == 'true')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Trusted base only; a failed/unknown Native burn stops every subsequent scan step.
      - name: Acquire one-time scan permission
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euC
          umask 077
          test "$GITHUB_EVENT_NAME" = pull_request
          test "${#BASE_SHA}" -eq 40
          case "$BASE_SHA" in *[!0-9a-f]*) exit 2 ;; esac
          curl -fsS --proto '=https' --max-time 30 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github.raw+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/tdoljyj/cross-memory-system/contents/scripts/ci/clued-scan-start.mjs?ref=$BASE_SHA" \
            > "$RUNNER_TEMP/clued-scan-start.mjs"
          echo "02eea1acaecc39ec179ac4201246509152dbf7bb7119687fb7cf640fb86146e1  $RUNNER_TEMP/clued-scan-start.mjs" | sha256sum -c --quiet -
          node "$RUNNER_TEMP/clued-scan-start.mjs" --run
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      # The local role's input refusals: only regular blobs (prepare-workspaces.py tree_modes_regular),
      # no path with a backslash, colon or control character, at most 100000 paths (formal-trivy-v4
      # snapshotTree), and no Java archive, which needs a Java DB the local role does not prepare
      # (required-trivy-v3/plans.mjs). Such a tree is never scanned here, only locally.
      - name: Refuse symlinks, submodules and other non-regular tree entries
        run: |
          set -eu
          git ls-tree -r -z --full-tree HEAD > "$RUNNER_TEMP/clued-trivy-tree"
          if tr '\0' '\n' < "$RUNNER_TEMP/clued-trivy-tree" | grep -Ev '^(100644|100755) blob [0-9a-f]{40}[[:space:]]' | grep -q .; then
            echo "::error title=trivy-hosted-executor::the tree has a symlink, submodule or other non-regular entry"
            exit 1
          fi
          git ls-files -z > "$RUNNER_TEMP/clued-trivy-paths"
          if grep -qzE '[\\:[:cntrl:]]|.{4096,}' "$RUNNER_TEMP/clued-trivy-paths"; then
            echo "::error title=trivy-hosted-executor::a path has a backslash, colon or control character, or is too long"
            exit 1
          fi
          if grep -qziE '\.(jar|war|ear|par)$' "$RUNNER_TEMP/clued-trivy-paths"; then
            echo "::error title=trivy-hosted-executor::a Java archive needs the Java DB the local role does not prepare"
            exit 1
          fi
          test "$(tr -cd '\0' < "$RUNNER_TEMP/clued-trivy-paths" | wc -c)" -le 100000
      # The local role scans a copy of the checked-out tree without .git (formal-trivy-v4 snapshotTree).
      - name: Snapshot the tree for the scanners
        run: |
          set -eu
          snap="$RUNNER_TEMP/clued-trivy-snapshot"
          mkdir "$snap"
          git ls-files -z | tar --null --no-recursion -T - -cf - | tar -xf - -C "$snap"
          chmod -R a+rX "$snap"
      # Cache preparation exactly as the local role (required-trivy-v3/plans.mjs databasePreparationPlan
      # and checksPreparationPlan, formal-trivy-v3/docker.mjs cacheCreateArguments): the only networked
      # containers, each with one fresh cache-only mount and nothing of the checkout. The vulnerability
      # DB comes from the same repositories in the same order (two attempts each) and must be current;
      # the checks bundle comes by the installed generation's digest, never the mutable trivy-checks:2
      # tag. A different digest, version or a stale DB fails the job.
      - name: Prepare the vulnerability DB and the pinned checks bundle
        timeout-minutes: 10
        env:
          TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.74.0@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9
          CHECKS_DIGEST: sha256:b0e12d009b01dcc8ca2ebbc199b9caf3922491978d21c17b61c1d7f6dc75220b
        run: |
          set -eu
          docker pull --quiet "$TRIVY_IMAGE" > /dev/null
          cache_run() {
            docker run --rm --pull=never --network=host --ipc=private --cgroupns=private --user=65532:65532 --read-only \
              --cap-drop=ALL --security-opt=no-new-privileges:true --pids-limit=128 --cpus=2 --memory=2147483648 \
              --memory-swap=2147483648 --ulimit=nofile=1024:1024 --env=NODE_OPTIONS= --env=NODE_PATH= --env=HOME=/scratch \
              --env=TMPDIR=/scratch --env=GODEBUG=http2client=0 \
              --tmpfs=/scratch:rw,nosuid,nodev,noexec,size=536870912,mode=0700,uid=65532,gid=65532 "$@"
          }
          read_back() {
            docker run --rm --pull=never --network=none --user=65532:65532 --read-only --cap-drop=ALL \
              --security-opt=no-new-privileges:true --mount "type=bind,src=$1,dst=/cache,readonly" --entrypoint "$2" "$TRIVY_IMAGE" "$3"
          }
          db=""
          n=0
          for repository in ghcr.io/aquasecurity/trivy-db:2 mirror.gcr.io/aquasec/trivy-db:2; do
            for attempt in 1 2; do
              n=$((n + 1)); stage="$RUNNER_TEMP/clued-trivy-db-$n"
              mkdir -m 0777 "$stage"
              if cache_run --mount "type=bind,src=$stage,dst=/cache,bind-propagation=rprivate" --workdir=/scratch \
                --entrypoint /usr/local/bin/trivy "$TRIVY_IMAGE" \
                fs --download-db-only --timeout 5m --cache-dir /cache --db-repository "$repository"; then
                db="$stage"; break 2
              fi
            done
          done
          test -n "$db"
          read_back "$db" /bin/cat /cache/db/metadata.json | python3 -I -B -c 'import json,sys,time; m=json.load(sys.stdin); now=time.strftime("%Y-%m-%dT%H:%M:%S", time.gmtime()); u, n = m["UpdatedAt"], m["NextUpdate"]; sys.exit(0 if m.get("Version") == 2 and u.endswith("Z") and n.endswith("Z") and u[:19] <= now < n[:19] else 1)'
          checks="$RUNNER_TEMP/clued-trivy-checks"; empty="$RUNNER_TEMP/clued-trivy-empty"
          mkdir -m 0777 "$checks"
          mkdir "$empty"
          cache_run --mount "type=bind,src=$checks,dst=/cache,bind-propagation=rprivate" \
            --mount "type=bind,src=$empty,dst=/empty,readonly,bind-propagation=rprivate" --workdir=/scratch \
            --entrypoint /usr/local/bin/trivy "$TRIVY_IMAGE" \
            fs --cache-dir /cache --checks-bundle-repository "ghcr.io/aquasecurity/trivy-checks@$CHECKS_DIGEST" \
            --scanners misconfig --severity HIGH,CRITICAL --exit-code 1 /empty
          read_back "$checks" /bin/cat /cache/policy/metadata.json | python3 -I -B -c 'import json,sys; m=json.load(sys.stdin); sys.exit(0 if m.get("Digest") == sys.argv[1] and m.get("MajorVersion") == 2 and m.get("CustomBuild") is not True else 1)' "$CHECKS_DIGEST"
          read_back "$checks" /bin/ls -R /cache/policy/content | grep -q '\.rego$'
          echo "CLUED_TRIVY_DB=$db/db" >> "$GITHUB_ENV"
          echo "CLUED_TRIVY_POLICY=$checks/policy" >> "$GITHUB_ENV"
      # The three scanners exactly as the local role (required-trivy-v3/plans.mjs requiredTrivyPlans,
      # verify-worker.mjs createArguments): no network, read-only root and mounts, uid 65532, cwd
      # /scratch, the prepared DB and checks only, no update of either, five minutes each.
      - name: Vulnerabilities (HIGH/CRITICAL)
        timeout-minutes: 5
        run: |
          set -eu
          docker run --rm --pull=never --network=none --ipc=private --cgroupns=private --user=65532:65532 --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges:true --pids-limit=128 --cpus=2 --memory=2147483648 \
            --memory-swap=2147483648 --ulimit=nofile=1024:1024 --env=NODE_OPTIONS= --env=NODE_PATH= --env=HOME=/scratch \
            --env=TMPDIR=/scratch --tmpfs=/scratch:rw,nosuid,nodev,noexec,size=536870912,mode=0700,uid=65532,gid=65532 \
            --mount "type=bind,src=$RUNNER_TEMP/clued-trivy-snapshot,dst=/repo,readonly,bind-propagation=rprivate" \
            --mount "type=bind,src=$CLUED_TRIVY_DB,dst=/scratch/db,readonly,bind-propagation=rprivate" \
            --mount "type=bind,src=$CLUED_TRIVY_POLICY,dst=/scratch/policy,readonly,bind-propagation=rprivate" \
            --workdir=/scratch --entrypoint /usr/local/bin/trivy \
            ghcr.io/aquasecurity/trivy:0.74.0@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9 \
            fs --skip-db-update --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --cache-dir /scratch --skip-check-update --skip-version-check --disable-telemetry /repo
      - name: Secrets
        timeout-minutes: 5
        run: |
          set -eu
          docker run --rm --pull=never --network=none --ipc=private --cgroupns=private --user=65532:65532 --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges:true --pids-limit=128 --cpus=2 --memory=2147483648 \
            --memory-swap=2147483648 --ulimit=nofile=1024:1024 --env=NODE_OPTIONS= --env=NODE_PATH= --env=HOME=/scratch \
            --env=TMPDIR=/scratch --tmpfs=/scratch:rw,nosuid,nodev,noexec,size=536870912,mode=0700,uid=65532,gid=65532 \
            --mount "type=bind,src=$RUNNER_TEMP/clued-trivy-snapshot,dst=/repo,readonly,bind-propagation=rprivate" \
            --mount "type=bind,src=$CLUED_TRIVY_DB,dst=/scratch/db,readonly,bind-propagation=rprivate" \
            --mount "type=bind,src=$CLUED_TRIVY_POLICY,dst=/scratch/policy,readonly,bind-propagation=rprivate" \
            --workdir=/scratch --entrypoint /usr/local/bin/trivy \
            ghcr.io/aquasecurity/trivy:0.74.0@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9 \
            fs --scanners secret --exit-code 1 \
            --cache-dir /scratch --skip-check-update --skip-version-check --disable-telemetry /repo
      - name: Misconfiguration (HIGH/CRITICAL)
        timeout-minutes: 5
        run: |
          set -eu
          docker run --rm --pull=never --network=none --ipc=private --cgroupns=private --user=65532:65532 --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges:true --pids-limit=128 --cpus=2 --memory=2147483648 \
            --memory-swap=2147483648 --ulimit=nofile=1024:1024 --env=NODE_OPTIONS= --env=NODE_PATH= --env=HOME=/scratch \
            --env=TMPDIR=/scratch --tmpfs=/scratch:rw,nosuid,nodev,noexec,size=536870912,mode=0700,uid=65532,gid=65532 \
            --mount "type=bind,src=$RUNNER_TEMP/clued-trivy-snapshot,dst=/repo,readonly,bind-propagation=rprivate" \
            --mount "type=bind,src=$CLUED_TRIVY_DB,dst=/scratch/db,readonly,bind-propagation=rprivate" \
            --mount "type=bind,src=$CLUED_TRIVY_POLICY,dst=/scratch/policy,readonly,bind-propagation=rprivate" \
            --workdir=/scratch --entrypoint /usr/local/bin/trivy \
            ghcr.io/aquasecurity/trivy:0.74.0@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9 \
            fs --checks-bundle-repository ghcr.io/aquasecurity/trivy-checks:2 --scanners misconfig --severity HIGH,CRITICAL --exit-code 1 \
            --cache-dir /scratch --skip-check-update --skip-version-check --disable-telemetry /repo
      - name: Emit relay identity
        # Hex, not the JWT text: GitHub masks JWT-shaped text in logs and annotations (Task 169fd456).
        run: |
          set -eu
          tokenhex="$(curl -fsS --max-time 30 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=clued-hosted-relay-v1" \
            | python3 -I -B -c 'import json,sys; print(json.load(sys.stdin)["value"].encode("ascii").hex())')"
          echo "::notice title=clued-hosted-relay-v1::$tokenhex"
