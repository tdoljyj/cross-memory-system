name: trivy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Vulnerabilities (HIGH/CRITICAL)
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/aquasecurity/trivy:0.74.0@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9 \
            fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /repo
      - name: Secrets
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/aquasecurity/trivy:0.74.0@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9 \
            fs --scanners secret --exit-code 1 /repo
      - name: Misconfiguration (HIGH/CRITICAL)
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/aquasecurity/trivy:0.74.0@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9 \
            fs --scanners misconfig --severity HIGH,CRITICAL --exit-code 1 /repo
