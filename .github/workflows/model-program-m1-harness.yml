name: model-program-m1-harness
on:
  pull_request:
    paths:
      - "development/contracts/model-program/m1/harness/**"
      - "development/contracts/model-program/m1/schemas/**"
      - "scripts/model-program/m1_invocation_harness.py"
      - "scripts/model-program/validate_m1_harness.py"
      - "tests/fixtures/model-program-m1-harness/**"
      - "tests/test_model_program_m1_harness.py"
      - "development/contracts/model-program/m2/**"
      - "scripts/model-program/validate_m2_*.py"
      - "tests/fixtures/model-program-m2/**"
      - "tests/test_model_program_m2_*.py"
      - ".github/workflows/model-program-m1-harness.yml"
  push:
    branches: [main]
    paths:
      - "development/contracts/model-program/m1/harness/**"
      - "development/contracts/model-program/m1/schemas/**"
      - "scripts/model-program/m1_invocation_harness.py"
      - "scripts/model-program/validate_m1_harness.py"
      - "tests/fixtures/model-program-m1-harness/**"
      - "tests/test_model_program_m1_harness.py"
      - "development/contracts/model-program/m2/**"
      - "scripts/model-program/validate_m2_*.py"
      - "tests/fixtures/model-program-m2/**"
      - "tests/test_model_program_m2_*.py"
      - ".github/workflows/model-program-m1-harness.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-trusted-self-hosted:
    timeout-minutes: 20
    if: >-
      (github.event_name == 'push' &&
       github.actor == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == github.repository_owner)
    runs-on: [self-hosted, Windows, X64, clued, pool-general, trust-internal, cap-python312]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - name: Verify pre-provisioned Python 3.12
        shell: powershell
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
      - name: Prepare isolated Python environment
        shell: powershell
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "clued-python-venv"
          python -m venv $venv
          & "$venv\Scripts\python.exe" -m pip install --disable-pip-version-check jsonschema==4.25.1
          "$venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python -m py_compile scripts/model-program/m1_invocation_harness.py scripts/model-program/validate_m1_harness.py
      - run: python scripts/model-program/validate_m1_harness.py
      - run: python -m unittest tests.test_model_program_m1_harness -v
      - name: Validate M2 synthetic foundation and unresolved mapping candidate
        run: python scripts/model-program/validate_m2_dataset_foundation.py
      - run: python scripts/model-program/validate_m2_split_mapping.py
      - run: python scripts/model-program/validate_m2_adopted_definition.py
      - run: python scripts/model-program/validate_m2_domain_recognition.py
      - run: python -m unittest discover -s tests -p "test_model_program_m2_*.py" -v

  validate-untrusted-hosted:
    timeout-minutes: 20
    if: >-
      (github.event_name == 'push' &&
       github.actor != github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       (github.event.pull_request.head.repo.full_name != github.repository ||
        github.actor != github.repository_owner))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - run: python -m py_compile scripts/model-program/m1_invocation_harness.py scripts/model-program/validate_m1_harness.py
      - run: python scripts/model-program/validate_m1_harness.py
      - run: python -m unittest tests.test_model_program_m1_harness -v
      - name: Validate M2 synthetic foundation and unresolved mapping candidate
        run: python scripts/model-program/validate_m2_dataset_foundation.py
      - run: python scripts/model-program/validate_m2_split_mapping.py
      - run: python scripts/model-program/validate_m2_adopted_definition.py
      - run: python scripts/model-program/validate_m2_domain_recognition.py
      - run: python -m unittest discover -s tests -p "test_model_program_m2_*.py" -v
