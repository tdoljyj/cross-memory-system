name: model-program-m1-harness
on:
  pull_request:
    paths:
      - "development/contracts/model-program/m1/harness/**"
      - "development/contracts/model-program/m1/schemas/**"
      - "scripts/model-program/m1_invocation_harness.py"
      - "scripts/model-program/validate_m1_harness.py"
      - "tests/fixtures/model-program-m1-harness/**"
      - "tests/test_model_program_m1_harness.py"
      - ".github/workflows/model-program-m1-harness.yml"
  push:
    branches: [main]
    paths:
      - "development/contracts/model-program/m1/harness/**"
      - "development/contracts/model-program/m1/schemas/**"
      - "scripts/model-program/m1_invocation_harness.py"
      - "scripts/model-program/validate_m1_harness.py"
      - "tests/fixtures/model-program-m1-harness/**"
      - "tests/test_model_program_m1_harness.py"
      - ".github/workflows/model-program-m1-harness.yml"

permissions:
  contents: read

jobs:
  validate-trusted-self-hosted:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == github.repository_owner)
    runs-on:
      - self-hosted
      - Windows
      - X64
      - clued
      - pool-general
      - trust-internal
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify system Python 3.12
        shell: powershell
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
      - run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - run: python -m py_compile scripts/model-program/m1_invocation_harness.py scripts/model-program/validate_m1_harness.py
      - run: python scripts/model-program/validate_m1_harness.py
      - run: python -m unittest tests.test_model_program_m1_harness -v

  validate-untrusted-hosted:
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.pull_request.head.repo.full_name != github.repository ||
       github.actor != github.repository_owner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - run: python -m py_compile scripts/model-program/m1_invocation_harness.py scripts/model-program/validate_m1_harness.py
      - run: python scripts/model-program/validate_m1_harness.py
      - run: python -m unittest tests.test_model_program_m1_harness -v
