name: Clued storage client source capture

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Exact approved authorization request UUID
        required: true
        type: string
      request_digest:
        description: Exact immutable authorization request SHA-256
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: clued-storage-client-source
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/clued-cloud
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/clued-cloud/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Capture exact nonsecret registration source
        env:
          CLUED_ATTESTATION_DATABASE_URL: ${{ secrets.CLUED_ATTESTATION_DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLUED_CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLUED_CLOUDFLARE_ACCOUNT_ID }}
          REQUEST_ID: ${{ inputs.request_id }}
          REQUEST_DIGEST: ${{ inputs.request_digest }}
        run: |
          test -n "$CLUED_ATTESTATION_DATABASE_URL"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          mkdir -p .sites-runtime/storage-client-source
          node scripts/storage-client-registration-source.mjs \
            --request-id "$REQUEST_ID" \
            --expected-request-digest "$REQUEST_DIGEST" \
            --expected-release-sha "$GITHUB_SHA" \
            --output .sites-runtime/storage-client-source/registration.json
      - name: Preserve reviewed nonsecret source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clued-storage-client-source-${{ github.run_id }}
          path: apps/clued-cloud/.sites-runtime/storage-client-source/registration.json
          if-no-files-found: error
          retention-days: 1
