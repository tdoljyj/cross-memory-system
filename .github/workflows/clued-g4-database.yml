name: Clued G4 Database Gate

on:
  workflow_dispatch:
  push:
    branches:
      - feat/clued-two-level-views-v1
    paths:
      - .github/workflows/clued-g4-database.yml
      - apps/clued-cloud/package.json
      - apps/clued-cloud/package-lock.json
      - apps/clued-cloud/supabase/**
  pull_request:
    paths:
      - .github/workflows/clued-g4-database.yml
      - apps/clued-cloud/package.json
      - apps/clued-cloud/package-lock.json
      - apps/clued-cloud/supabase/**

permissions:
  contents: read

concurrency:
  group: clued-g4-database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-gate-trusted-self-hosted:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.actor == github.repository_owner) ||
      (github.event_name == 'push' &&
       github.actor == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == github.repository_owner)
    name: Supabase migration, RLS, transaction, and pgTAP
    runs-on: [self-hosted, Linux, X64, clued, pool-general, trust-internal, cap-docker-linux]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/clued-cloud

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: apps/clued-cloud/package-lock.json

      - name: Start isolated Supabase runtime
        run: npm run db:start

      - name: Reapply migrations from a clean database
        run: npm run db:reset

      - name: Lint public and private database schemas
        run: npm run db:lint

      - name: Run Unified Record V2 RLS and transaction tests
        run: npm run db:test:m1

      - name: Capture safe failure diagnostics
        if: failure()
        run: |
          docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
          docker system df

      - name: Stop isolated Supabase runtime
        if: always()
        run: npx --yes supabase@2.115.0 stop --no-backup

  database-gate-untrusted-hosted:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.actor != github.repository_owner) ||
      (github.event_name == 'push' &&
       github.actor != github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       (github.event.pull_request.head.repo.full_name != github.repository ||
        github.actor != github.repository_owner))
    name: Supabase migration, RLS, transaction, and pgTAP (hosted)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/clued-cloud

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: apps/clued-cloud/package-lock.json

      - name: Start isolated Supabase runtime
        run: npm run db:start

      - name: Reapply migrations from a clean database
        run: npm run db:reset

      - name: Lint public and private database schemas
        run: npm run db:lint

      - name: Run Unified Record V2 RLS and transaction tests
        run: npm run db:test:m1

      - name: Capture safe failure diagnostics
        if: failure()
        run: |
          docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
          docker system df

      - name: Stop isolated Supabase runtime
        if: always()
        run: npx --yes supabase@2.115.0 stop --no-backup
