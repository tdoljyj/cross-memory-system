name: Clued G4 Database Gate

on:
  workflow_dispatch:
    inputs:
      admission_run_id:
        description: Id of a successful clued-work-admission-dispatch run that admitted this workflow and ref
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - .github/workflows/clued-g4-database.yml
      - .github/workflows/clued-cloud-production-release.yml
      - apps/clued-cloud/scripts/verify-production-backup-scope.mjs
      - apps/clued-cloud/tests/production-backup-scope-db.test.mjs
      - 'scripts/ci/clued-push-reuse.mjs'
      - 'scripts/ci/clued-push-reuse.test.mjs'
      - 'scripts/ci/clued-g4-fresh-start.mjs'
      - 'scripts/ci/clued-g4-fresh-start.test.mjs'
      - 'scripts/ci/merge-admission-measurement-history*.mjs'
      - 'apps/clued-cloud/tests/merge-admission-measurement-history-db.test.mjs'
      - 'scripts/ci/merge-admission-clock-source.mjs'
      - 'scripts/ci/merge-admission-clock-source.test.mjs'
      - 'apps/clued-cloud/tests/merge-admission-measurement-clock-target-db.test.mjs'
      - apps/clued-cloud/package.json
      - apps/clued-cloud/package-lock.json
      - apps/clued-cloud/supabase/**
  pull_request:
    paths:
      - .github/workflows/clued-g4-database.yml
      - .github/workflows/clued-cloud-production-release.yml
      - apps/clued-cloud/scripts/verify-production-backup-scope.mjs
      - apps/clued-cloud/tests/production-backup-scope-db.test.mjs
      - 'scripts/ci/clued-push-reuse.mjs'
      - 'scripts/ci/clued-push-reuse.test.mjs'
      - 'scripts/ci/clued-g4-fresh-start.mjs'
      - 'scripts/ci/clued-g4-fresh-start.test.mjs'
      - 'scripts/ci/merge-admission-measurement-history*.mjs'
      - 'apps/clued-cloud/tests/merge-admission-measurement-history-db.test.mjs'
      - 'scripts/ci/merge-admission-clock-source.mjs'
      - 'scripts/ci/merge-admission-clock-source.test.mjs'
      - 'apps/clued-cloud/tests/merge-admission-measurement-clock-target-db.test.mjs'
      - apps/clued-cloud/package.json
      - apps/clued-cloud/package-lock.json
      - apps/clued-cloud/supabase/**

permissions:
  contents: read

concurrency:
  group: clued-g4-database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Use the registered required-tests Native gate: App 5368905, exact head/PR,
  # bounded 600-second wait, trusted base code and no Clued token. An all-jobs
  # repair is allowed only when every earlier heavy job was skipped under an
  # accepted not-admitted verdict; old NO_ADMISSION_RUN never qualifies.
  admission-gate:
    name: admission-gate
    runs-on: [self-hosted, Linux, X64, clued, pool-general, trust-internal]
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      admitted: ${{ steps.gate.outputs.admitted }}
      enforced: ${{ steps.gate.outputs.enforced }}
      verdict: ${{ steps.gate.outputs.verdict }}
      automation_self_hosted: ${{ steps.gate.outputs.automation_self_hosted }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      # Owner Decision 22b0e0ed: admit on the independent CI's own App 5368905 kooyumi-work-admission
      # check for this exact head, polled for at most 10 minutes; never on another App's check.
      - id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLUED_ADMISSION_GATE_SOURCE: independent-ci-native-work-admission
          CLUED_ADMISSION_GATE_WAIT_SECONDS: "600"
        run: node scripts/ci/clued-work-admission.mjs --mode gate

  push-reuse:
    name: Verify prior PR tested tree
    needs: admission-gate
    if: needs.admission-gate.outputs.admitted == 'true' && (github.event_name == 'push')
    # Main-only reuse verification executes merged code without environment secrets.
    runs-on: [self-hosted, Linux, X64, clued, pool-general, trust-internal]
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      run_heavy: ${{ steps.reuse.outputs.run_heavy }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: github.event_name == 'push'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: github.event_name == 'push'
        with:
          node-version: 22.23.3
      - name: Configure job temporary storage
        if: github.event_name == 'push'
        uses: ./.github/actions/ci-temporary-storage
      - name: Verify duplicate-push proof regressions
        if: github.event_name == 'push'
        run: node --test scripts/ci/clued-push-reuse.test.mjs
      - id: reuse
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REUSE_WORKFLOW: clued-g4-database.yml
        run: node scripts/ci/clued-push-reuse.mjs

  database-gate-trusted-self-hosted:
    needs: [admission-gate, push-reuse]
    if: >-
      needs.admission-gate.outputs.admitted == 'true' &&
      (!cancelled() && needs.admission-gate.result == 'success' &&
       (github.event_name != 'push' || needs.push-reuse.result != 'success' ||
        needs.push-reuse.outputs.run_heavy != 'false') &&
      ((github.event_name == 'workflow_dispatch' &&
       github.actor == github.repository_owner) ||
      (github.event_name == 'push' &&
       github.actor == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == github.repository_owner)))
    name: Supabase migration, RLS, transaction, and pgTAP
    runs-on: [self-hosted, Linux, X64, clued, pool-general, trust-internal, cap-docker-linux]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/clued-cloud

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
          # Self-hosted runners keep a persistent ~/.npm that npm ci reuses below;
          # restoring the ~860 MB Actions cache on top of it only adds download time.

      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - name: Install application dependencies
        # CPU bindings are bundled; G4 does not need the optional CUDA binaries.
        env:
          ONNXRUNTIME_NODE_INSTALL: 'skip'
        run: npm ci --cache "$HOME/.npm" --prefer-offline

      - name: Build the application surfaces used by lifecycle tests
        run: npm run build

      - name: Verify fresh-start guard regressions
        run: node --test ../../scripts/ci/clued-g4-fresh-start.test.mjs

      - name: Prepare, start and verify one fresh isolated Supabase runtime
        run: |
          set -euo pipefail
          umask 077
          # All runner workspaces using this local daemon share this lock. It
          # spans the socket-probe -> Docker-publish handoff, not the test run.
          lock=$(node ../../scripts/ci/clued-g4-fresh-start.mjs --lock-path)
          exec 9>>"$lock"
          flock --exclusive --timeout 300 9 || { echo '::error::fresh_start_lock_timeout'; exit 1; }
          export CLUED_G4_START_LOCK_FD=9
          export CLUED_G4_FRESH_PROJECT="clued-g4-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export DOCKER_HOST=unix:///var/run/docker.sock DOCKER_CONTEXT=default
          node ../../scripts/ci/clued-g4-fresh-start.mjs --prepare
          npx --yes --cache "$HOME/.npm" --prefer-offline --fetch-retries=5 --package=supabase@2.115.0 --package=@supabase/cli-linux-x64@2.115.0 supabase start
          # start applies no migration; the full chain is applied once, as production runs it, to a proven empty project.
          node ../../scripts/ci/clued-local-migrate.mjs
          node ../../scripts/ci/clued-g4-fresh-start.mjs --verify

      - name: Lint public and private database schemas
        run: npx --yes --cache "$HOME/.npm" --prefer-offline --fetch-retries=5 --package=supabase@2.115.0 --package=@supabase/cli-linux-x64@2.115.0 supabase db lint --local --schema public,clued_private --level error --fail-on error

      - name: Run Unified Record V2 RLS and transaction tests
        run: npx --yes --cache "$HOME/.npm" --prefer-offline --fetch-retries=5 --package=supabase@2.115.0 --package=@supabase/cli-linux-x64@2.115.0 supabase test db supabase/tests/m1_runtime_contracts.test.sql supabase/tests/m1_legacy_mapping.test.sql --local

      - name: Run Project Lifecycle Successor v2 database and surface tests
        run: npm run test:project:lifecycle:v2

      - name: Verify measurement journal transactions and FIFO replay
        run: |
          node scripts/run-tests.mjs --test tests/merge-admission-measurement-history-db.test.mjs
          node scripts/run-tests.mjs --test tests/merge-admission-measurement-clock-target-db.test.mjs
          node scripts/run-tests.mjs --test tests/merge-admission-clock-audit-transport-db.test.mjs
          node --test ../../scripts/ci/merge-admission-measurement-history.test.mjs
          node --test ../../scripts/ci/merge-admission-clock-source.test.mjs

      - name: Verify actual PostgreSQL17 production backup coverage
        run: |
          image=postgres@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
          fallback=public.ecr.aws/docker/library/postgres@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
          # Inspect both exact content addresses before requiring network access.
          image_source=primary-cache
          if docker image inspect "$image" >/dev/null 2>&1; then
            :
          elif docker image inspect "$fallback" >/dev/null 2>&1; then
            image="$fallback"
            image_source=fallback-cache
          elif docker pull "$image"; then
            image_source=primary-pull
          else
            image="$fallback"
            image_source=fallback-pull
            docker pull "$image"
          fi
          printf 'PostgreSQL17 backup image: %s (%s)\n' "$image" "$image_source"
          docker info --format 'Backup verification daemon: {{.ID}} / {{.Name}}'
          CLUED_BACKUP_TEST_IMAGE="$image" node scripts/run-tests.mjs --test tests/production-backup-scope-db.test.mjs

      - name: Capture safe failure diagnostics
        if: failure()
        run: |
          docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
          docker system df

      - name: Stop isolated Supabase runtime
        if: always() && env.CLUED_G4_FRESH_PROJECT != ''
        run: node ../../scripts/ci/clued-g4-fresh-start.mjs --cleanup

      - name: Preserve this attempt's safe allocation and cleanup diagnostics
        if: always() && env.CLUED_G4_FRESH_PROJECT != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g4-fresh-start-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/clued-g4-fresh-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Record the actual PR test tree
        if: success() && github.event_name == 'pull_request'
        env:
          REUSE_WORKFLOW: clued-g4-database.yml
          REUSE_REPORT_PATH: ${{ runner.temp }}/clued-tested-tree.json
        run: node ../../scripts/ci/clued-push-reuse.mjs --report
      - name: Upload the actual PR test tree
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clued-tested-tree-clued-g4-database.yml-${{ github.run_attempt }}
          path: ${{ runner.temp }}/clued-tested-tree.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  database-gate-untrusted-hosted:
    needs: [admission-gate, push-reuse]
    if: >-
      needs.admission-gate.outputs.admitted == 'true' &&
      (!cancelled() && needs.admission-gate.result == 'success' &&
       (github.event_name != 'push' || needs.push-reuse.result != 'success' ||
        needs.push-reuse.outputs.run_heavy != 'false') &&
      ((github.event_name == 'workflow_dispatch' &&
       github.actor != github.repository_owner) ||
      (github.event_name == 'push' &&
       github.actor != github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       (github.event.pull_request.head.repo.full_name != github.repository ||
        github.actor != github.repository_owner))))
    name: Supabase migration, RLS, transaction, and pgTAP (hosted)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/clued-cloud

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/clued-cloud/package-lock.json

      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - name: Install application dependencies
        # CPU bindings are bundled; G4 does not need the optional CUDA binaries.
        env:
          ONNXRUNTIME_NODE_INSTALL: 'skip'
        run: npm ci

      - name: Build the application surfaces used by lifecycle tests
        run: npm run build

      - name: Verify fresh-start guard regressions
        run: node --test ../../scripts/ci/clued-g4-fresh-start.test.mjs

      - name: Prepare, start and verify one fresh isolated Supabase runtime
        run: |
          set -euo pipefail
          umask 077
          lock=$(node ../../scripts/ci/clued-g4-fresh-start.mjs --lock-path)
          exec 9>>"$lock"
          flock --exclusive --timeout 300 9 || { echo '::error::fresh_start_lock_timeout'; exit 1; }
          export CLUED_G4_START_LOCK_FD=9
          export CLUED_G4_FRESH_PROJECT="clued-g4-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export DOCKER_HOST=unix:///var/run/docker.sock DOCKER_CONTEXT=default
          node ../../scripts/ci/clued-g4-fresh-start.mjs --prepare
          npx --yes --cache "$HOME/.npm" --prefer-offline --fetch-retries=5 --package=supabase@2.115.0 --package=@supabase/cli-linux-x64@2.115.0 supabase start
          node ../../scripts/ci/clued-local-migrate.mjs
          node ../../scripts/ci/clued-g4-fresh-start.mjs --verify

      - name: Lint public and private database schemas
        run: npx --yes --cache "$HOME/.npm" --prefer-offline --fetch-retries=5 --package=supabase@2.115.0 --package=@supabase/cli-linux-x64@2.115.0 supabase db lint --local --schema public,clued_private --level error --fail-on error

      - name: Run Unified Record V2 RLS and transaction tests
        run: npx --yes --cache "$HOME/.npm" --prefer-offline --fetch-retries=5 --package=supabase@2.115.0 --package=@supabase/cli-linux-x64@2.115.0 supabase test db supabase/tests/m1_runtime_contracts.test.sql supabase/tests/m1_legacy_mapping.test.sql --local

      - name: Run Project Lifecycle Successor v2 database and surface tests
        run: npm run test:project:lifecycle:v2

      - name: Verify measurement journal transactions and FIFO replay
        run: |
          node scripts/run-tests.mjs --test tests/merge-admission-measurement-history-db.test.mjs
          node scripts/run-tests.mjs --test tests/merge-admission-measurement-clock-target-db.test.mjs
          node scripts/run-tests.mjs --test tests/merge-admission-clock-audit-transport-db.test.mjs
          node --test ../../scripts/ci/merge-admission-measurement-history.test.mjs
          node --test ../../scripts/ci/merge-admission-clock-source.test.mjs

      - name: Verify actual PostgreSQL17 production backup coverage
        run: |
          image=postgres@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
          fallback=public.ecr.aws/docker/library/postgres@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
          # Inspect both exact content addresses before requiring network access.
          image_source=primary-cache
          if docker image inspect "$image" >/dev/null 2>&1; then
            :
          elif docker image inspect "$fallback" >/dev/null 2>&1; then
            image="$fallback"
            image_source=fallback-cache
          elif docker pull "$image"; then
            image_source=primary-pull
          else
            image="$fallback"
            image_source=fallback-pull
            docker pull "$image"
          fi
          printf 'PostgreSQL17 backup image: %s (%s)\n' "$image" "$image_source"
          docker info --format 'Backup verification daemon: {{.ID}} / {{.Name}}'
          CLUED_BACKUP_TEST_IMAGE="$image" node scripts/run-tests.mjs --test tests/production-backup-scope-db.test.mjs

      - name: Capture safe failure diagnostics
        if: failure()
        run: |
          docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
          docker system df

      - name: Stop isolated Supabase runtime
        if: always() && env.CLUED_G4_FRESH_PROJECT != ''
        run: node ../../scripts/ci/clued-g4-fresh-start.mjs --cleanup

      - name: Preserve this attempt's safe allocation and cleanup diagnostics
        if: always() && env.CLUED_G4_FRESH_PROJECT != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g4-fresh-start-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/clued-g4-fresh-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 7

