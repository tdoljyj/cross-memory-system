name: hosted-required

# Hosted scaffold (Owner Decisions 61b65d61 and 494326b5; FABLE-cicd-framework-v1
# §2.3, hosted scaffold report §1.2): the seven required checks of the
# independent CI, run once more on GitHub-hosted runners under hosted- names, so
# that the scaffold ruleset can require them while the independent CI shadows
# (both sets of checks on the same head, compared by scripts/ci/shadow-compare.mjs).
# It is temporary: when the scaffold ruleset is switched off for good (stage S8)
# this file and its runner-budget entry are deleted together.
#
# - Same entry as the self-hosted jobs: scripts/ci/ci-required-selection.mjs
#   from the trusted base checkout selects and runs the suites (clued-required-
#   tests.yml and clued-required-tests-windows.yml); hosted-gitleaks repeats the
#   R1 changed-range steps of clued-required-tests.yml's gitleaks job, the other
#   scans the executor steps of trivy.yml and contract-placement.yml.
# - Hosted machines are thrown away after each job: there is no node to protect,
#   so no admission gate; the admission check is the scaffold ruleset's own
#   kooyumi-work-admission (App 5164952, clued-work-admission.yml). No secret,
#   no environment, no id-token, read-only token, persist-credentials off.
# - Not here, because a hosted machine cannot do it: the Native one-time scan
#   permission and the relay identity of the hosted executors (independent-CI
#   relay only), and everything that measures the nodes themselves.
#
# Triggers: every pull request into main (what the scaffold ruleset requires) and
# the train's clued-train/staging push (trial stage, both rulesets on). No push
# to main: a merge would run everything again on the same tree (the R2 rule of
# clued-work-admission.test.mjs); a main commit is not judged by these checks.
on:
  pull_request:
    branches: [main]
  push:
    branches: [clued-train/staging]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/clued-train/staging' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clued-cloud-tests-shard:
    name: ${{ format('hosted-clued-cloud-tests-shard-{0}', matrix.shard) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          path: candidate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Resolve push baseline before loading trusted commands
        id: train-base
        working-directory: candidate
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/clued-pycache
          WRANGLER_LOG_PATH: ${{ runner.temp }}/clued-wrangler-logs
        shell: bash
        run: |
          set -euo pipefail
          # CI_BASE_SHA and the staging trusted ref, for every event, from the one rule in scripts/ci/ci-base.mjs read from main
          # (the candidate copy only while main has none: the change that adds it). Later steps read CI_BASE_SHA from GITHUB_ENV.
          node --input-type=module -e "
            const { execFileSync } = await import('node:child_process');
            const git = (...args) => execFileSync('git', args, { encoding: 'utf8' });
            const onMain = git('ls-tree', '--name-only', 'origin/main', 'scripts/ci/ci-base.mjs').trim() !== '';
            if (!onMain) console.log('::warning title=CI base::main has no scripts/ci/ci-base.mjs yet; the candidate copy resolves the base');
            const source = onMain ? git('show', 'origin/main:scripts/ci/ci-base.mjs') : (await import('node:fs')).readFileSync('scripts/ci/ci-base.mjs', 'utf8');
            const { writeCiBase } = await import('data:text/javascript;base64,' + Buffer.from(source).toString('base64'));
            process.exitCode = await writeCiBase();"
      - name: Check out the trusted base (selection and commands)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ steps.train-base.outputs.sha || github.event.pull_request.base.sha || github.sha }}
          path: trusted
      - name: Configure job temporary storage
        uses: ./trusted/.github/actions/ci-temporary-storage
      - &prepare-linux-git
        name: Prepare declared Git
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "::error title=工具准备失败::Git 准备步骤在第 $LINENO 行失败"' ERR
          policy=trusted/config/ci-toolchain.json
          # On the PR introducing the declaration the trusted base does not have it yet.
          if [[ ! -e "$policy" ]]; then policy=candidate/config/ci-toolchain.json; fi
          version=$(node -e 'const git = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).linux?.git;
            if (typeof git !== "string" || !/^\d+\.\d+\.\d+$/.test(git)) throw new Error("invalid Git version");
            console.log(git)' "$policy")

          # Use the signed Noble repositories and extract the package in the job directory, without changing system Git.
          tool=$(mktemp -d "$RUNNER_TEMP/clued-ci-git.XXXXXX")
          cd "$tool"
          mkdir -p lists/partial bin
          export APT_CONFIG="$tool/apt.conf"
          cat >"$APT_CONFIG" <<EOF
          Dir::Etc::Parts "-";
          Dir::Etc::Main "-";
          Dir::Etc::sourcelist "$tool/sources.list";
          Dir::Etc::sourceparts "-";
          Dir::State::lists "$tool/lists";
          Dir::State::status "/dev/null";
          Dir::Cache::pkgcache "";
          Dir::Cache::srcpkgcache "";
          Acquire::Languages "none";
          Acquire::Retries "2";
          EOF
          keyring=/usr/share/keyrings/ubuntu-archive-keyring.gpg
          cat >sources.list <<EOF
          deb [signed-by=$keyring] https://archive.ubuntu.com/ubuntu noble main
          deb [signed-by=$keyring] https://archive.ubuntu.com/ubuntu noble-updates main
          deb [signed-by=$keyring] https://security.ubuntu.com/ubuntu noble-security main
          EOF
          apt-get update -o APT::Update::Error-Mode=any
          package=$(LC_ALL=C apt-cache policy git | awk '$1 == "Candidate:" { print $2 }')
          if [[ "${package#*:}" != "$version"-* ]]; then
            echo "::error title=工具准备失败::Noble 的 Git 包与声明 $version 不符（${package:-无候选包}）"
            exit 1
          fi
          apt-get download "git=$package"
          dpkg-deb --extract git_*.deb package
          # Keep helpers and templates with the binary even when a suite filters its environment.
          cat >bin/git <<'EOF'
          #!/bin/sh
          package=$(CDPATH= cd -- "$(dirname -- "$0")/../package" && pwd) || exit 1
          export GIT_EXEC_PATH="$package/usr/lib/git-core"
          export GIT_TEMPLATE_DIR="$package/usr/share/git-core/templates"
          exec "$package/usr/bin/git" "$@"
          EOF
          chmod +x bin/git
          actual=$(bin/git --version)
          [[ "$actual" == "git version $version" ]]
          echo "$actual"
          printf '%s\n' "$tool/bin" >> "$GITHUB_PATH"
      - name: Select suites
        id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node trusted/scripts/ci/ci-required-selection.mjs --check clued-cloud-tests
      # A hosted runner starts with an empty npm cache: ci-deps.mjs prepares it (its one networked step), then installs offline.
      - name: Install the application dependencies
        if: steps.select.outputs.run_clued_cloud == 'true'
        run: |
          node trusted/scripts/ci/ci-deps.mjs install candidate/apps/clued-cloud
          cd candidate/apps/clued-cloud && timeout --signal=TERM --kill-after=15s 2m npm rebuild @embedded-postgres/linux-x64
      - name: Build application for a trusted selector predating per-shard build
        if: steps.select.outputs.run_clued_cloud == 'true'
        shell: bash
        run: |
          per_shard=$(node --input-type=module -e "import { SUITE_COMMANDS } from './trusted/scripts/ci/ci-required-selection.mjs'; console.log(SUITE_COMMANDS['clued-cloud'].some(command => command.every));")
          if [ "$per_shard" = false ]; then
            npm --prefix candidate/apps/clued-cloud run build
          fi
      - name: Run the selected application shard
        if: steps.select.outputs.run_clued_cloud == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLUED_UNDER_TEST: "1"
        run: node trusted/scripts/ci/ci-required-selection.mjs --run-selected clued-cloud-tests --root candidate --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  clued-cloud-tests:
    name: hosted-clued-cloud-tests
    needs: clued-cloud-tests-shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every application test shard succeeded
        env:
          RESULT: ${{ needs.clued-cloud-tests-shard.result }}
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/clued-pycache
          WRANGLER_LOG_PATH: ${{ runner.temp }}/clued-wrangler-logs
        run: |
          echo "hosted-clued-cloud-tests-shard-*: $RESULT"
          test "$RESULT" = success

  ci-suites-shard:
    # In shards (task 3435f8bf 件甲, PLAN-ci-p90-next-20261125 §3.1, the shape of FABLE-ci-duration-target-20261124 §2.5):
    # each shard runs the i-th of n parts of the same --run-selected plan (ci-required-selection.mjs --shard, from the
    # trusted base). The number of shards is written in the matrix list only. A shard's check name is
    # hosted-ci-suites-shard-<n>, which no ruleset names: the required hosted-ci-suites is the summary job below.
    name: ${{ format('hosted-ci-suites-shard-{0}', matrix.shard) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          path: candidate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Resolve push baseline before loading trusted commands
        id: train-base
        working-directory: candidate
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/clued-pycache
          WRANGLER_LOG_PATH: ${{ runner.temp }}/clued-wrangler-logs
        shell: bash
        run: |
          set -euo pipefail
          # CI_BASE_SHA and the staging trusted ref, for every event, from the one rule in scripts/ci/ci-base.mjs read from main
          # (the candidate copy only while main has none: the change that adds it). Later steps read CI_BASE_SHA from GITHUB_ENV.
          node --input-type=module -e "
            const { execFileSync } = await import('node:child_process');
            const git = (...args) => execFileSync('git', args, { encoding: 'utf8' });
            const onMain = git('ls-tree', '--name-only', 'origin/main', 'scripts/ci/ci-base.mjs').trim() !== '';
            if (!onMain) console.log('::warning title=CI base::main has no scripts/ci/ci-base.mjs yet; the candidate copy resolves the base');
            const source = onMain ? git('show', 'origin/main:scripts/ci/ci-base.mjs') : (await import('node:fs')).readFileSync('scripts/ci/ci-base.mjs', 'utf8');
            const { writeCiBase } = await import('data:text/javascript;base64,' + Buffer.from(source).toString('base64'));
            process.exitCode = await writeCiBase();"
      - name: Check out the trusted base (selection and commands)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ steps.train-base.outputs.sha || github.event.pull_request.base.sha || github.sha }}
          path: trusted
      - name: Configure job temporary storage
        uses: ./trusted/.github/actions/ci-temporary-storage
      - *prepare-linux-git
      - name: Select suites
        id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node trusted/scripts/ci/ci-required-selection.mjs --check ci-suites
      - name: Install the application dependencies the selected suites need
        env:
          APP_DEPS: ${{ steps.select.outputs.app_deps }}
        run: |
          apps=$(node -e 'for (const a of JSON.parse(process.env.APP_DEPS || "[]")) console.log(a)')
          if [ -z "$apps" ]; then
            echo "No selected suite needs application dependencies; nothing installed."
            exit 0
          fi
          for app in $apps; do
            node trusted/scripts/ci/ci-deps.mjs install "candidate/$app"
          done
          echo "CLUED_CI_APP_DEPS=1" >> "$GITHUB_ENV"
      - name: Run the selected suites
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
          CLUED_UNDER_TEST: "1"
        run: node trusted/scripts/ci/ci-required-selection.mjs --run-selected ci-suites --root candidate --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  # The required check hosted-ci-suites: green only when every shard succeeded, judged as hosted-ci-suites-windows is.
  ci-suites:
    name: hosted-ci-suites
    needs: ci-suites-shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every Linux suite shard succeeded
        env:
          RESULT: ${{ needs.ci-suites-shard.result }}
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/clued-pycache
          WRANGLER_LOG_PATH: ${{ runner.temp }}/clued-wrangler-logs
        run: |
          echo "hosted-ci-suites-shard-*: $RESULT"
          test "$RESULT" = success

  migration-verify-shard:
    # In shards (task 3435f8bf 件甲, PLAN-ci-p90-next-20261125 §3.1, the shape of FABLE-ci-duration-target-20261124 §2.5):
    # each shard runs the i-th of n parts of the same --run-selected plan (ci-required-selection.mjs --shard, from the
    # trusted base). The number of shards is written in the matrix list only. A shard's check name is
    # hosted-migration-verify-shard-<n>, which no ruleset names: the required hosted-migration-verify is the summary job below.
    name: ${{ format('hosted-migration-verify-shard-{0}', matrix.shard) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          path: candidate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Resolve push baseline before loading trusted commands
        id: train-base
        working-directory: candidate
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/clued-pycache
          WRANGLER_LOG_PATH: ${{ runner.temp }}/clued-wrangler-logs
        shell: bash
        run: |
          set -euo pipefail
          # CI_BASE_SHA and the staging trusted ref, for every event, from the one rule in scripts/ci/ci-base.mjs read from main
          # (the candidate copy only while main has none: the change that adds it). Later steps read CI_BASE_SHA from GITHUB_ENV.
          node --input-type=module -e "
            const { execFileSync } = await import('node:child_process');
            const git = (...args) => execFileSync('git', args, { encoding: 'utf8' });
            const onMain = git('ls-tree', '--name-only', 'origin/main', 'scripts/ci/ci-base.mjs').trim() !== '';
            if (!onMain) console.log('::warning title=CI base::main has no scripts/ci/ci-base.mjs yet; the candidate copy resolves the base');
            const source = onMain ? git('show', 'origin/main:scripts/ci/ci-base.mjs') : (await import('node:fs')).readFileSync('scripts/ci/ci-base.mjs', 'utf8');
            const { writeCiBase } = await import('data:text/javascript;base64,' + Buffer.from(source).toString('base64'));
            process.exitCode = await writeCiBase();"
      - name: Check out the trusted base (selection and commands)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ steps.train-base.outputs.sha || github.event.pull_request.base.sha || github.sha }}
          path: trusted
      - name: Configure job temporary storage
        uses: ./trusted/.github/actions/ci-temporary-storage
      - *prepare-linux-git
      - name: Select suites
        id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node trusted/scripts/ci/ci-required-selection.mjs --check migration-verify
      - name: Install the application dependencies
        if: steps.select.outputs.run_production_schema == 'true'
        run: |
          node trusted/scripts/ci/ci-deps.mjs install candidate/apps/clued-cloud
          cd candidate/apps/clued-cloud && timeout --signal=TERM --kill-after=15s 2m npm rebuild @embedded-postgres/linux-x64
      - name: Verify migrations on the production schema
        if: steps.select.outputs.run_production_schema == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLUED_UNDER_TEST: "1"
        run: node trusted/scripts/ci/ci-required-selection.mjs --run-selected migration-verify --root candidate --shard ${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Not affected
        if: steps.select.outputs.run_production_schema != 'true'
        run: echo "No migration, ledger, snapshot or drift-check file changed; nothing to verify." >> "$GITHUB_STEP_SUMMARY"

  # The required check hosted-migration-verify: green only when every shard succeeded, judged as hosted-ci-suites-windows is.
  migration-verify:
    name: hosted-migration-verify
    needs: migration-verify-shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every migration verification shard succeeded
        env:
          RESULT: ${{ needs.migration-verify-shard.result }}
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/clued-pycache
          WRANGLER_LOG_PATH: ${{ runner.temp }}/clued-wrangler-logs
        run: |
          echo "hosted-migration-verify-shard-*: $RESULT"
          test "$RESULT" = success

  ci-suites-windows-shard:
    # The Windows suites in shards (task 3435f8bf block 4, PLAN-hosted-windows-speed-20261123 §3.2): one 4-core machine ran
    # them in 23-26 minutes; each shard runs the i-th of n parts of the same --run-selected plan (ci-required-selection.mjs
    # --shard, run from the trusted base like the rest). The number of shards is written in the matrix list only. A shard's
    # check name is hosted-ci-suites-windows-shard-<n>, which no ruleset names: the required hosted-ci-suites-windows is the
    # summary job below.
    name: ${{ format('hosted-ci-suites-windows-shard-{0}', matrix.shard) }}
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          path: candidate
      # The self-hosted Windows runner brings its own Node 24 and Python 3.12 (cap-node24, cap-python312).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Resolve push baseline before loading trusted commands
        id: train-base
        working-directory: candidate
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/clued-pycache
          WRANGLER_LOG_PATH: ${{ runner.temp }}/clued-wrangler-logs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # CI_BASE_SHA and the staging trusted ref, for every event, from the one rule in scripts/ci/ci-base.mjs read from main
          # (the candidate copy only while main has none: the change that adds it). Later steps read CI_BASE_SHA from GITHUB_ENV.
          node --input-type=module -e "
            const { execFileSync } = await import('node:child_process');
            const git = (...args) => execFileSync('git', args, { encoding: 'utf8' });
            const onMain = git('ls-tree', '--name-only', 'origin/main', 'scripts/ci/ci-base.mjs').trim() !== '';
            if (!onMain) console.log('::warning title=CI base::main has no scripts/ci/ci-base.mjs yet; the candidate copy resolves the base');
            const source = onMain ? git('show', 'origin/main:scripts/ci/ci-base.mjs') : (await import('node:fs')).readFileSync('scripts/ci/ci-base.mjs', 'utf8');
            const { writeCiBase } = await import('data:text/javascript;base64,' + Buffer.from(source).toString('base64'));
            process.exitCode = await writeCiBase();"
          exit $LASTEXITCODE
      - name: Check out the trusted base (selection and commands)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ steps.train-base.outputs.sha || github.event.pull_request.base.sha || github.sha }}
          path: trusted
      - name: Configure job temporary storage
        uses: ./trusted/.github/actions/ci-temporary-storage
      # Cache only the vendor archive, and verify the declared digest on hits and misses alike.
      - name: Cache declared MinGit archive
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/clued-ci-mingit.zip
          key: clued-ci-mingit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('trusted/config/ci-toolchain.json') || hashFiles('candidate/config/ci-toolchain.json') }}
      - name: Prepare declared Git
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $policyPath = 'trusted/config/ci-toolchain.json'
            if (!(Test-Path -LiteralPath $policyPath)) { $policyPath = 'candidate/config/ci-toolchain.json' }
            $policy = (Get-Content -Raw -Encoding UTF8 -LiteralPath $policyPath | ConvertFrom-Json).windows
            if ($policy.git -cnotmatch '^\d+\.\d+\.\d+$' -or $policy.mingitRevision -notmatch '^[1-9]\d*$' -or
                $policy.mingitSha256 -notmatch '^[0-9a-f]{64}$') {
              throw 'config/ci-toolchain.json 的 Git 或 MinGit 声明无效'
            }
            $version = $policy.git
            $release = "$version.windows.$($policy.mingitRevision)"
            $archive = Join-Path $env:RUNNER_TEMP 'clued-ci-mingit.zip'
            if (!(Test-Path -LiteralPath $archive -PathType Leaf)) {
              $url = "https://github.com/git-for-windows/git/releases/download/v$release/MinGit-$version.$($policy.mingitRevision)-64-bit.zip"
              & curl.exe --fail --location --silent --show-error --retry 2 --output $archive $url
              if ($LASTEXITCODE -ne 0) { throw "MinGit 下载退出 $LASTEXITCODE" }
            }
            if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $policy.mingitSha256) {
              throw 'MinGit SHA-256 与声明不符'
            }
            $install = Join-Path $env:RUNNER_TEMP 'clued-ci-mingit'
            Expand-Archive -LiteralPath $archive -DestinationPath $install
            $bin = Join-Path $install 'cmd'
            $actual = & (Join-Path $bin 'git.exe') --version
            if ($LASTEXITCODE -ne 0 -or $actual -cne "git version $release") {
              throw "声明 git version $release，安装得到 $actual"
            }
            Write-Output $actual
            Add-Content -LiteralPath $env:GITHUB_PATH -Encoding utf8 -Value $bin
          } catch {
            throw "工具准备失败：$($_.Exception.Message)"
          }
      # The image warms Windows PowerShell's module analysis cache only at the machine-level PSModuleAnalysisCachePath. A
      # PowerShell a test starts with its own minimal environment (the service's three variables) does not get that variable
      # and uses the default cache under LocalApplicationData, which is cold: 45-56 s per process re-analysing the image's
      # modules (task 3435f8bf block 1; whether the job is fast is judged by hosted-ci-suites-windows-duration). Copy the
      # warmed file there. Auxiliary: when the file is missing or the copy fails it says so and does nothing
      # (hosted-required.test.mjs).
      - name: Warm the default PowerShell module analysis cache
        shell: powershell
        continue-on-error: true
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $source = [Environment]::GetEnvironmentVariable('PSModuleAnalysisCachePath', 'Machine')
          $target = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'Microsoft\Windows\PowerShell\ModuleAnalysisCache'
          try {
            if (-not $source -or -not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "no warmed cache at the machine-level PSModuleAnalysisCachePath ($source)" }
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $target) | Out-Null
            Copy-Item -LiteralPath $source -Destination $target -Force
            Write-Output "warmed $target from $source ($((Get-Item -LiteralPath $target).Length) bytes)"
          } catch { Write-Output "::notice title=PowerShell analysis cache not warmed::$($_.Exception.Message)" }
          exit 0
      - name: Select and run the suites declared for Windows
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
          CLUED_UNDER_TEST: "1"
          # This runner's job process is an elevated administrator: the tests marked [needs:non-elevated] run on the
          # nodes' ci-suites-windows only (ci-required-selection.mjs HOST_CAPABILITIES; only this workflow may set it).
          CLUED_CI_HOST_LACKS: non-elevated
        run: |
          $ErrorActionPreference = 'Stop'
          & node trusted/scripts/ci/ci-required-selection.mjs --run-selected ci-suites --root candidate --shard ${{ matrix.shard }}/${{ strategy.job-total }}
          exit $LASTEXITCODE

  # The required check hosted-ci-suites-windows: green only when every shard succeeded. A failed, cancelled or skipped
  # shard makes it red (a skipped required check would count as passed, hence always()). One judgement and nothing else:
  # no artifact, no API, no numbers summed across shards (FABLE-hosted-b3-L2-ruling-20261124; hosted-required.test.mjs).
  ci-suites-windows:
    name: hosted-ci-suites-windows
    needs: ci-suites-windows-shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every Windows suite shard succeeded
        env:
          RESULT: ${{ needs.ci-suites-windows-shard.result }}
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/clued-pycache
          WRANGLER_LOG_PATH: ${{ runner.temp }}/clued-wrangler-logs
        run: |
          echo "hosted-ci-suites-windows-shard-*: $RESULT"
          test "$RESULT" = success

  # Not a required check (no ruleset names it, and it is not one of shadow-compare.mjs's seven pairs): red when the shards
  # took more than 10 minutes from the first start to the last end, with each shard's time in the step summary
  # (scripts/ci/hosted-windows-duration.mjs, V4). It shows, it never blocks. It runs the candidate's script: nothing
  # depends on its verdict, so a pull request may change it like any test.
  ci-suites-windows-duration:
    name: hosted-ci-suites-windows-duration
    needs: ci-suites-windows-shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: candidate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Configure job temporary storage
        uses: ./candidate/.github/actions/ci-temporary-storage
      - name: Measure the Windows suite shards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node candidate/scripts/ci/hosted-windows-duration.mjs

  # The scans: the executor steps of gitleaks.yml, trivy.yml and contract-placement.yml from "Configure job temporary
  # storage" on, byte for byte, without the Native permission and relay identity steps (see the header).
  gitleaks:
    name: hosted-gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    # Not gitleaks.yml's complete-history scan (the comment above is about trivy and contract-placement here): the R1
    # changed-range steps of clued-required-tests.yml's gitleaks job, byte for byte (hosted-required.test.mjs). No step
    # reads the live main or compares it with the event's base.sha, so a reopened or rerun pull request whose base.sha
    # main has moved past scans the same range (PLAN-hosted-stale-base-20261123).
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # The changed range and its merge parents.
          fetch-depth: 0
          path: candidate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Resolve push baseline before loading trusted commands
        id: train-base
        working-directory: candidate
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/clued-pycache
          WRANGLER_LOG_PATH: ${{ runner.temp }}/clued-wrangler-logs
        shell: bash
        run: |
          set -euo pipefail
          # CI_BASE_SHA and the staging trusted ref, for every event, from the one rule in scripts/ci/ci-base.mjs read from main
          # (the candidate copy only while main has none: the change that adds it). Later steps read CI_BASE_SHA from GITHUB_ENV.
          node --input-type=module -e "
            const { execFileSync } = await import('node:child_process');
            const git = (...args) => execFileSync('git', args, { encoding: 'utf8' });
            const onMain = git('ls-tree', '--name-only', 'origin/main', 'scripts/ci/ci-base.mjs').trim() !== '';
            if (!onMain) console.log('::warning title=CI base::main has no scripts/ci/ci-base.mjs yet; the candidate copy resolves the base');
            const source = onMain ? git('show', 'origin/main:scripts/ci/ci-base.mjs') : (await import('node:fs')).readFileSync('scripts/ci/ci-base.mjs', 'utf8');
            const { writeCiBase } = await import('data:text/javascript;base64,' + Buffer.from(source).toString('base64'));
            process.exitCode = await writeCiBase();"
      - name: Check out the trusted base (scanner script and configuration)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ steps.train-base.outputs.sha || github.event.pull_request.base.sha || github.sha }}
          path: trusted
      - name: Configure job temporary storage
        uses: ./trusted/.github/actions/ci-temporary-storage
      # The change: a pull request's head against its base (the run's commit is GitHub's merge of the two), a push
      # against the baseline resolved above (main: the first parent; staging: the root T of its member chain), a
      # dispatch against its merge base with main.
      - name: Resolve the changed range
        id: range
        working-directory: candidate
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ steps.train-base.outputs.ci_base }}
        shell: bash
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              base=$PR_BASE head=$PR_HEAD
              test "$(git rev-parse --verify --quiet "$GITHUB_SHA^2")" = "$head" ;;
            push) base=$PUSH_BASE head=$GITHUB_SHA ;;
            workflow_dispatch) head=$GITHUB_SHA base=$(git merge-base origin/main "$GITHUB_SHA") ;;
            *) echo "::error::no changed range for event $EVENT_NAME"; exit 1 ;;
          esac
          for sha in "$base" "$head"; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ && ! "$sha" =~ ^0+$ ]] || { echo "::error::not a commit id: '$sha'"; exit 1; }
          done
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
      - name: Copy the changed history into a fresh Git directory
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 GIT_NO_REPLACE_OBJECTS=1
          scan="$RUNNER_TEMP/clued-gitleaks"; repo="$scan/repo"
          mkdir "$scan" "$repo"
          git -C candidate update-ref refs/clued-scan/base "$BASE"
          git -C candidate update-ref refs/clued-scan/head "$HEAD"
          git init --quiet --template= "$repo"
          git -C "$repo" -c protocol.file.allow=always fetch --quiet --no-tags --no-recurse-submodules \
            "$GITHUB_WORKSPACE/candidate" refs/clued-scan/base:refs/heads/base refs/clued-scan/head:refs/heads/head
          test "$(git -C "$repo" rev-parse refs/heads/head)" = "$HEAD"
          install -m 0444 trusted/.gitleaks.toml "$repo/.gitleaks.toml"
          printf '[safe]\n\tdirectory = /repo\n' > "$scan/git-safe.config"
      - name: Scan the changed range with Gitleaks 8.30.1
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          scan="$RUNNER_TEMP/clued-gitleaks"
          image=ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          docker image inspect "$image" > /dev/null 2>&1 || docker pull --quiet "$image" > /dev/null
          bash trusted/scripts/ci/gitleaks-range.sh "$scan/repo" "$BASE" "$HEAD" -- \
            docker run --rm --pull=never --network=none --ipc=private --cgroupns=private --user="$(id -u):$(id -g)" --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges:true --pids-limit=128 --cpus=2 --memory=2147483648 \
            --memory-swap=2147483648 --ulimit=nofile=1024:1024 --env=HOME=/scratch --env=TMPDIR=/scratch \
            --tmpfs=/scratch:rw,nosuid,nodev,noexec,size=536870912,mode=0700,uid="$(id -u)",gid="$(id -g)" \
            --mount "type=bind,src=$scan/repo,dst=/repo,bind-propagation=rprivate" \
            --mount "type=bind,src=$scan/git-safe.config,dst=/etc/gitconfig,readonly,bind-propagation=rprivate" \
            --workdir=/repo --entrypoint /usr/bin/gitleaks "$image" \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1

  trivy:
    name: hosted-trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - name: Refuse symlinks, submodules and other non-regular tree entries
        run: |
          set -eu
          git ls-tree -r -z --full-tree HEAD > "$RUNNER_TEMP/clued-trivy-tree"
          if tr '\0' '\n' < "$RUNNER_TEMP/clued-trivy-tree" | grep -Ev '^(100644|100755) blob [0-9a-f]{40}[[:space:]]' | grep -q .; then
            echo "::error title=hosted-trivy::the tree has a symlink, submodule or other non-regular entry"
            exit 1
          fi
          git ls-files -z > "$RUNNER_TEMP/clued-trivy-paths"
          if grep -qzE '[\\:[:cntrl:]]|.{4096,}' "$RUNNER_TEMP/clued-trivy-paths"; then
            echo "::error title=hosted-trivy::a path has a backslash, colon or control character, or is too long"
            exit 1
          fi
          if grep -qziE '\.(jar|war|ear|par)$' "$RUNNER_TEMP/clued-trivy-paths"; then
            echo "::error title=hosted-trivy::a Java archive needs the Java DB the local role does not prepare"
            exit 1
          fi
          test "$(tr -cd '\0' < "$RUNNER_TEMP/clued-trivy-paths" | wc -c)" -le 100000
      - name: Snapshot the tree for the scanners
        run: |
          set -eu
          snap="$RUNNER_TEMP/clued-trivy-snapshot"
          mkdir "$snap"
          git ls-files -z | tar --null --no-recursion -T - -cf - | tar -xf - -C "$snap"
          chmod -R a+rX "$snap"
      - name: Prepare the vulnerability DB and the pinned checks bundle
        timeout-minutes: 10
        env:
          TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.74.0@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9
          CHECKS_DIGEST: sha256:b0e12d009b01dcc8ca2ebbc199b9caf3922491978d21c17b61c1d7f6dc75220b
        run: |
          set -eu
          docker pull --quiet "$TRIVY_IMAGE" > /dev/null
          cache_run() {
            docker run --rm --pull=never --network=host --ipc=private --cgroupns=private --user=65532:65532 --read-only \
              --cap-drop=ALL --security-opt=no-new-privileges:true --pids-limit=128 --cpus=2 --memory=2147483648 \
              --memory-swap=2147483648 --ulimit=nofile=1024:1024 --env=NODE_OPTIONS= --env=NODE_PATH= --env=HOME=/scratch \
              --env=TMPDIR=/scratch --env=GODEBUG=http2client=0 \
              --tmpfs=/scratch:rw,nosuid,nodev,noexec,size=536870912,mode=0700,uid=65532,gid=65532 "$@"
          }
          read_back() {
            docker run --rm --pull=never --network=none --user=65532:65532 --read-only --cap-drop=ALL \
              --security-opt=no-new-privileges:true --mount "type=bind,src=$1,dst=/cache,readonly" --entrypoint "$2" "$TRIVY_IMAGE" "$3"
          }
          db=""
          n=0
          for repository in ghcr.io/aquasecurity/trivy-db:2 mirror.gcr.io/aquasec/trivy-db:2; do
            for attempt in 1 2; do
              n=$((n + 1)); stage="$RUNNER_TEMP/clued-trivy-db-$n"
              mkdir -m 0777 "$stage"
              if cache_run --mount "type=bind,src=$stage,dst=/cache,bind-propagation=rprivate" --workdir=/scratch \
                --entrypoint /usr/local/bin/trivy "$TRIVY_IMAGE" \
                fs --download-db-only --timeout 5m --cache-dir /cache --db-repository "$repository"; then
                db="$stage"; break 2
              fi
            done
          done
          test -n "$db"
          read_back "$db" /bin/cat /cache/db/metadata.json | python3 -I -B -c 'import json,sys,time; m=json.load(sys.stdin); now=time.strftime("%Y-%m-%dT%H:%M:%S", time.gmtime()); u, n = m["UpdatedAt"], m["NextUpdate"]; sys.exit(0 if m.get("Version") == 2 and u.endswith("Z") and n.endswith("Z") and u[:19] <= now < n[:19] else 1)'
          checks="$RUNNER_TEMP/clued-trivy-checks"; empty="$RUNNER_TEMP/clued-trivy-empty"
          mkdir -m 0777 "$checks"
          mkdir "$empty"
          cache_run --mount "type=bind,src=$checks,dst=/cache,bind-propagation=rprivate" \
            --mount "type=bind,src=$empty,dst=/empty,readonly,bind-propagation=rprivate" --workdir=/scratch \
            --entrypoint /usr/local/bin/trivy "$TRIVY_IMAGE" \
            fs --cache-dir /cache --checks-bundle-repository "ghcr.io/aquasecurity/trivy-checks@$CHECKS_DIGEST" \
            --scanners misconfig --severity HIGH,CRITICAL --exit-code 1 /empty
          read_back "$checks" /bin/cat /cache/policy/metadata.json | python3 -I -B -c 'import json,sys; m=json.load(sys.stdin); sys.exit(0 if m.get("Digest") == sys.argv[1] and m.get("MajorVersion") == 2 and m.get("CustomBuild") is not True else 1)' "$CHECKS_DIGEST"
          read_back "$checks" /bin/ls -R /cache/policy/content | grep -q '\.rego$'
          echo "CLUED_TRIVY_DB=$db/db" >> "$GITHUB_ENV"
          echo "CLUED_TRIVY_POLICY=$checks/policy" >> "$GITHUB_ENV"
      - name: Vulnerabilities (HIGH/CRITICAL)
        timeout-minutes: 5
        run: |
          set -eu
          docker run --rm --pull=never --network=none --ipc=private --cgroupns=private --user=65532:65532 --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges:true --pids-limit=128 --cpus=2 --memory=2147483648 \
            --memory-swap=2147483648 --ulimit=nofile=1024:1024 --env=NODE_OPTIONS= --env=NODE_PATH= --env=HOME=/scratch \
            --env=TMPDIR=/scratch --tmpfs=/scratch:rw,nosuid,nodev,noexec,size=536870912,mode=0700,uid=65532,gid=65532 \
            --mount "type=bind,src=$RUNNER_TEMP/clued-trivy-snapshot,dst=/repo,readonly,bind-propagation=rprivate" \
            --mount "type=bind,src=$CLUED_TRIVY_DB,dst=/scratch/db,readonly,bind-propagation=rprivate" \
            --mount "type=bind,src=$CLUED_TRIVY_POLICY,dst=/scratch/policy,readonly,bind-propagation=rprivate" \
            --workdir=/scratch --entrypoint /usr/local/bin/trivy \
            ghcr.io/aquasecurity/trivy:0.74.0@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9 \
            fs --skip-db-update --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --cache-dir /scratch --skip-check-update --skip-version-check --disable-telemetry /repo
      - name: Secrets
        timeout-minutes: 5
        run: |
          set -eu
          docker run --rm --pull=never --network=none --ipc=private --cgroupns=private --user=65532:65532 --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges:true --pids-limit=128 --cpus=2 --memory=2147483648 \
            --memory-swap=2147483648 --ulimit=nofile=1024:1024 --env=NODE_OPTIONS= --env=NODE_PATH= --env=HOME=/scratch \
            --env=TMPDIR=/scratch --tmpfs=/scratch:rw,nosuid,nodev,noexec,size=536870912,mode=0700,uid=65532,gid=65532 \
            --mount "type=bind,src=$RUNNER_TEMP/clued-trivy-snapshot,dst=/repo,readonly,bind-propagation=rprivate" \
            --mount "type=bind,src=$CLUED_TRIVY_DB,dst=/scratch/db,readonly,bind-propagation=rprivate" \
            --mount "type=bind,src=$CLUED_TRIVY_POLICY,dst=/scratch/policy,readonly,bind-propagation=rprivate" \
            --workdir=/scratch --entrypoint /usr/local/bin/trivy \
            ghcr.io/aquasecurity/trivy:0.74.0@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9 \
            fs --scanners secret --exit-code 1 \
            --cache-dir /scratch --skip-check-update --skip-version-check --disable-telemetry /repo
      - name: Misconfiguration (HIGH/CRITICAL)
        timeout-minutes: 5
        run: |
          set -eu
          docker run --rm --pull=never --network=none --ipc=private --cgroupns=private --user=65532:65532 --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges:true --pids-limit=128 --cpus=2 --memory=2147483648 \
            --memory-swap=2147483648 --ulimit=nofile=1024:1024 --env=NODE_OPTIONS= --env=NODE_PATH= --env=HOME=/scratch \
            --env=TMPDIR=/scratch --tmpfs=/scratch:rw,nosuid,nodev,noexec,size=536870912,mode=0700,uid=65532,gid=65532 \
            --mount "type=bind,src=$RUNNER_TEMP/clued-trivy-snapshot,dst=/repo,readonly,bind-propagation=rprivate" \
            --mount "type=bind,src=$CLUED_TRIVY_DB,dst=/scratch/db,readonly,bind-propagation=rprivate" \
            --mount "type=bind,src=$CLUED_TRIVY_POLICY,dst=/scratch/policy,readonly,bind-propagation=rprivate" \
            --workdir=/scratch --entrypoint /usr/local/bin/trivy \
            ghcr.io/aquasecurity/trivy:0.74.0@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9 \
            fs --checks-bundle-repository ghcr.io/aquasecurity/trivy-checks:2 --scanners misconfig --severity HIGH,CRITICAL --exit-code 1 \
            --cache-dir /scratch --skip-check-update --skip-version-check --disable-telemetry /repo

  contract-placement:
    name: hosted-contract-placement
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      # staging is force-moved by the train: the push event's previous commit may be absent from the checkout, so the push baseline
      # comes from the same stagingBaseFromCheckout the test jobs use.
      - name: Resolve push baseline
        id: train-base
        shell: bash
        run: |
          set -euo pipefail
          # CI_BASE_SHA and the staging trusted ref, for every event, from the one rule in scripts/ci/ci-base.mjs read from main
          # (the candidate copy only while main has none: the change that adds it). Later steps read CI_BASE_SHA from GITHUB_ENV.
          node --input-type=module -e "
            const { execFileSync } = await import('node:child_process');
            const git = (...args) => execFileSync('git', args, { encoding: 'utf8' });
            const onMain = git('ls-tree', '--name-only', 'origin/main', 'scripts/ci/ci-base.mjs').trim() !== '';
            if (!onMain) console.log('::warning title=CI base::main has no scripts/ci/ci-base.mjs yet; the candidate copy resolves the base');
            const source = onMain ? git('show', 'origin/main:scripts/ci/ci-base.mjs') : (await import('node:fs')).readFileSync('scripts/ci/ci-base.mjs', 'utf8');
            const { writeCiBase } = await import('data:text/javascript;base64,' + Buffer.from(source).toString('base64'));
            process.exitCode = await writeCiBase();"
      - name: Placement and renderer fixtures
        run: |
          python3 -I -B -m unittest discover -s scripts/ci -p test_check_contract_placement.py -v
          node --test apps/clued-cloud/tests/agent-contract-bootstrap.test.mjs
      # contract-placement.yml installs esbuild alone with npm install; here the one install entry (ci-deps.mjs) installs
      # the application's lockfile, which pins the same esbuild 0.28.1, and the bundle is built with it.
      - name: Build actual public bootstrap
        env:
          CANDIDATE: ${{ github.sha }}
        run: |
          node scripts/ci/ci-deps.mjs install apps/clued-cloud
          node apps/clued-cloud/node_modules/esbuild/bin/esbuild apps/clued-cloud/worker/continuity.ts \
            --bundle --platform=node --format=esm --external:js-tiktoken/* \
            --define:__CLUED_BUILD_SHA__="\"$CANDIDATE\"" --outfile="$RUNNER_TEMP/contract-bootstrap.mjs"
      - name: Render all actual and synthetic contract parts
        run: node apps/clued-cloud/scripts/render-agent-contract-budget.mjs --worker-module "$RUNNER_TEMP/contract-bootstrap.mjs" --output "$RUNNER_TEMP/contract-responses.json"
      - name: Enforce placement and one-time production gate
        env:
          CANDIDATE: ${{ github.sha }}
        run: python3 -I -B scripts/ci/check_contract_placement.py --base "$CI_BASE_SHA" --head "$CANDIDATE" --minimum-service-version 0.4.5 --rendered-responses "$RUNNER_TEMP/contract-responses.json"
