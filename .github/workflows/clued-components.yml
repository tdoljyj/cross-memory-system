name: clued-components

# Clued component versions (config/clued-components.json, Task 6dfd7560):
# every component's files match its recorded digest and version marker, the
# Worker's generated module matches the manifest, and a component that changed
# against the base carries a higher version, and that VERSION and its git tag
# agree (scripts/ci/clued_release_tags.py). Also runs the unit tests of the
# manifest tool and of the SessionStart / resume version-check hook.
# No paths filter: a component can live anywhere in the repository.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Work Claim Admission v0.1 §4.6 L0b: the heavy jobs below run only when
  # Clued admits this pull request. The gate does not call Clued and gets no
  # Clued token (this job runs PR code): it waits for the trusted
  # pull_request_target run of clued-work-admission.yml on this head and reads
  # its result. Until the Owner sets the repository variable
  # CLUED_WORK_ADMISSION_ENFORCE=true the gate is advisory and admits; non-PR
  # events are admitted. Hosted runner, no install.
  admission-gate:
    name: admission-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      admitted: ${{ steps.gate.outputs.admitted }}
      enforced: ${{ steps.gate.outputs.enforced }}
      verdict: ${{ steps.gate.outputs.verdict }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
      - id: gate
        env:
          CLUED_WORK_ADMISSION_ENFORCE: ${{ vars.CLUED_WORK_ADMISSION_ENFORCE }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/clued-work-admission.mjs --mode gate

  trusted-self-hosted:
    name: >-
      ${{ (((github.event_name == 'push' && github.actor == github.repository_owner) ||
             (github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              github.actor == github.repository_owner)))
          && 'clued-components' || 'clued-components-self-hosted-skipped' }}
    needs: admission-gate
    if: >-
      needs.admission-gate.outputs.admitted == 'true' &&
      ((github.event_name == 'push' &&
       github.actor == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == github.repository_owner))
    runs-on: [self-hosted, Linux, X64, clued, pool-general, trust-internal]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check component versions against the base
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: python3 scripts/clued_components.py check --base "$BASE"
      - run: python3 -m unittest tests.test_clued_components tests.test_clued_version_check -v
      - name: VERSION and its git tag agree
        run: python3 scripts/ci/clued_release_tags.py check
      - run: python3 -m unittest scripts/ci/test_clued_release_tags.py -v

  untrusted-hosted:
    name: >-
      ${{ (((github.event_name == 'push' && github.actor != github.repository_owner) ||
             (github.event_name == 'pull_request' &&
              (github.event.pull_request.head.repo.full_name != github.repository ||
               github.actor != github.repository_owner))))
          && 'clued-components' || 'clued-components-hosted-skipped' }}
    needs: admission-gate
    if: >-
      needs.admission-gate.outputs.admitted == 'true' &&
      ((github.event_name == 'push' &&
       github.actor != github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       (github.event.pull_request.head.repo.full_name != github.repository ||
        github.actor != github.repository_owner)))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check component versions against the base
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: python3 scripts/clued_components.py check --base "$BASE"
      - run: python3 -m unittest tests.test_clued_components tests.test_clued_version_check -v
      - name: VERSION and its git tag agree
        run: python3 scripts/ci/clued_release_tags.py check
      - run: python3 -m unittest scripts/ci/test_clued_release_tags.py -v
