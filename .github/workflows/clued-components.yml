name: clued-components

# Clued component versions (config/clued-components.json, Task 6dfd7560):
# every component's files match its recorded digest and version marker, the
# Worker's generated module matches the manifest, and a component that changed
# against the base carries a higher version, and that VERSION and its git tag
# agree (scripts/ci/clued_release_tags.py). Also runs the unit tests of the
# manifest tool and of the SessionStart / resume version-check hook, and this
# head's copy of the admission self-tests.
# No paths filter: a component can live anywhere in the repository.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Work Claim Admission v0.1 §4.6 L0b: the heavy jobs below run only when
  # Clued admits this pull request. The gate does not call Clued and gets no
  # Clued token (this job runs PR code): it waits for the trusted
  # pull_request_target run of clued-work-admission.yml on this head and reads
  # its result, always enforced (Merge Admission step 6 retired the advisory
  # switch CLUED_WORK_ADMISSION_ENFORCE); non-PR events are admitted.
  # Self-hosted Linux pool, pinned Node (Decision f86179b3).
  admission-gate:
    name: admission-gate
    runs-on: [self-hosted, Linux, X64, clued, pool-general, trust-internal]
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      admitted: ${{ steps.gate.outputs.admitted }}
      enforced: ${{ steps.gate.outputs.enforced }}
      verdict: ${{ steps.gate.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/clued-work-admission.mjs --mode gate

  trusted-self-hosted:
    name: >-
      ${{ (((github.event_name == 'push' && github.actor == github.repository_owner) ||
             (github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              github.actor == github.repository_owner)))
          && 'clued-components' || 'clued-components-self-hosted-skipped' }}
    needs: admission-gate
    if: >-
      needs.admission-gate.outputs.admitted == 'true' &&
      ((github.event_name == 'push' &&
       github.actor == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == github.repository_owner))
    runs-on: [self-hosted, Linux, X64, clued, pool-general, trust-internal]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - name: Check component versions against the base
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: python3 scripts/clued_components.py check --base "$BASE"
      - run: python3 -m unittest tests.test_clued_components tests.test_clued_version_check -v
      - name: VERSION and its git tag agree
        run: python3 scripts/ci/clued_release_tags.py check
      - run: python3 -m unittest scripts/ci/test_clued_release_tags.py -v
      # The admission check runs main's copy of these self-tests; running the
      # pull request's copy here fails a change that would break them on main
      # before it merges (the self-test deadlock of #552 and #598).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - name: Admission self-tests on this head
        run: node --test scripts/ci/clued-work-admission.test.mjs scripts/ci/merge-admission-policy.test.mjs scripts/ci/merge-admission-policy-file.test.mjs scripts/ci/clued-release-grant.test.mjs scripts/runner/clued-runner-job-started.test.mjs scripts/ci/clued-merge-slot-ci.test.mjs

  untrusted-hosted:
    name: >-
      ${{ (((github.event_name == 'push' && github.actor != github.repository_owner) ||
             (github.event_name == 'pull_request' &&
              (github.event.pull_request.head.repo.full_name != github.repository ||
               github.actor != github.repository_owner))))
          && 'clued-components' || 'clued-components-hosted-skipped' }}
    needs: admission-gate
    if: >-
      needs.admission-gate.outputs.admitted == 'true' &&
      ((github.event_name == 'push' &&
       github.actor != github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       (github.event.pull_request.head.repo.full_name != github.repository ||
        github.actor != github.repository_owner)))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - name: Check component versions against the base
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: python3 scripts/clued_components.py check --base "$BASE"
      - run: python3 -m unittest tests.test_clued_components tests.test_clued_version_check -v
      - name: VERSION and its git tag agree
        run: python3 scripts/ci/clued_release_tags.py check
      - run: python3 -m unittest scripts/ci/test_clued_release_tags.py -v
      # The admission check runs main's copy of these self-tests; running the
      # pull request's copy here fails a change that would break them on main
      # before it merges (the self-test deadlock of #552 and #598).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - name: Admission self-tests on this head
        run: node --test scripts/ci/clued-work-admission.test.mjs scripts/ci/merge-admission-policy.test.mjs scripts/ci/merge-admission-policy-file.test.mjs scripts/ci/clued-release-grant.test.mjs scripts/runner/clued-runner-job-started.test.mjs scripts/ci/clued-merge-slot-ci.test.mjs
