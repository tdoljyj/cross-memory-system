name: Clued Storage executor window

# Sets the production Worker's CLUED_STORAGE_EXECUTOR_V1 gate. open keeps it on
# until a close run (Owner Decision 4a1f8617: the gate stays on and the Owner's
# storage page levels decide what agents may write); open_window opens it for
# at most five minutes and always sets it back to false; close sets it to false
# now and is the emergency stop. The database execution switch stays a separate
# gate; opening this one alone executes nothing. Each run must name the Clued
# Decision that authorizes it. No repository code is checked out or run.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: open sets the gate to true until a close run; open_window sets it to true, waits, then sets it to false; close sets it to false now
        type: choice
        options:
          - open_window
          - open
          - close
        default: open_window
      minutes:
        description: Minutes to keep the gate open (1-5); open_window only
        type: number
        default: 5
      decision_id:
        description: Clued Decision UUID that authorizes this run
        type: string
        required: true

permissions:
  contents: read

env:
  WORKER_NAME: clued-cloud
  SECRET_NAME: CLUED_STORAGE_EXECUTOR_V1
  WRANGLER: wrangler@4.125.0

jobs:
  open-window:
    if: >-
      inputs.mode == 'open_window' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    # Re-review 5, N1: the deploy token and attestation URL are secrets of the
    # clued-release environment (main only), never repository secrets.
    environment: clued-release
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: clued-storage-executor-window-open
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - name: Validate inputs and credentials
        env:
          MINUTES: ${{ inputs.minutes }}
          DECISION_ID: ${{ inputs.decision_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLUED_CLOUDFLARE_DEPLOY_TOKEN_V2 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLUED_CLOUDFLARE_ACCOUNT_ID }}
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/clued-pycache
          WRANGLER_LOG_PATH: ${{ runner.temp }}/clued-wrangler-logs
        run: |
          set -euo pipefail
          [[ "$MINUTES" =~ ^[1-5]$ ]] || { echo "minutes must be 1-5"; exit 1; }
          [[ "$DECISION_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "decision_id must be a lowercase UUID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "decision_id=$DECISION_ID minutes=$MINUTES"
      - name: Open gate
        working-directory: ${{ runner.temp }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLUED_CLOUDFLARE_DEPLOY_TOKEN_V2 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLUED_CLOUDFLARE_ACCOUNT_ID }}
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/clued-pycache
          WRANGLER_LOG_PATH: ${{ runner.temp }}/clued-wrangler-logs
        run: |
          set -euo pipefail
          printf 'true' | npx --yes "$WRANGLER" secret put "$SECRET_NAME" --name "$WORKER_NAME"
          echo "opened_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Hold window
        env:
          MINUTES: ${{ inputs.minutes }}
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/clued-pycache
          WRANGLER_LOG_PATH: ${{ runner.temp }}/clued-wrangler-logs
        run: sleep "$((MINUTES * 60))"
      - name: Close gate
        if: always()
        working-directory: ${{ runner.temp }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLUED_CLOUDFLARE_DEPLOY_TOKEN_V2 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLUED_CLOUDFLARE_ACCOUNT_ID }}
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/clued-pycache
          WRANGLER_LOG_PATH: ${{ runner.temp }}/clued-wrangler-logs
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if printf 'false' | npx --yes "$WRANGLER" secret put "$SECRET_NAME" --name "$WORKER_NAME"; then
              echo "closed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Failed to close $SECRET_NAME; set it to false manually"
          exit 1

  open:
    if: >-
      inputs.mode == 'open' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    # Re-review 5, N1: the deploy token and attestation URL are secrets of the
    # clued-release environment (main only), never repository secrets.
    environment: clued-release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: clued-storage-executor-window-open
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - name: Open gate until closed
        working-directory: ${{ runner.temp }}
        env:
          DECISION_ID: ${{ inputs.decision_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLUED_CLOUDFLARE_DEPLOY_TOKEN_V2 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLUED_CLOUDFLARE_ACCOUNT_ID }}
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/clued-pycache
          WRANGLER_LOG_PATH: ${{ runner.temp }}/clued-wrangler-logs
        run: |
          set -euo pipefail
          [[ "$DECISION_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "decision_id must be a lowercase UUID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          printf 'true' | npx --yes "$WRANGLER" secret put "$SECRET_NAME" --name "$WORKER_NAME"
          echo "opened_at=$(date -u +%Y-%m-%dT%H:%M:%SZ) decision_id=$DECISION_ID until=close"

  close:
    if: >-
      inputs.mode == 'close' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    # Re-review 5, N1: the deploy token and attestation URL are secrets of the
    # clued-release environment (main only), never repository secrets.
    environment: clued-release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: clued-storage-executor-window-close
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - name: Close gate
        working-directory: ${{ runner.temp }}
        env:
          DECISION_ID: ${{ inputs.decision_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLUED_CLOUDFLARE_DEPLOY_TOKEN_V2 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLUED_CLOUDFLARE_ACCOUNT_ID }}
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/clued-pycache
          WRANGLER_LOG_PATH: ${{ runner.temp }}/clued-wrangler-logs
        run: |
          set -euo pipefail
          [[ "$DECISION_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "decision_id must be a lowercase UUID"; exit 1; }
          printf 'false' | npx --yes "$WRANGLER" secret put "$SECRET_NAME" --name "$WORKER_NAME"
          echo "closed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ) decision_id=$DECISION_ID"
