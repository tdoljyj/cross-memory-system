name: model-program-m2-restricted-entry
on:
  pull_request:
    paths:
      - "kernel/host/m2-restricted-entry-*.mjs"
      - "kernel/runtime/runner-boundaries.mjs"
      - "tests/m2-restricted-entry-candidate.test.mjs"
      - "development/contracts/model-program/m2/RestrictedEntry.candidate.md"
      - ".github/workflows/model-program-m2-restricted-entry.yml"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  candidate-contract-trusted:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == github.repository_owner
    runs-on: [self-hosted, Linux, X64, clued, pool-general, trust-internal]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Empty-fixture contract only, no VM or model calls
        run: node --test tests/m2-restricted-entry-candidate.test.mjs
  candidate-contract-untrusted:
    if: >-
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.actor != github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Empty-fixture contract only, no VM or model calls
        run: node --test tests/m2-restricted-entry-candidate.test.mjs
