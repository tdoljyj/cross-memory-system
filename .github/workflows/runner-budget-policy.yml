name: runner-budget-policy

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/ci/validate_runner_budget_policy.py"
      - "scripts/ci/test_validate_runner_budget_policy.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/ci/validate_runner_budget_policy.py"
      - "scripts/ci/test_validate_runner_budget_policy.py"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trusted-self-hosted:
    timeout-minutes: 20
    name: >-
      ${{ (((github.event_name == 'push' && github.actor == github.repository_owner) ||
             (github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              github.actor == github.repository_owner)))
          && 'runner-budget-policy' || 'runner-budget-policy-self-hosted-skipped' }}
    if: >-
      (github.event_name == 'push' &&
       github.actor == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == github.repository_owner)
    runs-on: [self-hosted, Windows, X64, clued, pool-general, trust-internal, cap-python312]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - run: python scripts/ci/validate_runner_budget_policy.py
      - run: python scripts/ci/test_validate_runner_budget_policy.py

  untrusted-hosted:
    timeout-minutes: 20
    name: >-
      ${{ (((github.event_name == 'push' && github.actor != github.repository_owner) ||
             (github.event_name == 'pull_request' &&
              (github.event.pull_request.head.repo.full_name != github.repository ||
               github.actor != github.repository_owner))))
          && 'runner-budget-policy' || 'runner-budget-policy-hosted-skipped' }}
    if: >-
      (github.event_name == 'push' &&
       github.actor != github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       (github.event.pull_request.head.repo.full_name != github.repository ||
        github.actor != github.repository_owner))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - run: python scripts/ci/validate_runner_budget_policy.py
      - run: python scripts/ci/test_validate_runner_budget_policy.py
