name: runner-budget-policy

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/ci/validate_runner_budget_policy.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/ci/validate_runner_budget_policy.py"

permissions:
  contents: read

jobs:
  trusted-self-hosted:
    name: >-
      ${{ (((github.event_name == 'push' && github.actor == github.repository_owner) ||
             (github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              github.actor == github.repository_owner)))
          && 'runner-budget-policy' || 'runner-budget-policy-self-hosted-skipped' }}
    if: >-
      (github.event_name == 'push' &&
       github.actor == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == github.repository_owner)
    runs-on: [self-hosted, Windows, X64, clued, pool-general, trust-internal, cap-python312]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python scripts/ci/validate_runner_budget_policy.py

  untrusted-hosted:
    name: >-
      ${{ (((github.event_name == 'push' && github.actor != github.repository_owner) ||
             (github.event_name == 'pull_request' &&
              (github.event.pull_request.head.repo.full_name != github.repository ||
               github.actor != github.repository_owner))))
          && 'runner-budget-policy' || 'runner-budget-policy-hosted-skipped' }}
    if: >-
      (github.event_name == 'push' &&
       github.actor != github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       (github.event.pull_request.head.repo.full_name != github.repository ||
        github.actor != github.repository_owner))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python scripts/ci/validate_runner_budget_policy.py
