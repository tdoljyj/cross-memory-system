name: model-program-m0
on:
  pull_request:
    paths:
      - "development/contracts/model-program/**"
      - "scripts/model-program/**"
      - "tests/test_model_program_m0.py"
      - "tests/fixtures/model-program-m0/**"
      - ".github/workflows/model-program-m0.yml"
  push:
    branches: [main]
    paths:
      - "development/contracts/model-program/**"
      - "scripts/model-program/**"
      - "tests/test_model_program_m0.py"
      - "tests/fixtures/model-program-m0/**"
      - ".github/workflows/model-program-m0.yml"

permissions:
  contents: read

jobs:
  validate-trusted-self-hosted:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == github.repository_owner)
    runs-on:
      - self-hosted
      - Windows
      - X64
      - clued
      - pool-general
      - trust-internal
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Verify managed Python 3.12
        shell: powershell
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version; print(sys.executable)"
      - name: Create isolated Python 3.12 environment
        shell: powershell
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "clued-python-312"
          if (Test-Path $venv) { Remove-Item $venv -Recurse -Force }
          python -m venv $venv
          "$venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - run: python scripts/model-program/validate_m0_foundation.py
      - run: python -m unittest tests.test_model_program_m0 -v

  validate-untrusted-hosted:
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.pull_request.head.repo.full_name != github.repository ||
       github.actor != github.repository_owner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - run: python scripts/model-program/validate_m0_foundation.py
      - run: python -m unittest tests.test_model_program_m0 -v
