name: model-program-m0
on:
  pull_request:
    paths: ["development/contracts/model-program/**","scripts/model-program/**","tests/test_model_program_m0.py","tests/fixtures/model-program-m0/**"]
  push:
    branches: [main]
    paths: ["development/contracts/model-program/**","scripts/model-program/**","tests/test_model_program_m0.py","tests/fixtures/model-program-m0/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/model-program/validate_m0_foundation.py
      - run: python -m unittest tests.test_model_program_m0 -v
