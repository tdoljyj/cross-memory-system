name: model-program-m0
on:
  pull_request:
    paths:
      - "development/contracts/model-program/**"
      - "scripts/model-program/**"
      - "tests/test_model_program_m0.py"
      - "tests/fixtures/model-program-m0/**"
      - ".github/workflows/model-program-m0.yml"
  push:
    branches: [main]
    paths:
      - "development/contracts/model-program/**"
      - "scripts/model-program/**"
      - "tests/test_model_program_m0.py"
      - "tests/fixtures/model-program-m0/**"
      - ".github/workflows/model-program-m0.yml"

permissions:
  contents: read

jobs:
  validate-trusted-self-hosted:
    timeout-minutes: 20
    if: >-
      (github.event_name == 'push' &&
       github.actor == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == github.repository_owner)
    runs-on: [self-hosted, Windows, X64, clued, pool-general, trust-internal, cap-python312]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - name: Verify pre-provisioned Python 3.12
        shell: powershell
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
      - name: Prepare isolated Python environment
        shell: powershell
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "clued-python-venv"
          python -m venv $venv
          & "$venv\Scripts\python.exe" -m pip install --disable-pip-version-check jsonschema==4.25.1
          "$venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python scripts/model-program/validate_m0_foundation.py
      - run: python -m unittest tests.test_model_program_m0 -v

  validate-untrusted-hosted:
    timeout-minutes: 20
    if: >-
      (github.event_name == 'push' &&
       github.actor != github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       (github.event.pull_request.head.repo.full_name != github.repository ||
        github.actor != github.repository_owner))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - run: python scripts/model-program/validate_m0_foundation.py
      - run: python -m unittest tests.test_model_program_m0 -v
