name: clued-work-claim-handover-revoke
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  checks: read
  pull-requests: write
concurrency:
  group: clued-work-claim-handover-revoke
  cancel-in-progress: false
jobs:
  revoke:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-slim
    timeout-minutes: 5
    environment: clued-admission
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - name: Reconcile old execution publications and revoke admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLUED_CONTEXT_READ_TOKEN: ${{ secrets.CLUED_ADMISSION_CLUED_TOKEN }}
          CLUED_ADMISSION_APP_ID: ${{ secrets.CLUED_ADMISSION_APP_ID }}
          CLUED_ADMISSION_APP_PRIVATE_KEY: ${{ secrets.CLUED_ADMISSION_APP_KEY }}
        run: node scripts/ci/clued-work-claim-handover.mjs
