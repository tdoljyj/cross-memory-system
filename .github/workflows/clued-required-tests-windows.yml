name: clued-required-tests-windows

# Required check ci-suites-windows (resident ADR 0032): the Windows side of
# ci-suites, on the Windows runner of a resident node's host (self-hosted only,
# Owner Decision 9eb313f8).
#
# The resident and Source v2 code runs on Windows in production, and
# clued-required-tests.yml tests on Linux alone. This workflow runs the same
# selection for the same change (scripts/ci/ci-required-selection.mjs from the
# trusted base checkout), kept to the suites the selection declares for Windows
# (SUITE_PLATFORMS), so a change that breaks only on Windows fails a check
# (#1092 was the mirror case: green on Windows, broken on Linux). A suite of
# one platform only is not selected on the other; nothing selected is a pass.
#
# It is a workflow of its own so that clued-required-tests.yml, whose exact
# bytes are a registered compound Source, stays as it is, and so that this side
# can be disabled alone. The gate job is the same job, byte for byte.
#
# The job carries its required name only when it runs, as in
# clued-required-tests.yml: an untrusted actor, a pull request the gate did not
# admit, or a failed gate gives ci-suites-windows-skipped, so the required check
# stays missing (fail closed). Never rerun failed or single jobs.
#
# The train App's push to clued-train/staging runs it too (ADR 0018 §8, D6 N1),
# exactly as clued-required-tests.yml: ci-suites-windows is required on main, so
# a batch lands only when it succeeded on S. The trusted base is T = S^1,
# checked to be an ancestor of main before any trusted command loads.
on:
  pull_request:
  push:
    branches: [main, clued-train/staging]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/clued-train/staging' && github.sha) || github.ref }}
  # Staging has one group per S, so later batches cannot replace queued CI.
  # Main pushes never cancel a running main run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Work Claim Admission v0.1 §4.6 L0b: admit on the independent CI's own App
  # 5368905 kooyumi-work-admission check for this exact head, polled for at
  # most 10 minutes (Owner Decision 22b0e0ed); base-branch code, no PR code,
  # no Clued token. Its exact bytes are registered in GATE_JOB_SHA256
  # (scripts/ci/clued-work-admission.mjs) before this workflow can be admitted.
  admission-gate:
    name: admission-gate
    runs-on: [self-hosted, Linux, X64, clued, pool-general, trust-internal]
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      admitted: ${{ steps.gate.outputs.admitted }}
      enforced: ${{ steps.gate.outputs.enforced }}
      verdict: ${{ steps.gate.outputs.verdict }}
      automation_self_hosted: ${{ steps.gate.outputs.automation_self_hosted }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      # Owner Decision 22b0e0ed: admit on the independent CI's own App 5368905 kooyumi-work-admission
      # check for this exact head, polled for at most 10 minutes; never on another App's check.
      - id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLUED_ADMISSION_GATE_SOURCE: independent-ci-native-work-admission
          CLUED_ADMISSION_GATE_WAIT_SECONDS: "600"
        run: node scripts/ci/clued-work-admission.mjs --mode gate

  # After the push baseline (git only), one step selects and runs, on the
  # runner's own Node 24 and Python 3.12 (cap-node24, cap-python312; nothing is
  # downloaded).
  ci-suites-windows:
    name: >-
      ${{ needs.admission-gate.outputs.admitted == 'true' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
           (github.event_name == 'push' && github.ref == 'refs/heads/clued-train/staging' &&
            github.actor == 'clued-ci-checks-turing-20261018[bot]') ||
           (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            (github.actor == github.repository_owner || needs.admission-gate.outputs.automation_self_hosted == 'true')))
          && 'ci-suites-windows' || 'ci-suites-windows-skipped' }}
    needs: admission-gate
    if: >-
      needs.admission-gate.outputs.admitted == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/clued-train/staging' &&
        github.actor == 'clued-ci-checks-turing-20261018[bot]') ||
       (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.actor == github.repository_owner || needs.admission-gate.outputs.automation_self_hosted == 'true')))
    runs-on: [self-hosted, Windows, X64, clued, pool-general, trust-internal, cap-node24, cap-python312]
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          path: candidate
      - name: Resolve push baseline before loading trusted commands
        id: train-base
        working-directory: candidate
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/clued-pycache
          WRANGLER_LOG_PATH: ${{ runner.temp }}/clued-wrangler-logs
          STAGING_SHA: ${{ github.sha }}
          PUSH_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -ne 'push') { exit 0 }
          $base = git rev-parse "$($env:STAGING_SHA)^1"
          if ($LASTEXITCODE -ne 0 -or $base -notmatch '^[0-9a-f]{40}$') { exit 1 }
          if ($env:PUSH_REF -eq 'refs/heads/clued-train/staging') {
            # Checkout fetched full history; no candidate code has run.
            # The first parent must be an already trusted main ancestor.
            git merge-base --is-ancestor $base origin/main
            if ($LASTEXITCODE -ne 0) { exit 1 }
            [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "sha=$base`n")
          }
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "ci_base=$base`n")
      - name: Check out the trusted base (selection and commands)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ steps.train-base.outputs.sha || github.event.pull_request.base.sha || github.sha }}
          path: trusted
      - name: Configure job temporary storage
        uses: ./trusted/.github/actions/ci-temporary-storage
      - name: Select and run the suites declared for Windows
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_BASE_SHA: ${{ steps.train-base.outputs.sha || github.event.pull_request.base.sha || steps.train-base.outputs.ci_base }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          & node trusted/scripts/ci/ci-required-selection.mjs --run-selected ci-suites --root candidate
          exit $LASTEXITCODE
