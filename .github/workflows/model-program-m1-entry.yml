name: model-program-m1-entry
on:
  pull_request:
    paths:
      - "development/contracts/model-program/m1/**"
      - "scripts/model-program/validate_m1_entry_bindings.py"
      - "tests/test_model_program_m1_entry.py"
      - ".github/workflows/model-program-m1-entry.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-trusted-self-hosted:
    timeout-minutes: 20
    if: >-
      (github.event_name == 'push' &&
       github.actor == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == github.repository_owner)
    runs-on:
      - self-hosted
      - Windows
      - X64
      - clued
      - pool-general
      - trust-internal
      - cap-python312
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - name: Verify pre-provisioned Python 3.12
        shell: powershell
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
      - run: python scripts/model-program/validate_m1_entry_bindings.py
      - run: python -m unittest tests.test_model_program_m1_entry -v

  validate-untrusted-hosted:
    timeout-minutes: 20
    if: >-
      (github.event_name == 'push' &&
       github.actor != github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       (github.event.pull_request.head.repo.full_name != github.repository ||
        github.actor != github.repository_owner))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - run: python scripts/model-program/validate_m1_entry_bindings.py
      - run: python -m unittest tests.test_model_program_m1_entry -v
