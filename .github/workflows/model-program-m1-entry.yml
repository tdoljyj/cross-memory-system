name: model-program-m1-entry
on:
  pull_request:
    paths:
      - "development/contracts/model-program/m1/**"
      - "scripts/model-program/validate_m1_entry_bindings.py"
      - "tests/test_model_program_m1_entry.py"
      - ".github/workflows/model-program-m1-entry.yml"
  push:
    branches: [main]
    paths:
      - "development/contracts/model-program/m1/**"
      - "scripts/model-program/validate_m1_entry_bindings.py"
      - "tests/test_model_program_m1_entry.py"
      - ".github/workflows/model-program-m1-entry.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-trusted-self-hosted:
    timeout-minutes: 20
    if: >-
      (github.event_name == 'push' &&
       github.actor == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == github.repository_owner)
    runs-on:
      - self-hosted
      - Windows
      - X64
      - clued
      - pool-general
      - trust-internal
      - cap-python312
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify pre-provisioned Python 3.12
        shell: powershell
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
      - run: python scripts/model-program/validate_m1_entry_bindings.py
      - run: python -m unittest tests.test_model_program_m1_entry -v

  validate-untrusted-hosted:
    timeout-minutes: 20
    if: >-
      (github.event_name == 'push' &&
       github.actor != github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       (github.event.pull_request.head.repo.full_name != github.repository ||
        github.actor != github.repository_owner))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/model-program/validate_m1_entry_bindings.py
      - run: python -m unittest tests.test_model_program_m1_entry -v
