name: Multi-Track Governance Projection

on:
  pull_request:
    paths:
      - "development/contracts/multitrack/**"
      - "development/projections/multitrack/**"
      - "scripts/governance/validate_multitrack_projection.py"
      - ".github/workflows/multitrack-governance-projection.yml"
  push:
    branches: [main]
    paths:
      - "development/contracts/multitrack/**"
      - "development/projections/multitrack/**"
      - "scripts/governance/validate_multitrack_projection.py"
      - ".github/workflows/multitrack-governance-projection.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository projection
        run: python scripts/governance/validate_multitrack_projection.py
