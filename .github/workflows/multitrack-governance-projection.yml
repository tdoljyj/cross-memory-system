name: Multi-Track Governance Projection

on:
  pull_request:
    paths:
      - "development/contracts/multitrack/**"
      - "development/projections/multitrack/**"
      - "scripts/governance/validate_multitrack_projection.py"
      - ".github/workflows/multitrack-governance-projection.yml"
  push:
    branches: [main]
    paths:
      - "development/contracts/multitrack/**"
      - "development/projections/multitrack/**"
      - "scripts/governance/validate_multitrack_projection.py"
      - ".github/workflows/multitrack-governance-projection.yml"

permissions:
  contents: read

jobs:
  validate-trusted-self-hosted:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == github.repository_owner)
    runs-on:
      - self-hosted
      - Windows
      - X64
      - clued
      - pool-general
      - trust-internal
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify managed Python 3.12
        shell: powershell
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version; print(sys.executable)"
      - name: Validate repository projection
        run: python scripts/governance/validate_multitrack_projection.py

  validate-untrusted-hosted:
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.pull_request.head.repo.full_name != github.repository ||
       github.actor != github.repository_owner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate repository projection
        run: python scripts/governance/validate_multitrack_projection.py
