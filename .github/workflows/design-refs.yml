# Design-gap prevention, rule B (Task b896173e): every step-list item and
# every deferral sentence in development/contracts/** names its Clued Task or
# Decision. See scripts/ci/check_design_refs.py.
name: design-refs

on:
  pull_request:
    paths:
      - 'development/contracts/**'
      - 'scripts/ci/check_design_refs.py'
      - 'scripts/ci/test_check_design_refs.py'
      - '.github/workflows/design-refs.yml'
  push:
    branches: [main]
    paths:
      - 'development/contracts/**'
      - 'scripts/ci/check_design_refs.py'
      - 'scripts/ci/test_check_design_refs.py'
      - '.github/workflows/design-refs.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Work Claim Admission v0.1 §4.6 L0b: the heavy jobs below run only when
  # Clued admits this pull request. The gate does not call Clued and gets no
  # Clued token (this job runs PR code): it waits for the trusted
  # pull_request_target run of clued-work-admission.yml on this head and reads
  # its result, always enforced (Merge Admission step 6 retired the advisory
  # switch CLUED_WORK_ADMISSION_ENFORCE); non-PR events are admitted.
  # Self-hosted Linux pool, pinned Node (Decision f86179b3).
  admission-gate:
    name: admission-gate
    runs-on: [self-hosted, Linux, X64, clued, pool-general, trust-internal]
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      admitted: ${{ steps.gate.outputs.admitted }}
      enforced: ${{ steps.gate.outputs.enforced }}
      verdict: ${{ steps.gate.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/clued-work-admission.mjs --mode gate

  design-refs-trusted-self-hosted:
    name: >-
      ${{ ((github.event_name == 'push' &&
                     github.actor == github.repository_owner) ||
                    (github.event_name == 'pull_request' &&
                     github.event.pull_request.head.repo.full_name == github.repository &&
                     github.actor == github.repository_owner))
          && 'design-refs' || 'design-refs-self-hosted-skipped' }}
    needs: admission-gate
    if: >-
      needs.admission-gate.outputs.admitted == 'true' &&
      ((github.event_name == 'push' &&
       github.actor == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == github.repository_owner))
    runs-on: [self-hosted, Linux, X64, clued, pool-general, trust-internal]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - run: python3 -m unittest scripts/ci/test_check_design_refs.py
      - run: python3 scripts/ci/check_design_refs.py

  design-refs-untrusted-hosted:
    name: >-
      ${{ ((github.event_name == 'push' &&
                     github.actor != github.repository_owner) ||
                    (github.event_name == 'pull_request' &&
                     (github.event.pull_request.head.repo.full_name != github.repository ||
                      github.actor != github.repository_owner)))
          && 'design-refs' || 'design-refs-hosted-skipped' }}
    needs: admission-gate
    if: >-
      needs.admission-gate.outputs.admitted == 'true' &&
      ((github.event_name == 'push' &&
       github.actor != github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       (github.event.pull_request.head.repo.full_name != github.repository ||
        github.actor != github.repository_owner)))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - run: python3 -m unittest scripts/ci/test_check_design_refs.py
      - run: python3 scripts/ci/check_design_refs.py
