# Candidate External2 Source: separate exact Source/Role acceptance required.
# PR source-only success never qualifies actual publication/revocation.
name: Clued disposable external handover qualification
on:
  pull_request:
    paths:
      - '.github/workflows/clued-handover-external-qualification.yml'
      - '.github/workflows/clued-handover-disposable-idle.yml'
      - 'scripts/ci/clued-handover-external-*'
      - 'scripts/ci/fixtures/clued-handover-*'
      - 'config/clued-handover-external-*'
  workflow_dispatch:
    inputs:
      admission_run_id:
        description: Existing exact workflow/ref dispatch admission
        required: true
        type: string
      phase:
        description: Registered External2 phase
        required: true
        type: choice
        options: [register, publish, revoke]
      idle_run_id:
        description: Exact real idle run; publish only, permanently bound in original journal
        required: false
        type: string
      publisher_run_id:
        description: Exact completed successful original publisher, required for revoke
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: clued-handover-disposable-external-qualification
  cancel-in-progress: false
jobs:
  admission-gate:
    name: admission-gate
    runs-on: [self-hosted, Linux, X64, clued, pool-general, trust-internal]
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      admitted: ${{ steps.gate.outputs.admitted }}
      enforced: ${{ steps.gate.outputs.enforced }}
      verdict: ${{ steps.gate.outputs.verdict }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/clued-work-admission.mjs --mode gate

  qualify:
    name: clued-handover-external2
    needs: admission-gate
    if: >-
      needs.admission-gate.outputs.admitted == 'true' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor_id == '52366662' && github.triggering_actor == github.repository_owner) ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    runs-on: [self-hosted, Linux, X64, clued, trust-internal, handover-native-task617-once]
    timeout-minutes: 25
    environment: ${{ github.event_name == 'workflow_dispatch' && 'clued-admission' || 'clued-handover-source-only' }}
    env:
      QUALIFICATION_PHASE: ${{ inputs.phase }}
      QUALIFICATION_IDLE_RUN_ID: ${{ inputs.idle_run_id }}
      QUALIFICATION_OPERATOR_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.phase == 'register' && 'register-empty-disposable' || '' }}
      QUALIFICATION_PUBLISHER_RUN_ID: ${{ inputs.publisher_run_id }}
      CLUED_HANDOVER_ACCEPTANCE_SHA256: ${{ vars.CLUED_HANDOVER_ACCEPTANCE_SHA256 }}
    permissions:
      contents: read
      actions: write
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse until independent Native E1 qualification
        run: node scripts/ci/clued-handover-native-entry.mjs --check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - name: Verify declared Source path before dependencies
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            node scripts/ci/clued-handover-external-source-check.mjs --candidate-check
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            node scripts/ci/clued-handover-external-source-check.mjs --accepted-check
          else
            exit 1
          fi
      - name: Prepare declared Source runtime
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            node scripts/ci/clued-handover-external-source-check.mjs --candidate-check
          else
            npm ci --prefix apps/clued-cloud
          fi
      - name: Revalidate exact Source after runtime preparation
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            node scripts/ci/clued-handover-external-source-check.mjs --candidate-check
          else
            node scripts/ci/clued-handover-external-source-check.mjs --accepted-check
          fi
      - name: Execute declared source-only or actual External2 path
        env:
          GITHUB_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.phase != 'register' && github.token || '' }}
          CLUED_ADMISSION_APP_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.phase != 'register' && secrets.CLUED_ADMISSION_APP_ID || '' }}
          CLUED_ADMISSION_APP_PRIVATE_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.phase != 'register' && secrets.CLUED_ADMISSION_APP_KEY || '' }}
          QUALIFICATION_DISPOSABLE_PG_URL: ${{ github.event_name == 'workflow_dispatch' && secrets.CLUED_HANDOVER_DISPOSABLE_PG_URL || '' }}
          QUALIFICATION_TEST_CI_PROOF: ${{ github.event_name == 'workflow_dispatch' && inputs.phase != 'register' && secrets.CLUED_HANDOVER_TEST_CI_PROOF || '' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            node scripts/ci/clued-handover-external-source-check.mjs --candidate-check
          elif [ "$QUALIFICATION_PHASE" = register ]; then
            node scripts/ci/clued-handover-external-register.mjs
          else
            node scripts/ci/clued-handover-external-driver.mjs --execute
          fi
      - name: Preserve secret-free actual qualification evidence
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clued-disposable-handover-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/clued-handover-evidence/*.json
          if-no-files-found: error
          retention-days: 30
