name: Self-hosted P8 dual Linux pool validation

on:
  push:
    branches:
      - ci/self-hosted-p8-dual-linux-pool-20260919

permissions:
  contents: read

concurrency:
  group: self-hosted-p8-dual-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-company-linux:
    name: Validate company Linux runner
    runs-on:
      - self-hosted
      - Linux
      - X64
      - clued
      - pool-general
      - trust-internal
      - cap-docker-linux
      - site-company
    timeout-minutes: 5
    steps:
      - name: Verify company Linux Docker engine
        shell: bash
        run: |
          set -euo pipefail
          echo "START=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Runner=${{ runner.name }}"
          test "${{ runner.name }}" = "clued-ci-company-linux-01"
          test "$(command -v docker)" = "/usr/bin/docker"
          docker version --format 'Client={{.Client.Version}} Server={{.Server.Version}}'
          docker info --format 'Server={{.ServerVersion}} OS={{.OSType}} Driver={{.Driver}}'
          docker ps >/dev/null
          volume="clued-p8-${{ github.run_id }}-company"
          docker volume create "$volume" >/dev/null
          docker volume rm "$volume" >/dev/null
          sleep 20
          echo "END=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

  validate-home-linux:
    name: Validate home Linux runner
    runs-on:
      - self-hosted
      - Linux
      - X64
      - clued
      - pool-general
      - trust-internal
      - cap-docker-linux
      - site-home
    timeout-minutes: 5
    steps:
      - name: Verify home Linux Docker engine
        shell: bash
        run: |
          set -euo pipefail
          echo "START=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Runner=${{ runner.name }}"
          test "${{ runner.name }}" = "clued-ci-home-linux-01"
          test "$(command -v docker)" = "/usr/bin/docker"
          docker version --format 'Client={{.Client.Version}} Server={{.Server.Version}}'
          docker info --format 'Server={{.ServerVersion}} OS={{.OSType}} Driver={{.Driver}}'
          docker ps >/dev/null
          volume="clued-p8-${{ github.run_id }}-home"
          docker volume create "$volume" >/dev/null
          docker volume rm "$volume" >/dev/null
          sleep 20
          echo "END=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

# Final rerun after Turing mirrored-network and local-Docker stabilization.
