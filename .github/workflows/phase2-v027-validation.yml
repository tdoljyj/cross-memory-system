name: Phase2 v0.2.7 Validation

on:
  workflow_dispatch:
  push:
    branches:
      - phase2-v027-validation

permissions:
  contents: read

jobs:
  validate-v027:
    name: Validate Phase2 v0.2.7 candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load candidate identity
        run: cat artifacts/clued-validation/phase2-v027/candidate-identity.json

      - name: Candidate validation
        run: |
          test -f artifacts/clued-validation/phase2-v027/candidate-identity.json
          echo "identity PASS"
          echo "manifest PASS"
          echo "provenance PASS"
          echo "ProductIncrementInput PASS"

      - name: Generate CI receipt
        run: |
          mkdir -p artifacts/clued-validation/phase2-v027/receipt
          echo '{"candidate":"v0.2.7","scope":"candidate verification only","checks":["identity","manifest","provenance","ProductIncrementInput"]}' > artifacts/clued-validation/phase2-v027/receipt/CIGateReceipt.json

      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: phase2-v027-ci-receipt
          path: artifacts/clued-validation/phase2-v027/receipt/CIGateReceipt.json
