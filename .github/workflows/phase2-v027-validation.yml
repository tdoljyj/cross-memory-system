name: Phase2 v0.2.7 Validation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validation or the later read-only-token permission check
        type: choice
        default: validate
        options:
          - validate
          - permission_check
  push:
    branches:
      - phase2-v027-validation
      - phase2-naming-surface-inventory

permissions:
  contents: read

jobs:
  validate-v027:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'validate'
    name: Validate Phase2 v0.2.7 candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IDENTITY_PATH: artifacts/clued-validation/phase2-v027/candidate-identity.json
      SOURCE_PATH: artifacts/clued-validation/phase2-v027/candidate-source.json
      NEGATIVE_CONTROL_PATH: artifacts/clued-validation/phase2-v027/negative-test-control.json
      RECEIPT_PATH: artifacts/clued-validation/phase2-v027/receipt/CIGateReceipt.json
      NEGATIVE_MANIFEST_PATH: artifacts/clued-validation/phase2-v027/receipt/NegativeFixtureManifest.json

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - name: Preserve exact accepted Git blob bytes
        shell: bash
        run: |
          mkdir -p .git/info
          printf '* -text\n' > .git/info/attributes
          git checkout-index --all --force

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate exact GitHub Release source binding
        id: source
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - "$IDENTITY_PATH" "$SOURCE_PATH" "$GITHUB_OUTPUT" "$REPOSITORY" <<'PY'
          import json
          import sys

          identity_path, source_path, output_path, repository = sys.argv[1:]
          with open(identity_path, encoding="utf-8") as f:
              identity = json.load(f)
          with open(source_path, encoding="utf-8") as f:
              source = json.load(f)

          candidate = source.get("candidate")
          expected = {
              "filename": identity.get("candidate"),
              "bytes": identity.get("bytes"),
              "members": identity.get("members"),
              "sha256": identity.get("sha256"),
          }
          if candidate != expected:
              raise SystemExit(f"candidate source/identity mismatch: source={candidate!r} identity={expected!r}")

          canonical = source.get("canonical_source")
          if not isinstance(canonical, dict) or canonical.get("provider") != "github_release_asset":
              raise SystemExit("candidate-source.json: canonical GitHub Release asset binding missing")
          if canonical.get("repository") != repository:
              raise SystemExit("candidate-source.json: repository mismatch")
          if canonical.get("asset_bytes") != identity.get("bytes"):
              raise SystemExit("candidate-source.json: release asset bytes mismatch identity")
          expected_digest = "sha256:" + str(identity.get("sha256"))
          if canonical.get("asset_digest") != expected_digest:
              raise SystemExit("candidate-source.json: release asset digest mismatch identity")
          if not isinstance(canonical.get("asset_id"), int) or canonical["asset_id"] <= 0:
              raise SystemExit("candidate-source.json: invalid release asset id")
          if not isinstance(canonical.get("release_id"), int) or canonical["release_id"] <= 0:
              raise SystemExit("candidate-source.json: invalid release id")
          if not isinstance(canonical.get("tag"), str) or not canonical["tag"]:
              raise SystemExit("candidate-source.json: release tag missing")
          if not isinstance(canonical.get("asset_name"), str) or not canonical["asset_name"]:
              raise SystemExit("candidate-source.json: release asset name missing")

          transport = source.get("ci_transport")
          if not isinstance(transport, dict) or transport.get("status") != "READY_PRIVATE_GITHUB_RELEASE_ASSET":
              raise SystemExit("candidate-source.json: CI transport is not ready")
          if transport.get("download_asset_id") != canonical.get("asset_id"):
              raise SystemExit("candidate-source.json: transport asset id mismatch")
          if transport.get("download_asset_name") != canonical.get("asset_name"):
              raise SystemExit("candidate-source.json: transport asset name mismatch")

          with open(output_path, "a", encoding="utf-8") as out:
              out.write(f"tag={canonical['tag']}\n")
              out.write(f"asset_id={canonical['asset_id']}\n")
              out.write(f"asset_name={canonical['asset_name']}\n")
          print(f"source binding: {source.get('binding_id')}")
          print(f"release id: {canonical['release_id']}")
          print(f"asset id: {canonical['asset_id']}")
          print(f"asset digest: {canonical['asset_digest']}")
          PY

      - name: Resolve validation mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          python - "$NEGATIVE_CONTROL_PATH" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          control_path, output_path = sys.argv[1:]
          with open(control_path, encoding="utf-8") as f:
              control = json.load(f)

          allowed = {
              "none",
              "candidate_identity",
              "manifest_integrity",
              "provenance",
              "product_increment_input",
          }
          case = control.get("case")
          declared = control.get("allowed_cases")
          if case not in allowed:
              raise SystemExit(f"unsupported negative test case: {case!r}")
          if not isinstance(declared, list) or set(declared) != allowed:
              raise SystemExit("negative-test control allowed_cases mismatch")
          if control.get("authority_effect") != "NONE":
              raise SystemExit("negative-test control must have authority_effect=NONE")
          if control.get("not_a_release_candidate") is not True:
              raise SystemExit("negative-test control must mark fixtures as not release candidates")

          with open(output_path, "a", encoding="utf-8") as out:
              out.write(f"negative_case={case}\n")
          print(f"validation mode: {case}")
          PY

      - name: Download exact candidate from private GitHub Release
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          RELEASE_ASSET_NAME: ${{ steps.source.outputs.asset_name }}
        run: |
          set -euo pipefail

          candidate_name="$(python - "$IDENTITY_PATH" <<'PY'
          import json
          import sys
          from pathlib import Path
          with open(sys.argv[1], encoding="utf-8") as f:
              identity = json.load(f)
          name = identity["candidate"]
          if not isinstance(name, str) or Path(name).name != name or not name.endswith(".zip"):
              raise SystemExit("invalid candidate filename in identity")
          print(name)
          PY
          )"

          stage_dir="$RUNNER_TEMP/phase2-v027-release"
          candidate_path="$RUNNER_TEMP/$candidate_name"
          rm -rf "$stage_dir"
          mkdir -p "$stage_dir"
          rm -f "$candidate_path"

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$RELEASE_ASSET_NAME" \
            --dir "$stage_dir"

          downloaded="$stage_dir/$RELEASE_ASSET_NAME"
          test -f "$downloaded"
          mv "$downloaded" "$candidate_path"
          echo "candidate source: private GitHub Release $RELEASE_TAG asset $RELEASE_ASSET_NAME"
          echo "path=$candidate_path" >> "$GITHUB_OUTPUT"

      - name: Run actual frozen naming boundary
        if: steps.mode.outputs.negative_case == 'none'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/naming-governance/post_migration.py \
            --repo . --freeze docs/execution-plans/phase2-structure-governance/Phase2StructureFreezeDecision_20260907.json \
            --expected-freeze-sha f40c8af253f811f820e4b3eccc144d63ca3548663810aba10bebb22331661b36 \
            --report artifacts/clued-validation/phase2-v027/receipt/PostMigrationBoundary.json
          python scripts/naming-governance/run.py \
            --bindings docs/execution-plans/phase2-structure-governance/step08-validator-20260907/SourceLocators.json \
            --source-root . --candidate-zip "${{ steps.candidate.outputs.path }}" \
            --node node --report artifacts/clued-validation/phase2-v027/receipt/NamingReceipt.json
          python tests/test_naming_governance_post_migration.py --output-root "$RUNNER_TEMP/phase2-boundary-controls"
          cp "$RUNNER_TEMP/phase2-boundary-controls/FixtureTestReport.json" artifacts/clued-validation/phase2-v027/receipt/BoundaryControls.json
          python -m unittest discover -s tests -p test_naming_governance_publication.py -v
          python -m unittest discover -s tests -p test_naming_governance_trusted_launcher.py -v
          python scripts/naming-governance/ci_execution.py \
            --negative-case none --report artifacts/clued-validation/phase2-v027/receipt/NamingExecution.json

      - name: Run real Candidate / Manifest / Provenance / ProductIncrementInput gates
        if: steps.mode.outputs.negative_case == 'none'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/phase2-v027-validate.py \
            --candidate "${{ steps.candidate.outputs.path }}" \
            --identity "$IDENTITY_PATH" \
            --receipt "$RECEIPT_PATH"
          python scripts/naming-governance/ci_execution.py \
            --negative-case none --report artifacts/clued-validation/phase2-v027/receipt/GateExecution.json

      - name: Run one isolated target-gate negative fixture
        if: steps.mode.outputs.negative_case != 'none'
        shell: bash
        run: |
          python scripts/phase2-v027-negative-harness.py \
            --candidate "${{ steps.candidate.outputs.path }}" \
            --identity "$IDENTITY_PATH" \
            --validator scripts/phase2-v027-validate.py \
            --case "${{ steps.mode.outputs.negative_case }}" \
            --receipt "$RECEIPT_PATH" \
            --fixture-manifest "$NEGATIVE_MANIFEST_PATH" \
            --work-dir "$RUNNER_TEMP/phase2-v027-negative-fixture"

      - name: Upload real positive gate receipt
        if: always() && steps.mode.outputs.negative_case == 'none'
        uses: actions/upload-artifact@v7
        with:
          name: phase2-v027-ci-receipt
          path: |
            ${{ env.RECEIPT_PATH }}
            artifacts/clued-validation/phase2-v027/receipt/GateExecution.json
            artifacts/clued-validation/phase2-v027/receipt/NamingReceipt.json
            artifacts/clued-validation/phase2-v027/receipt/NamingExecution.json
            artifacts/clued-validation/phase2-v027/receipt/PostMigrationBoundary.json
            artifacts/clued-validation/phase2-v027/receipt/BoundaryControls.json
          if-no-files-found: error

      - name: Upload negative gate evidence
        if: always() && steps.mode.outputs.negative_case != 'none'
        uses: actions/upload-artifact@v7
        with:
          name: phase2-v027-negative-${{ steps.mode.outputs.negative_case }}
          path: |
            ${{ env.RECEIPT_PATH }}
            ${{ env.NEGATIVE_MANIFEST_PATH }}
          if-no-files-found: error

  permission-check:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'permission_check'
    name: Verify read-only workflow token cannot create a branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check platform write permission using the read-only workflow token
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/clued-pycache
          WRANGLER_LOG_PATH: ${{ runner.temp }}/clued-wrangler-logs
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          repo = os.environ['GITHUB_REPOSITORY']
          branch = 'phase2-permission-check-' + os.environ['GITHUB_RUN_ID']
          endpoint = 'https://api.github.com/repos/' + repo + '/git/refs'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          payload = json.dumps({'ref':'refs/heads/' + branch, 'sha':os.environ['GITHUB_SHA']}).encode()
          request = urllib.request.Request(endpoint, data=payload, headers=headers, method='POST')
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status, body = response.status, json.load(response)
          except urllib.error.HTTPError as error:
              status, body = error.code, json.loads(error.read())
          record = {'type':'ActualWorkflowTokenPermissionObservation', 'repository':repo,
                    'source_commit':os.environ['GITHUB_SHA'], 'run_id':os.environ['GITHUB_RUN_ID'],
                    'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'], 'credential_class':'GitHub Actions token with contents:read',
                    'operation':'Create a uniquely named temporary branch at this exact existing commit',
                    'attempted_ref':'refs/heads/' + branch,
                    'http_status':status, 'response_message':body.get('message'),
                    'write_denied':status == 403 and body.get('message') == 'Resource not accessible by integration',
                    'step18_pass':False, 'authority_effect':'NONE'}
          with open('PermissionObservation.json', 'w') as stream:
              json.dump(record, stream, indent=2)
          if status == 201:
              cleanup = urllib.request.Request(endpoint + '/heads/' + branch, headers=headers, method='DELETE')
              try:
                  with urllib.request.urlopen(cleanup, timeout=30) as response:
                      record['unexpected_created_branch_cleanup_status'] = response.status
              except urllib.error.HTTPError as error:
                  record['unexpected_created_branch_cleanup_status'] = error.code
              except (urllib.error.URLError, TimeoutError) as error:
                  record['unexpected_created_branch_cleanup_status'] = 'UNKNOWN_NETWORK_ERROR'
          with open('PermissionObservation.json', 'w') as stream:
              json.dump(record, stream, indent=2)
          print(json.dumps(record))
          if not record['write_denied']:
              raise SystemExit('Expected actual platform permission denial was not observed')
          PY

      - name: Retain actual permission observation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase2-readonly-token-permission
          path: ${{ runner.temp }}/PermissionObservation.json
          if-no-files-found: error
