name: Phase2 v0.2.7 Validation

on:
  workflow_dispatch:
    inputs:
      candidate_url:
        description: Optional one-run HTTPS transport for the exact bound candidate; identity digest/bytes/members are still mandatory
        required: false
        type: string
  push:
    branches:
      - phase2-v027-validation

permissions:
  contents: read

jobs:
  validate-v027:
    name: Validate Phase2 v0.2.7 candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IDENTITY_PATH: artifacts/clued-validation/phase2-v027/candidate-identity.json
      SOURCE_PATH: artifacts/clued-validation/phase2-v027/candidate-source.json
      RECEIPT_PATH: artifacts/clued-validation/phase2-v027/receipt/CIGateReceipt.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate exact candidate source binding
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python - "$IDENTITY_PATH" "$SOURCE_PATH" "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          import sys

          identity_path, source_path, output_path = sys.argv[1:]
          with open(identity_path, encoding="utf-8") as f:
              identity = json.load(f)
          with open(source_path, encoding="utf-8") as f:
              source = json.load(f)

          bound = source.get("candidate")
          if not isinstance(bound, dict):
              raise SystemExit("candidate-source.json: candidate binding missing")
          expected = {
              "filename": identity.get("candidate"),
              "bytes": identity.get("bytes"),
              "members": identity.get("members"),
              "sha256": identity.get("sha256"),
          }
          if bound != expected:
              raise SystemExit(f"candidate source/identity mismatch: source={bound!r} identity={expected!r}")

          transport = source.get("ci_transport")
          if not isinstance(transport, dict):
              raise SystemExit("candidate-source.json: ci_transport missing")
          status = transport.get("status", "")
          url = transport.get("https_url", "")
          if url and not isinstance(url, str):
              raise SystemExit("candidate-source.json: https_url must be a string")
          if url and not url.startswith("https://"):
              raise SystemExit("candidate-source.json: https_url must use https://")

          with open(output_path, "a", encoding="utf-8") as out:
              out.write(f"status={status}\n")
              out.write(f"url={url}\n")
          print(f"source binding: {source.get('binding_id')}")
          print(f"canonical provider: {source.get('canonical_source', {}).get('provider')}")
          print(f"CI transport status: {status}")
          PY

      - name: Resolve exact candidate bytes
        id: candidate
        shell: bash
        env:
          DISPATCH_CANDIDATE_URL: ${{ inputs.candidate_url }}
          BOUND_CANDIDATE_URL: ${{ steps.source.outputs.url }}
        run: |
          set -uo pipefail

          if ! candidate_name="$(python - "$IDENTITY_PATH" <<'PY'
          import json
          import sys
          from pathlib import Path

          with open(sys.argv[1], encoding="utf-8") as f:
              identity = json.load(f)
          name = identity["candidate"]
          if not isinstance(name, str) or Path(name).name != name or not name.endswith(".zip"):
              raise SystemExit("invalid candidate filename in identity")
          print(name)
          PY
          )"; then
            echo "::error::Unable to parse a safe candidate filename from identity; Candidate Gate will fail closed"
            candidate_name="phase2-v027-invalid-identity.zip"
          fi

          candidate_path="$RUNNER_TEMP/$candidate_name"
          repo_candidate="artifacts/clued-validation/phase2-v027/$candidate_name"
          rm -f "$candidate_path" "$candidate_path.part"

          if [[ -f "$repo_candidate" ]]; then
            cp "$repo_candidate" "$candidate_path"
            echo "candidate source: repository file"
          else
            candidate_url="${DISPATCH_CANDIDATE_URL:-${BOUND_CANDIDATE_URL:-}}"
            if [[ -n "$candidate_url" ]]; then
              if [[ "$candidate_url" != https://* ]]; then
                echo "::error::candidate URL must use https://; Candidate Gate will fail closed"
              elif curl --fail --location --retry 3 --retry-all-errors --proto '=https' --tlsv1.2 \
                    --output "$candidate_path.part" "$candidate_url"; then
                mv "$candidate_path.part" "$candidate_path"
                echo "candidate source: HTTPS transport (exact identity is verified next)"
              else
                rm -f "$candidate_path.part"
                echo "::error::Candidate download failed; Candidate Gate will fail closed"
              fi
            else
              echo "::error::Exact candidate is bound in $SOURCE_PATH, but no runner-fetchable private transport is available. Candidate Gate will fail closed"
            fi
          fi

          echo "path=$candidate_path" >> "$GITHUB_OUTPUT"

      - name: Run real Candidate / Manifest / Provenance / ProductIncrementInput gates
        shell: bash
        run: |
          python scripts/phase2-v027-validate.py \
            --candidate "${{ steps.candidate.outputs.path }}" \
            --identity "$IDENTITY_PATH" \
            --receipt "$RECEIPT_PATH"

      - name: Upload real gate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-v027-ci-receipt
          path: artifacts/clued-validation/phase2-v027/receipt/CIGateReceipt.json
          if-no-files-found: error
