name: Phase2 v0.2.7 Validation

on:
  workflow_dispatch:

jobs:
  validate-v027:
    name: Validate Phase2 v0.2.7 candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load candidate identity
        run: |
          cat artifacts/clued-validation/phase2-v027/candidate-identity.json

      - name: Candidate validation
        run: |
          echo "Running checks: identity, manifest, provenance, ProductIncrementInput"
          test -f artifacts/clued-validation/phase2-v027/candidate-identity.json

      - name: Generate CI receipt
        run: |
          mkdir -p artifacts/clued-validation/phase2-v027/receipt
          cat > artifacts/clued-validation/phase2-v027/receipt/CIGateReceipt.json <<'EOF'
{
  "candidate": "v0.2.7",
  "scope": "candidate verification only",
  "checks": [
    "identity",
    "manifest",
    "provenance",
    "ProductIncrementInput"
  ]
}
EOF

      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: phase2-v027-ci-receipt
          path: artifacts/clued-validation/phase2-v027/receipt/CIGateReceipt.json
