name: clued-work-admission-dispatch
run-name: admit ${{ inputs.workflow }} ${{ inputs.ref }} ${{ inputs.claim_id }}

# Work Claim Admission v0.1 §4.6, hand dispatch (Owner Decision 75abfe80,
# Task 29128827). Agents act through the Owner's account, so a heavy workflow
# dispatched by hand must first have its claim verified here:
#
#   1. Dispatch this workflow on the default branch with the heavy workflow,
#      the ref it will run on and the claim id. This run verifies the claim
#      with Clued and is named "admit <workflow> <ref> <claim_id>".
#   2. Dispatch the heavy workflow on that ref with admission_run_id = this
#      run's id. Its admission-gate admits only when this run succeeded on the
#      default branch within 30 minutes and names that workflow and ref.
#
# The Clued token comes from the `clued-admission` environment, whose
# deployment branches are limited to main; the job also refuses any other ref.
# Default-branch code only, hosted runner, no application dependency install.

on:
  workflow_dispatch:
    inputs:
      workflow:
        description: Heavy workflow that will be dispatched
        required: true
        type: choice
        options:
          - clued-connection-authorization.yml
          - clued-g4-database.yml
          - information-flow-e2e.yml
          - clued-handover-external-qualification.yml
          - clued-handover-disposable-idle.yml
          - clued-standard-runner-actor-qualification.yml
      ref:
        description: Branch or tag the heavy workflow will run on
        required: true
        type: string
      claim_id:
        description: Live Clued work claim covering this run
        required: true
        type: string
      scope:
        description: Claim scope, global or project:<canonical_project_id>
        required: false
        default: global
        type: string

permissions:
  contents: read

jobs:
  admit:
    name: clued-work-admission-dispatch
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-slim
    timeout-minutes: 5
    environment: clued-admission
    steps:
      # Re-review 4, m6: the default branch as it is now, so a re-run of an
      # old run does not replay that run's older code with today's secrets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - name: Verify the work claim with Clued
        env:
          ADMIT_WORKFLOW: ${{ inputs.workflow }}
          ADMIT_REF: ${{ inputs.ref }}
          ADMIT_CLAIM_ID: ${{ inputs.claim_id }}
          ADMIT_SCOPE: ${{ inputs.scope }}
          CLUED_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CLUED_CONTEXT_READ_TOKEN: ${{ secrets.CLUED_ADMISSION_CLUED_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/clued-work-admission.mjs --mode dispatch-admit
      - name: Export the closed local natural R9 packet
        if: ${{ always() }}
        run: node scripts/ci/merge-admission-source-producer.mjs --export admission
      - name: Preserve natural R9 source observations
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: clued-r9-natural-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: .clued-r9-source-events/sealed/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/natural-packet.json
          if-no-files-found: warn
          retention-days: 90
