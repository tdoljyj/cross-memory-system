name: Clued Integration Runtime config

# IntegrationRuntime v0.1.8 §12.1, enablement stage C (Owner Decision 85616c43).
# enable / disable set the production Worker's CLUED_INTEGRATION_RUNTIME_V1
# secret (unset or false = off). The flag is global: it applies to every account
# at once. enable first checks, read-only, that production carries the stage C
# grant migration and the database security hygiene migration, and that the
# Integration public RPCs have exactly the §5.13 EXECUTE grants as that hygiene
# migration narrowed them (Binding path: anon only, since the Worker calls it
# with the publishable key; Native and Operator paths: authenticated only);
# otherwise it stops before touching the Worker. disable has no precondition, so
# it is always available as the rollback. Each run must name the authorizing
# Decision. No repository code is checked out or run.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: enable or disable the Integration Runtime flag on the production Worker
        type: choice
        options:
          - disable
          - enable
        default: disable
      decision_id:
        description: Clued Decision UUID that authorizes this run
        type: string
        required: true

permissions:
  contents: read

env:
  WORKER_NAME: clued-cloud
  WRANGLER: wrangler@4.125.0

jobs:
  configure:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    # The deploy token and the attestation database URL are secrets of the
    # clued-release environment (main only), never repository secrets.
    environment: clued-release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: clued-integration-runtime-config
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - name: Validate inputs and credentials
        env:
          MODE: ${{ inputs.mode }}
          DECISION_ID: ${{ inputs.decision_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLUED_CLOUDFLARE_DEPLOY_TOKEN_V2 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLUED_CLOUDFLARE_ACCOUNT_ID }}
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/clued-pycache
          WRANGLER_LOG_PATH: ${{ runner.temp }}/clued-wrangler-logs
        run: |
          set -euo pipefail
          [[ "$MODE" =~ ^(enable|disable)$ ]] || { echo "unknown mode"; exit 1; }
          [[ "$DECISION_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "decision_id must be a lowercase UUID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "decision_id=$DECISION_ID mode=$MODE"
      # Read-only: the attestation role reads the catalog and schema_migrations.
      - name: Check the §5.13 grants are in production
        if: inputs.mode == 'enable'
        working-directory: ${{ runner.temp }}
        env:
          CLUED_ATTESTATION_DATABASE_URL: ${{ secrets.CLUED_ATTESTATION_DATABASE_URL_V2 }}
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/clued-pycache
          WRANGLER_LOG_PATH: ${{ runner.temp }}/clued-wrangler-logs
        run: |
          set -euo pipefail
          test -n "$CLUED_ATTESTATION_DATABASE_URL"
          # The URL is written for node-postgres; libpq reads sslmode=no-verify as an error.
          database_url=$(node -e 'const url = new URL(process.env.CLUED_ATTESTATION_DATABASE_URL); url.searchParams.delete("uselibpqcompat"); if (url.searchParams.get("sslmode") === "no-verify") url.searchParams.set("sslmode", "require"); process.stdout.write(url.toString())')
          echo "::add-mask::$database_url"
          result=$(docker run --rm -i -e DATABASE_URL="$database_url" postgres:17-alpine \
            sh -c 'psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -X -tA' <<'SQL'
          with expected(f, anon, authenticated) as (values
            ('public.clued_integration_request_open_v1(text,jsonb)', true, false),
            ('public.clued_integration_create_or_bind_v1(text,jsonb)', true, false),
            ('public.clued_integration_identity_update_v1(text,jsonb)', true, false),
            ('public.clued_integration_reconcile_request_v1(text,jsonb)', true, false),
            ('public.clued_integration_status_v1(text,jsonb)', true, false),
            ('public.clued_integration_declare_v1(text,jsonb)', true, false),
            ('public.clued_integration_report_v1(text,jsonb)', true, false),
            ('public.clued_integration_verify_v1(text,jsonb)', true, false),
            ('public.clued_integration_revoke_self_v1(text,jsonb)', true, false),
            ('public.clued_user_integration_v1(jsonb)', false, true),
            ('public.clued_admin_integration_v1(jsonb)', false, true)),
          migrations(name) as (values ('integration_runtime_grants'), ('db_security_hygiene')),
          problems as (
            select 'migration ' || m.name || ' is recorded '
                || (select count(*) from supabase_migrations.schema_migrations s where s.name = m.name)
                || ' times' p
              from migrations m
             where (select count(*) from supabase_migrations.schema_migrations s where s.name = m.name) <> 1
            union all
            select 'missing function ' || e.f from expected e where to_regprocedure(e.f) is null
            union all
            select 'wrong EXECUTE on ' || e.f from expected e
             where to_regprocedure(e.f) is not null
               and (has_function_privilege('anon', to_regprocedure(e.f), 'execute') is distinct from e.anon
                 or has_function_privilege('authenticated', to_regprocedure(e.f), 'execute') is distinct from e.authenticated
                 or has_function_privilege('service_role', to_regprocedure(e.f), 'execute')
                 or exists (select 1 from aclexplode((select proacl from pg_proc where oid = to_regprocedure(e.f))) a
                             where a.grantee = 0 and a.privilege_type = 'EXECUTE'))
            union all
            select 'EXECUTE on private ' || p.oid::regprocedure::text from pg_proc p
              join pg_namespace n on n.oid = p.pronamespace
             where n.nspname = 'clued_private' and p.proname like 'integration\_%'
               and (has_function_privilege('anon', p.oid, 'execute') or has_function_privilege('authenticated', p.oid, 'execute')
                 or has_function_privilege('service_role', p.oid, 'execute')))
          select coalesce(string_agg(p, '; ' order by p), 'ok') from problems;
          SQL
          )
          if [ "$result" != "ok" ]; then
            echo "::error::Production does not carry exactly the §5.13 grants; the flag stays as it is: $result"
            exit 1
          fi
          echo "§5.13 grants verified in production"
      - name: Set Worker Integration Runtime flag
        working-directory: ${{ runner.temp }}
        env:
          MODE: ${{ inputs.mode }}
          DECISION_ID: ${{ inputs.decision_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLUED_CLOUDFLARE_DEPLOY_TOKEN_V2 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLUED_CLOUDFLARE_ACCOUNT_ID }}
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/clued-pycache
          WRANGLER_LOG_PATH: ${{ runner.temp }}/clued-wrangler-logs
        run: |
          set -euo pipefail
          value=false; [[ "$MODE" == enable ]] && value=true
          printf '%s' "$value" | npx --yes "$WRANGLER" secret put CLUED_INTEGRATION_RUNTIME_V1 --name "$WORKER_NAME"
          set_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # The secret's value cannot be read back; its presence can.
          npx --yes "$WRANGLER" secret list --name "$WORKER_NAME" --format json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{if(!JSON.parse(s).some(x=>x.name==="CLUED_INTEGRATION_RUNTIME_V1")){console.error("::error::CLUED_INTEGRATION_RUNTIME_V1 is not listed after the put");process.exit(1)}})'
          echo "CLUED_INTEGRATION_RUNTIME_V1=$value set_at=$set_at"
          # The run's record of which Decision changed the flag, and when.
          printf '| mode | value | decision_id | set_at | workflow commit |\n|---|---|---|---|---|\n| %s | %s | %s | %s | %s |\n' \
            "$MODE" "$value" "$DECISION_ID" "$set_at" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
