name: clued-ci-usage-report

# Merge Admission v0.1 §12.1 (Task f70546e5): CI usage measurement, version 1.
# Daily, and by hand, this reads the workflow runs, their jobs and the
# merged pull requests of a window (scripts/ci/ci-usage-report.mjs) and
# reports self-hosted minutes by workflow, queue times, runs and heads per
# merged pull request, re-runs and admission-gate minutes, as a JSON artifact
# and a step summary. Metrics not proven by the available scoped evidence
# are reported as not measured, with the reason.
# After job collection, the measurement App also reads complete admission
# histories for heads associated with merged PRs and their commit ancestry.
# Unknown attribution stays unknown; ancestry candidates and later-head
# cancellation observations do not prove update-main rounds or cancellation
# causes. Historical Clued queue/claim metrics remain explicitly unmeasured.
#
# The measurement runs only here, never on a laptop: on 2026-10-07 a local
# collector spent an account's whole hourly API quota and a pull request's
# runner check was refused. It reads with an installation token of the
# measurement-only read-only GitHub App (actions, checks, contents, issues and
# pull requests read; Owner Decision 00b71629), whose ID and key come from the
# clued-admission environment (deployment branches limited to main), and
# stops at 2,000 requests. Without the App it falls back to this workflow's
# read-only GITHUB_TOKEN, whose pool is shared with the admission gates,
# admission and re-verification, and stops at 200. Either way it stops when
# the remaining quota is below 600, never retries, and caches each completed
# run's jobs in .ci-usage-cache/ so a run is read once. The schedule is a
# quiet hour (03:23 UTC), daily: about 1,000 runs a day is more job lists
# than one run reads in its time budget, so the cache fills up over the days
# (Owner Decision 5ca9ecc5).
#
# Hosted runner, default-branch code, no pull request trigger: a pull request
# never runs its own copy, and the measurement takes no self-hosted capacity.

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: "Report usage or qualify the existing audit-only clock reader; qualification never starts T0"
        type: choice
        default: report
        options:
          - report
          - qualify_clock_reader
      days:
        description: "Window in days, an integer from 1 to 14"
        type: number
        default: 7

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read

# One measurement at a time: a second one would spend the same requests on
# the same runs before the first saved its cache.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  report:
    name: clued-ci-usage-report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: clued-admission
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          persist-credentials: false
      - name: Configure job temporary storage
        uses: ./.github/actions/ci-temporary-storage
      - name: Self-test the usage report (no network, mocked fetch)
        run: |
          node --test scripts/ci/ci-usage-report.test.mjs
          node --test scripts/ci/merge-admission-r9-collector.test.mjs
          node --test scripts/ci/merge-admission-clock-bootstrap.test.mjs
      # Collector tests use checkout-relative helpers. Private review folders
      # are neither restored nor used by this default-branch workflow.
      # Cache entries are immutable, so each run saves under its own key and
      # restores the newest earlier one.
      - name: Restore and save the per-run job cache
        if: ${{ inputs.operation != 'qualify_clock_reader' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-usage-cache
          key: ci-usage-v1-${{ github.run_id }}
          restore-keys: |
            ci-usage-v1-
      - name: Measure CI usage
        if: ${{ inputs.operation != 'qualify_clock_reader' }}
        env:
          CI_USAGE_DAYS: ${{ inputs.days || 7 }}
          CLUED_MEASURE_APP_ID: ${{ secrets.CLUED_MEASURE_APP_ID }}
          CLUED_MEASURE_APP_KEY: ${{ secrets.CLUED_MEASURE_APP_KEY }}
          # R9 proposes a separate, explicitly accepted audit-only reader.
          # This source does not create a credential or install a Secret.
          # Missing/unaccepted identity leaves the clock NOT_MEASURED; never
          # borrow the admission writer's credential or enlarge its scopes.
          CLUED_CONTEXT_READ_TOKEN: ${{ secrets.CLUED_R9_CLOCK_READ_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/ci-usage-report.mjs
      - name: Qualify the existing audit-only clock reader
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'qualify_clock_reader' }}
        env:
          CLUED_CONTEXT_READ_TOKEN: ${{ secrets.CLUED_R9_CLOCK_READ_TOKEN }}
        run: node scripts/ci/merge-admission-clock-bootstrap.mjs
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-usage-report
          path: ci-usage-report.json
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve sealed R9 incremental packets
        if: ${{ !cancelled() && inputs.operation != 'qualify_clock_reader' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: merge-admission-r9-sealed-packets
          path: r9-sealed-packet.json
          if-no-files-found: warn
          retention-days: 90
