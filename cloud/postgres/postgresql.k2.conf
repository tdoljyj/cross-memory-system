# Clued R5 K2 database logging contract.
# Include from the environment-specific postgresql.conf. These settings keep
# diagnostics while preventing SQL text and bind values from entering ordinary
# PostgreSQL logs or error traces.
log_statement = 'none'
log_min_error_statement = 'panic'
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_error_verbosity = 'terse'
log_duration = off
log_connections = off
log_disconnections = off
