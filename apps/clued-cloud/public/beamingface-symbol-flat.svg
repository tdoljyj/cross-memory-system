<!-- BeamingFace 笑脸 Logo · 脸 M2b · v0.6 候选 r6 · 20261021。平面版：几何取 Fluent Flat，脸 #FDAC5F / 眼 #4A2A1A / 口 #93301B / 牙 #FFFFFF / 腮红 #F7336E 34% 平面椭圆；嘴/牙几何同彩色版（嘴形 + 上牙梯形 + 下牙药丸，裁切在嘴形内，整体缩 0.88），不留牙缝，接合处补平，上牙底缘 6 级阶梯暖灰咬合阴影；供 24–32 px 使用。 图形 = 脸 M2b：Fluent Emoji "Beaming face with smiling eyes" Color（Microsoft，MIT）全套渲染沿用；脸色相 −8°、亮度 ×1.10、饱和 ×0.97；脸缘粉光转红橙（+37°，同样提亮）；口腔 #E25F3A→#93301B、牙影 #F6E6D8、唇影 #E0A07A、眼 #4A2A1A；去眼下投影层；眼描边显式 fill=none；嘴外形上缘弧 0.7 / 底圆 0.6，上下牙 3 条原路径不动裁切在新嘴形内，整组绕 (16,21) 缩 0.88（= 第 8 轮 M2）；腮红改为 Fluent 原生径向渐变做法（取自 Smiling face with smiling eyes：圆 r 5.6、心 (7.5/24.5,16.0)、#F7336E 0.59 → #FF7FA0 0，整体不透明度 0.5）= 第 9 轮 B5。 须随附 MIT 许可声明。Owner 2026-10-21：第 8 轮选 M2；第 9 轮"留在 M2 只做精修"并选腮红 B5；加做 ③ 单色、②④ 微光晕、⑤ 16px 手调、⑥ 微动效。品牌名依 Decision 2a0448d2 v1 / Event 13720。候选，非定稿。 -->
