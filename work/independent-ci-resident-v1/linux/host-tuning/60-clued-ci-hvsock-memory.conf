# Clued resident CI: WSL host tuning (Task 7c2e4386). Created by linux/host-tuning/clued-wsl-host-tuning apply.
# Every hv_sock connection Windows opens into the VM gets a VMBus ring sized from these socket defaults:
# 2 x 64 KiB = one order-5 allocation instead of 2 x 208 KiB = order 7 (the allocation that failed on 2026-10-22).
net.core.rmem_default = 65536
net.core.wmem_default = 65536
# kswapd wakes earlier and keeps about 2% of each zone free (kernel default 10 = 0.1%).
vm.watermark_scale_factor = 200
# The boost cap is a fraction of the high watermark, which the line above raises about 4x: 3500 instead of 15000
# keeps the cap at today's absolute size (about 65 MiB in DMA32, 34 MiB in Normal).
vm.watermark_boost_factor = 3500
